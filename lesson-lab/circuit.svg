<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Tinkercad-style Arduino Uno R3: pin 9, 220 ohm resistor, LED and GND</title>
<desc id="desc">A guide drawing, not a simulator screenshot. Uno R3 is shown with USB on the left, digital pins at the top and power pins below. Green wire 1 joins top digital pin 9 to a 220 ohm resistor; wire 2 joins the resistor to the LED anode on the right; wire 3 joins its left cathode to GND in the lower POWER row.</desc>
