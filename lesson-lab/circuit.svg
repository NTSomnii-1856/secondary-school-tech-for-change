<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Arduino pin 9 to resistor to LED to GND</title><desc id="desc">Three wires connect pin 9 to a 220 ohm resistor, the resistor to the LED anode, and the LED cathode to GND. The resistor is in series with the LED.</desc><rect width="760" height="330" rx="12" fill="#f9fbf4"/><g font-family="Arial,sans-serif" fill="#253631"><rect x="25" y="75" width="235" height="185" rx="12" fill="#dce9dd" stroke="#214e45" stroke-width="3"/><text x="50" y="112" font-size="18" font-weight="bold">Arduino Uno</text><rect x="55" y="135" width="75" height="58" rx="5" fill="#214e45"/><text x="56" y="232" font-size="13">DIGITAL OUTPUT</text><circle cx="246" cy="145" r="7" fill="#c74b3f"/><circle cx="246" cy="225" r="7" fill="#253631"/><text x="178" y="151" font-size="18" font-weight="bold">9</text><text x="168" y="231" font-size="18" font-weight="bold">GND</text><path d="M254 145 H350" stroke="#b84e41" stroke-width="5" fill="none"/><rect x="350" y="132" width="100" height="26" rx="7" fill="#e4cc9d" stroke="#846841" stroke-width="2"/><path d="M373 133 V157 M385 133 V157" stroke="#b54134" stroke-width="6"/><path d="M397 133 V157" stroke="#744536" stroke-width="6"/><path d="M435 133 V157" stroke="#a18a42" stroke-width="5"/><text x="360" y="112" font-size="18" font-weight="bold">220 Ω</text><text x="357" y="188" font-size="14">RESISTOR</text><path d="M450 145 H510 V190 H548" stroke="#b84e41" stroke-width="5" fill="none"/><path d="M548 156 V190 M584 156 V178" stroke="#586459" stroke-width="5" fill="none"/><path d="M539 156 V130 C539 98 594 98 594 130 V156 Z" fill="#ee8b73" stroke="#8a433a" stroke-width="3"/><text x="537" y="89" font-size="18" font-weight="bold">LED</text><path d="M584 178 V225 H254" stroke="#253631" stroke-width="5" fill="none"/><text x="614" y="143" font-size="15">ANODE (+)</text><text x="614" y="164" font-size="13">long leg</text><path d="M609 146 L551 183" stroke="#6d7c65" stroke-width="1.5" fill="none"/><text x="614" y="212" font-size="15">CATHODE (−)</text><text x="614" y="233" font-size="13">short leg</text><path d="M609 211 L585 181" stroke="#6d7c65" stroke-width="1.5" fill="none"/><g font-size="15" font-weight="bold" text-anchor="middle"><circle cx="306" cy="123" r="14" fill="#d4ec9b" stroke="#7e906c"/><text x="306" y="128">1</text><circle cx="494" cy="123" r="14" fill="#d4ec9b" stroke="#7e906c"/><text x="494" y="128">2</text><circle cx="420" cy="249" r="14" fill="#d4ec9b" stroke="#7e906c"/><text x="420" y="254">3</text></g><text x="47" y="302" font-size="14">9 → resistor → LED anode (+) · LED cathode (−) → GND</text></g></svg>
