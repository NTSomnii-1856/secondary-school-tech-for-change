<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 7 Week 8 · Ten-second clicker</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122-clear"><script>window.GAME_LESSON={"year": 7, "week": 8, "title": ["Ten-second clicker", "Кликер на десять секунд", "十秒点击挑战", "קליקר בעשר שניות"], "platform": "Arduino · Tinkercad Circuits", "context": ["Make a game for your school arcade", "Игра для школьной аркады", "为学校街机活动制作游戏", "צרו משחק לארקדת בית הספר"], "brief": ["How many new button presses can you make before time runs out? Build the game, then challenge a partner under the same rules.", "Сколько новых нажатий успеешь сделать? Создай игру и вызови напарника на тех же условиях.", "时间结束前你能完成多少次新的按下？制作游戏，用相同规则挑战同伴。", "כמה לחיצות חדשות תצליחו לעשות לפני שהזמן נגמר? בנו משחק ואתגרו בן זוג באותם כללים."], "objectives": [["Read a push button and count one point per new press.", "Читать кнопку и считать очко за новое нажатие.", "读取按钮，每次新的按下计一分。", "לקרוא כפתור ולספור נקודה לכל לחיצה חדשה."], ["Use a simple for countdown and show scores in Serial Monitor.", "Использовать простой отсчёт for и показывать счёт в Serial Monitor.", "用简单的 for 倒计时，在 Serial Monitor 显示分数。", "להשתמש בספירת for פשוטה ולהציג ניקוד ב־Serial Monitor."], ["Explain how the supplied timer makes the round fair.", "Объяснить, как таймер делает раунд честным.", "解释提供的计时器怎样让回合公平。", "להסביר כיצד הטיימר המסופק הופך את הסיבוב להוגן."]], "launch": {"url": "https://www.tinkercad.com/circuits", "label": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתחו Tinkercad Circuits"]}, "figure": "../../game-studio/diagrams/clicker-wiring.svg", "figureCaption": ["Uno: button Terminal 1a → D2, Terminal 2a → GND. D8 → 220 Ω → LED +; LED − → GND.", "Uno: Terminal 1a кнопки → D2, Terminal 2a → GND. D8 → 220 Ом → LED +; LED − → GND.", "Uno：按钮 Terminal 1a → D2，Terminal 2a → GND。D8 → 220 Ω → LED 正极，负极 → GND。", "Uno: מגע Terminal 1a בכפתור ל־D2, ‏Terminal 2a ל־GND. ‏D8 לנגד 220Ω ולפלוס בנורית; מינוס ל־GND."], "setup": [["Sign in with your school Tinkercad account. Create a new Circuit.", "Войди в школьный Tinkercad и создай Circuit.", "登录学校 Tinkercad 账户，新建 Circuit。", "היכנסו לחשבון Tinkercad הבית ספרי וצרו Circuit חדש."], ["Add an Arduino Uno R3, push button, LED and 220 Ω resistor. Connect them as shown.", "Добавь Uno R3, кнопку, LED и резистор 220 Ом. Соедини по схеме.", "添加 Uno R3、按钮、LED 和 220 Ω 电阻，按图接线。", "הוסיפו Uno R3, כפתור, נורית ונגד 220Ω. חברו לפי התרשים."], ["Hover over button legs to read their terminal names. Leave 1b and 2b unused.", "Наведи курсор на ножки для названий. Оставь 1b и 2b свободными.", "鼠标移到按钮引脚查看端子名称，1b 和 2b 留空。", "רחפו מעל רגלי הכפתור כדי לקרוא את שמות המגעים. השאירו 1b ו־2b פנויים."]], "cards": {"pull": {"title": "INPUT_PULLUP", "meaning": ["Uses a resistor inside the Uno. The button joins D2 to GND: released is HIGH (1), pressed is LOW (0).", "Включает внутренний резистор Uno. Кнопка соединяет D2 с GND: отпущена — HIGH (1), нажата — LOW (0).", "启用 Uno 内部电阻。按钮把 D2 接到 GND：松开为 HIGH（1），按下为 LOW（0）。", "משתמש בנגד בתוך ה־Uno. הכפתור מחבר D2 ל־GND: משוחרר הוא HIGH ‏(1), לחוץ הוא LOW ‏(0)."], "example": "pinMode(2, INPUT_PULLUP);"}, "read": {"title": "digitalRead()", "meaning": ["Reads whether the button is pressed now. It does not count presses.", "Читает, нажата ли кнопка сейчас. Нажатия не считает.", "读取按钮现在是否被按下，不会自动计数。", "קורא אם הכפתור לחוץ עכשיו. אינו סופר לחיצות."], "example": "digitalRead(2)"}, "serial": {"title": "Serial.begin() / print() / println()", "meaning": ["begin(9600) starts messages. print() keeps the next value on the same line; println() adds a new line. Text in quotes is a message. Without quotes, a variable shows its stored value. Open Serial Monitor below the code.", "begin(9600) включает сообщения. print() оставляет следующее значение в той же строке; println() переходит на новую. Текст в кавычках — сообщение. Переменная без кавычек показывает своё значение. Открой Serial Monitor под кодом.", "begin(9600) 开启消息。print() 让下一项留在同一行，println() 换行。引号中的文字是消息，没有引号的变量显示保存的值。在代码下方打开 Serial Monitor。", "begin(9600) מפעיל הודעות. print() משאיר את הערך הבא באותה שורה; println() מוסיף שורה חדשה. טקסט במירכאות הוא הודעה. משתנה בלי מירכאות מציג את ערכו. פתחו Serial Monitor מתחת לקוד."], "example": "Serial.begin(9600);\nSerial.println(\"Ready\");"}, "score": {"title": "int / score = score + 1", "meaning": ["int stores a whole number. score begins at 0. Adding 1 gives one point.", "int хранит целое число. score начинается с 0. Прибавление 1 даёт очко.", "int 保存整数。score 从 0 开始，加 1 就是一分。", "int שומר מספר שלם. score מתחיל ב־0. הוספת 1 נותנת נקודה."], "example": "int score = 0;\nscore = score + 1;"}, "edge": {"title": "previous / &&", "meaning": ["previous remembers the last reading. && means AND. Count only when the button is pressed now AND was released before. A hold earns no extra points.", "previous помнит прошлое значение. && означает И. Считай только если сейчас нажата И до этого была отпущена. Удержание не даёт лишних очков.", "previous 记住上一次读数。&& 表示“并且”。只在现在按下、上次松开时计分，按住不会重复加分。", "previous זוכר את הקריאה הקודמת. && פירושו וגם. סופרים רק כשלחוץ עכשיו וגם היה משוחרר קודם. החזקה אינה מוסיפה נקודות."], "example": "if (button == LOW && previous == HIGH) {\n  score = score + 1;\n}\nprevious = button;"}, "for": {"title": "for", "meaning": ["Start count at 3. Repeat while count is above 0. After each turn, take away 1. The body runs for 3, 2 and 1.", "Начни count с 3. Повторяй, пока count больше 0. После каждого повтора вычти 1. Блок выполнится для 3, 2 и 1.", "count 从 3 开始，大于 0 时重复，每次结束减 1。代码依次处理 3、2、1。", "התחילו count ב־3. חזרו כל עוד count גדול מ־0. אחרי כל חזרה הורידו 1. הבלוק פועל עבור 3, 2 ו־1."], "example": "for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);  // Show 3, then 2, then 1.\n    delay(1000);            // Wait one second each time.\n  }\n  Serial.println(\"GO!\");"}, "delay": {"title": "delay()", "meaning": ["Pauses the program. 1000 milliseconds is one second. During a countdown pause the game is not counting clicks.", "Приостанавливает программу. 1000 миллисекунд — секунда. Во время отсчёта клики не считаются.", "暂停程序。1000 毫秒等于一秒。倒计时暂停期间不计点击。", "משהה את התוכנית. 1000 אלפיות שנייה הן שנייה אחת. בזמן ההמתנה בספירה לא סופרים לחיצות."], "example": "delay(1000);"}, "clock": {"title": "millis() / startTime", "meaning": ["millis() reads the Uno’s running clock in milliseconds. startTime saves the reading at GO. Subtract it to find how long this round has lasted.", "millis() читает часы Uno в миллисекундах. startTime сохраняет время GO. Вычитание даёт длительность раунда.", "millis() 读取 Uno 运行时钟，单位为毫秒。startTime 保存 GO 时的读数，相减得到本轮经过时间。", "millis() קורא את שעון ה־Uno באלפיות שנייה. startTime שומר את הקריאה ב־GO. החיסור נותן כמה זמן עבר בסיבוב."], "example": "startTime = millis();\nif (millis() - startTime \u003c roundTime) {"}, "time": {"title": "unsigned long / roundTime", "meaning": ["unsigned long stores a large, non-negative whole number for the clock. roundTime = 10000 gives a ten-second round.", "unsigned long хранит большое неотрицательное целое число для времени. roundTime = 10000 задаёт десять секунд.", "unsigned long 保存时钟用的较大非负整数。roundTime = 10000 表示十秒。", "unsigned long שומר מספר שלם גדול ולא שלילי עבור השעון. roundTime = 10000 נותן סיבוב של עשר שניות."], "example": "unsigned long startTime;\nunsigned long roundTime = 10000;"}, "finish": {"title": "finished / else if", "meaning": ["After time runs out, else if checks finished. 0 means the result has not been shown. Printing it then setting finished to 1 stops repeated final messages.", "После времени else if проверяет finished. 0 — итог ещё не показан. Вывод и finished = 1 предотвращают повтор сообщений.", "时间结束后，else if 检查 finished。0 表示还未显示结果。显示后设为 1，就不会重复输出最终结果。", "אחרי שהזמן נגמר, else if בודק finished. ‏0 אומר שהתוצאה טרם הוצגה. מציגים ואז שומרים 1 כדי לא לחזור על ההודעה."], "example": "else if (finished == 0) {\n  Serial.println(score);\n  finished = 1;\n}"}, "led": {"title": "digitalWrite()", "meaning": ["D8 controls the ready LED. HIGH lights it during the round; LOW turns it off when time ends.", "D8 управляет индикатором. HIGH включает на время раунда; LOW выключает после времени.", "D8 控制准备指示灯。HIGH 在回合中开灯，LOW 在时间结束后关灯。", "D8 שולט בנורית. HIGH מדליק בזמן הסיבוב; LOW מכבה כשהזמן נגמר."], "example": "pinMode(8, OUTPUT);\ndigitalWrite(8, HIGH);"}, "target": {"title": ">=", "meaning": ["Means at least. A score equal to the target must qualify too.", "Означает «не меньше». Счёт, равный цели, тоже должен пройти.", "表示“大于或等于”。分数刚好达到目标也应合格。", "פירושו לפחות. גם ניקוד ששווה בדיוק ליעד צריך לעבור."], "example": "if (score >= target) {"}, "if": {"title": "if / == / { }", "meaning": ["if checks a condition. == means equals. The lines inside { } run only when the check is true.", "if проверяет условие. == означает равенство. Строки внутри { } работают, только если условие верно.", "if 检查条件，== 表示相等。只有条件成立时才执行 { } 中的代码。", "if בודק תנאי. == פירושו שווה. השורות בתוך { } פועלות רק כשהבדיקה נכונה."], "example": "if (digitalRead(2) == LOW) {\n  Serial.println(\"Pressed\");\n}"}}, "stages": [{"title": ["Connect and read", "Подключи и прочитай", "连接并读取", "חברו וקראו"], "learn": ["Make the button send a reading to Serial Monitor.", "Получи значение кнопки в Serial Monitor.", "让按钮读数出现在 Serial Monitor。", "הציגו את קריאת הכפתור ב־Serial Monitor。"], "tasks": [["Build the diagram on Start. Open Code → Text and use this complete program.", "Собери схему из «Начало». Открой Code → Text и используй программу.", "按“开始”页接线。打开 Code → Text，使用完整程序。", "בנו את התרשים שבהתחלה. פתחו Code → Text והשתמשו בתוכנית המלאה."], ["Start Simulation. Open Serial Monitor. Press and release the button.", "Нажми Start Simulation. Открой Serial Monitor. Нажми и отпусти кнопку.", "点击 Start Simulation，打开 Serial Monitor，按下并松开按钮。", "לחצו Start Simulation. פתחו Serial Monitor. לחצו ושחררו את הכפתור。"]], "concepts": ["pull", "read", "serial"], "check": ["Released shows 1. Pressed shows 0. If it is always 0, check that the wires use terminal numbers 1 and 2.", "Отпущена — 1, нажата — 0. Всегда 0? Проверь разные номера клемм: 1 и 2.", "松开显示 1，按下显示 0。一直是 0 时，检查两根线是否连接不同编号的端子 1 和 2。", "משוחרר מציג 1, לחוץ מציג 0. אם תמיד 0, בדקו שהחוטים משתמשים במספרי מגע 1 ו־2."], "snippet": "void setup() {\n  pinMode(2, INPUT_PULLUP);  // Button: D2 to GND when pressed.\n  Serial.begin(9600);       // Start messages to Serial Monitor.\n}\n\nvoid loop() {\n  Serial.println(digitalRead(2)); // 1 = released, 0 = pressed.\n  delay(100);                     // Make the readings readable.\n}", "place": ["Replace all the code in Code → Text.", "Замени весь код в Code → Text.", "替换 Code → Text 中全部代码。", "החליפו את כל הקוד ב־Code → Text."], "full": "void setup() {\n  pinMode(2, INPUT_PULLUP);  // Button: D2 to GND when pressed.\n  Serial.begin(9600);       // Start messages to Serial Monitor.\n}\n\nvoid loop() {\n  Serial.println(digitalRead(2)); // 1 = released, 0 = pressed.\n  delay(100);                     // Make the readings readable.\n}", "figure": null, "caption": null, "hint": null, "table": null}, {"title": ["One press, one point", "Одно нажатие — одно очко", "一次按下，一分", "לחיצה אחת, נקודה אחת"], "learn": ["Count new presses without rewarding a held button.", "Считай новые нажатия, а не удержание.", "计数新的按下，不因按住而重复计分。", "ספרו לחיצות חדשות בלי לתת נקודות על החזקה."], "tasks": [["Stop the simulation. Replace the program with this version.", "Останови симуляцию. Замени программу этой версией.", "停止模拟，用此版本替换程序。", "עצרו את הסימולציה. החליפו בתוכנית הזאת."], ["Run. Tap three times, then hold the button down for two seconds. Release and tap once more.", "Запусти. Нажми трижды, затем удержи две секунды. Отпусти и нажми ещё раз.", "运行。轻按三次，再按住两秒。松开后再按一次。", "הריצו. לחצו שלוש פעמים ואז החזיקו לשתי שניות. שחררו ולחצו שוב."]], "concepts": ["if", "score", "edge"], "check": ["The score reaches 3, stays at 4 during the hold, then reaches 5 after the last new press.", "Счёт доходит до 3, остаётся 4 при удержании и становится 5 после последнего нажатия.", "分数先到 3，按住时停在 4，最后一次新的按下后到 5。", "הניקוד מגיע ל־3, נשאר 4 בזמן ההחזקה ומגיע ל־5 אחרי הלחיצה החדשה האחרונה."], "snippet": "int score = 0;            // Points begin at zero.\nint previous = HIGH;      // The last button reading.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int button = digitalRead(2); // Read the button now.\n  if (button == LOW && previous == HIGH) {\n    score = score + 1;         // A NEW press earns one point.\n    Serial.println(score);\n  }\n  previous = button;           // Remember this reading.\n  delay(20);                   // Small pause between checks.\n}", "place": ["Replace your whole program.", "Замени всю программу.", "替换整个程序。", "החליפו את כל התוכנית."], "full": "int score = 0;            // Points begin at zero.\nint previous = HIGH;      // The last button reading.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int button = digitalRead(2); // Read the button now.\n  if (button == LOW && previous == HIGH) {\n    score = score + 1;         // A NEW press earns one point.\n    Serial.println(score);\n  }\n  previous = button;           // Remember this reading.\n  delay(20);                   // Small pause between checks.\n}", "figure": null, "caption": null, "hint": null, "table": null}, {"title": ["3, 2, 1, GO!", "3, 2, 1, GO!", "3、2、1、GO！", "3, 2, 1, GO!"], "learn": ["Use one for loop for the countdown.", "Используй один цикл for для отсчёта.", "用一个 for 循环完成倒计时。", "השתמשו בלולאת for אחת לספירה לאחור."], "tasks": [["Keep your counting program. Inside setup(), paste this immediately after Serial.begin(9600);.", "Оставь счётчик. В setup() вставь блок сразу после Serial.begin(9600);.", "保留计数程序。在 setup() 内，紧接 Serial.begin(9600); 粘贴代码。", "השאירו את תוכנית הספירה. בתוך setup() הדביקו מיד אחרי Serial.begin(9600);."], ["Run and watch Serial Monitor. Try starting count at 5, then return it to 3.", "Запусти и посмотри Serial Monitor. Попробуй начать count с 5, затем верни 3.", "运行并观察 Serial Monitor。把 count 初始值试改为 5，再改回 3。", "הריצו וצפו ב־Serial Monitor. נסו להתחיל count ב־5 ואז החזירו ל־3."]], "concepts": ["for", "delay"], "check": ["Only the countdown changes. The button still adds one point per new press after GO.", "Меняется только отсчёт. После GO новое нажатие всё ещё даёт очко.", "只有倒计时改变。GO 后，每次新的按下仍加一分。", "רק הספירה לאחור משתנה. אחרי GO כל לחיצה חדשה עדיין מוסיפה נקודה."], "snippet": "  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);  // Show 3, then 2, then 1.\n    delay(1000);            // Wait one second each time.\n  }\n  Serial.println(\"GO!\");", "place": ["Inside setup(), directly after Serial.begin(9600);.", "В setup(), сразу после Serial.begin(9600);.", "放在 setup() 内，紧接 Serial.begin(9600);。", "בתוך setup(), מיד אחרי Serial.begin(9600);."], "full": "int score = 0;            // Points begin at zero.\nint previous = HIGH;      // The last button reading.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);  // Show 3, then 2, then 1.\n    delay(1000);            // Wait one second each time.\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2); // Ignore a button held during the countdown.\n}\n\nvoid loop() {\n  int button = digitalRead(2); // Read the button now.\n  if (button == LOW && previous == HIGH) {\n    score = score + 1;         // A NEW press earns one point.\n    Serial.println(score);\n  }\n  previous = button;           // Remember this reading.\n  delay(20);                   // Small pause between checks.\n}", "figure": null, "caption": null, "hint": null, "table": null}, {"title": ["Give every player ten seconds", "Дай каждому десять секунд", "每位玩家都有十秒", "תנו לכל שחקן עשר שניות"], "learn": ["Use the Uno clock to end a fair round.", "Используй часы Uno для честного раунда.", "用 Uno 时钟让回合公平结束。", "השתמשו בשעון ה־Uno לסיבוב הוגן."], "tasks": [["Open Complete code for this step. Replace the whole program with the timed version. The button stays on D2 and the LED on D8.", "Открой полный код шага. Замени программу версией с таймером. Кнопка остаётся на D2, светодиод на D8.", "打开本步骤完整代码，用计时版本替换全部程序。按钮仍接 D2，LED 接 D8。", "פתחו את הקוד המלא לשלב. החליפו בגרסה המתוזמנת. הכפתור נשאר ב־D2 והנורית ב־D8."], ["Run. Wait for GO, then click. Keep clicking after the LED goes off.", "Запусти. Дождись GO и нажимай. Продолжай после выключения индикатора.", "运行。等到 GO 后点击，指示灯熄灭后继续点击。", "הריצו. חכו ל־GO ואז לחצו. המשיכו ללחוץ אחרי שהנורית כבה."]], "concepts": ["clock", "time", "finish", "led"], "check": ["Time starts at GO. The final score appears once after ten seconds and later clicks do not change it.", "Время идёт с GO. Через десять секунд итог появляется один раз и дальше не меняется.", "计时从 GO 开始。十秒后只显示一次最终分数，之后点击不会改变结果。", "הזמן מתחיל ב־GO. אחרי עשר שניות התוצאה מופיעה פעם אחת ולחיצות מאוחרות אינן משנות אותה."], "snippet": "startTime = millis();\n\nif (millis() - startTime \u003c roundTime) {\n  // The complete timed version checks clicks inside this block.\n}", "place": ["Read these timer lines, then use the complete timed program below.", "Разбери строки таймера, затем используй полную программу ниже.", "先读懂这些计时行，再使用下方完整计时程序。", "קראו את שורות הטיימר ואז השתמשו בתוכנית המלאה שלמטה."], "full": "int score = 0;\nint previous = HIGH;\nint finished = 0;                // 0 = final message not shown yet.\nunsigned long startTime;         // Stores a time in milliseconds.\nunsigned long roundTime = 10000; // 10000 ms = 10 seconds.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(8, OUTPUT);            // Ready / playing LED.\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);\n    delay(1000);\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2);     // A held early press earns no point.\n  digitalWrite(8, HIGH);         // The round is open.\n  startTime = millis();          // Remember when GO happened.\n}\n\nvoid loop() {\n  if (millis() - startTime \u003c roundTime) { // Still inside the round?\n    int button = digitalRead(2);\n    if (button == LOW && previous == HIGH) {\n      score = score + 1;\n      Serial.println(score);\n    }\n    previous = button;\n    delay(20);\n  } else if (finished == 0) {     // Time up: show the result ONCE.\n    digitalWrite(8, LOW);\n    Serial.print(\"Time up! Score: \");\n    Serial.println(score);\n    finished = 1;                // Do not print the result again.\n  }\n}", "figure": null, "caption": null, "hint": null, "table": null, "exampleOnly": true, "printTasks": [["Use the Complete game program at the end of this guide. Replace your whole program with it, then read the new lines in Learn.", "Возьми полную программу игры в конце руководства. Замени ею всю программу и разбери новые строки в разделе «Изучи».", "使用本指南末尾的完整游戏程序替换全部代码，再阅读“学习”中的新代码说明。", "השתמשו בתוכנית המשחק המלאה בסוף המדריך. החליפו בה את כל התוכנית ואז קראו את השורות החדשות בחלק הלמידה."], ["Run. Wait for GO, then click. Keep clicking after the LED goes off.", "Запусти. Дождись GO и нажимай. Продолжай после выключения индикатора.", "运行。等到 GO 后点击，指示灯熄灭后继续点击。", "הריצו. חכו ל־GO ואז לחצו. המשיכו ללחוץ אחרי שהנורית כבה."]]}, {"title": ["Make your arcade round", "Настрой свой раунд", "制作你的街机回合", "צרו את סיבוב המשחק שלכם"], "learn": ["Choose a round length that suits your players.", "Выбери длительность для своих игроков.", "选择适合玩家的回合时长。", "בחרו משך סיבוב שמתאים לשחקנים שלכם."], "tasks": [["Choose a 5-, 10- or 15-second round. Change roundTime to 5000, 10000 or 15000.", "Выбери 5, 10 или 15 секунд. Измени roundTime на 5000, 10000 или 15000.", "选择 5、10 或 15 秒，把 roundTime 改为 5000、10000 或 15000。", "בחרו סיבוב של 5, 10 או 15 שניות. שנו roundTime ל־5000, 10000 או 15000."], ["Let a partner play. Use Stop Simulation, then Start Simulation for each new player. Keep the same time when comparing scores.", "Дай напарнику сыграть. Для нового игрока нажми Stop Simulation, затем Start Simulation. Сравнивай результаты за одинаковое время.", "让同伴试玩。每位新玩家前先 Stop Simulation，再 Start Simulation。比较分数时使用相同时长。", "תנו לבן הזוג לשחק. לכל שחקן חדש לחצו Stop Simulation ואז Start Simulation. השוו ניקוד באותו משך זמן."]], "concepts": ["time", "edge"], "check": ["A new game starts at zero. A held button before GO earns no point until it is released and pressed again.", "Новая игра начинается с нуля. Удержание до GO не даёт очко без отпускания и нового нажатия.", "新游戏从零开始。GO 前一直按住不会得分，需先松开再重新按下。", "משחק חדש מתחיל מאפס. החזקה לפני GO אינה נותנת נקודה עד שמשחררים ולוחצים שוב."], "snippet": "unsigned long roundTime = 10000;", "place": ["Change the roundTime line near the top of your program.", "Измени roundTime в начале программы.", "修改程序顶部附近的 roundTime 行。", "שנו את שורת roundTime ליד ראש התוכנית."], "full": "int score = 0;\nint previous = HIGH;\nint finished = 0;                // 0 = final message not shown yet.\nunsigned long startTime;         // Stores a time in milliseconds.\nunsigned long roundTime = 10000; // 10000 ms = 10 seconds.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(8, OUTPUT);            // Ready / playing LED.\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);\n    delay(1000);\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2);     // A held early press earns no point.\n  digitalWrite(8, HIGH);         // The round is open.\n  startTime = millis();          // Remember when GO happened.\n}\n\nvoid loop() {\n  if (millis() - startTime \u003c roundTime) { // Still inside the round?\n    int button = digitalRead(2);\n    if (button == LOW && previous == HIGH) {\n      score = score + 1;\n      Serial.println(score);\n    }\n    previous = button;\n    delay(20);\n  } else if (finished == 0) {     // Time up: show the result ONCE.\n    digitalWrite(8, LOW);\n    Serial.print(\"Time up! Score: \");\n    Serial.println(score);\n    finished = 1;                // Do not print the result again.\n  }\n}", "figure": null, "caption": null, "hint": null, "table": null}], "challenges": [{"title": ["Build an arcade qualifier", "Сделай отборочный раунд", "制作街机资格赛", "בנו סיבוב מוקדמות"], "problem": ["Visitors need a clear goal. Keep the timed round, set a target of 10 points and show Qualified! only when the final score reaches it.", "Посетителям нужна цель. Сохрани таймер, задай 10 очков и покажи Qualified! только при достижении цели к концу.", "游客需要明确目标。保留计时回合，设定 10 分，只有最终分数达到目标时才显示 Qualified!。", "המבקרים צריכים יעד ברור. השאירו סיבוב מתוזמן, קבעו יעד 10 והציגו Qualified! רק כשהניקוד הסופי מגיע אליו."], "tasks": [["Add int target = 10; above setup().", "Добавь int target = 10; перед setup().", "在 setup() 前加入 int target = 10;。", "הוסיפו int target = 10; מעל setup()."], ["In the time-up block, use if / else to print Qualified! or Try again!. Turn the LED on only for a qualifying result.", "В блоке окончания используй if / else для Qualified! или Try again!. Включай свет только при успехе.", "在时间结束代码块中用 if / else 显示 Qualified! 或 Try again!，只为合格结果开灯。", "בבלוק סיום הזמן השתמשו ב־if / else להצגת Qualified! או Try again!. הדליקו את הנורית רק בתוצאה שעוברת."], ["Test a final score below, equal to and above the target. You may change the target between runs to reach all three cases.", "Проверь счёт ниже, равный и выше цели. Между запусками можно менять цель для проверки трёх случаев.", "测试低于、等于、高于目标的结果。可以在各次运行间修改目标，覆盖三种情况。", "בדקו ניקוד נמוך מהיעד, שווה לו וגבוה ממנו. אפשר לשנות את היעד בין הרצות כדי לבדוק את שלושתם."]], "success": [["Time stays fair. A score equal to the target qualifies. The result waits until time is up.", "Время честное. Равный цели счёт проходит. Результат ждёт конца времени.", "时长公平，刚好达到目标也合格，结果在时间结束后才显示。", "הזמן נשאר הוגן. ניקוד שווה ליעד עובר. התוצאה מחכה לסיום הזמן."]], "hint": ["Use score >= target inside the existing finished == 0 block. The notebook explains >=.", "Используй score >= target внутри finished == 0. >= объяснено в справочнике.", "在已有 finished == 0 代码块内使用 score >= target，笔记中说明了 >=。", "השתמשו ב־score >= target בתוך בלוק finished == 0. הסימן >= מוסבר במחברת."], "concepts": ["target"]}], "solutions": [{"title": "Complete ten-second game", "code": "int score = 0;\nint previous = HIGH;\nint finished = 0;                // 0 = final message not shown yet.\nunsigned long startTime;         // Stores a time in milliseconds.\nunsigned long roundTime = 10000; // 10000 ms = 10 seconds.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(8, OUTPUT);            // Ready / playing LED.\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);\n    delay(1000);\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2);     // A held early press earns no point.\n  digitalWrite(8, HIGH);         // The round is open.\n  startTime = millis();          // Remember when GO happened.\n}\n\nvoid loop() {\n  if (millis() - startTime \u003c roundTime) { // Still inside the round?\n    int button = digitalRead(2);\n    if (button == LOW && previous == HIGH) {\n      score = score + 1;\n      Serial.println(score);\n    }\n    previous = button;\n    delay(20);\n  } else if (finished == 0) {     // Time up: show the result ONCE.\n    digitalWrite(8, LOW);\n    Serial.print(\"Time up! Score: \");\n    Serial.println(score);\n    finished = 1;                // Do not print the result again.\n  }\n}"}, {"title": "Arcade qualifier", "code": "int target = 10;             // Points needed to qualify.\nint score = 0;\nint previous = HIGH;\nint finished = 0;                // 0 = final message not shown yet.\nunsigned long startTime;         // Stores a time in milliseconds.\nunsigned long roundTime = 10000; // 10000 ms = 10 seconds.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(8, OUTPUT);            // Ready / playing LED.\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);\n    delay(1000);\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2);     // A held early press earns no point.\n  digitalWrite(8, HIGH);         // The round is open.\n  startTime = millis();          // Remember when GO happened.\n}\n\nvoid loop() {\n  if (millis() - startTime \u003c roundTime) { // Still inside the round?\n    int button = digitalRead(2);\n    if (button == LOW && previous == HIGH) {\n      score = score + 1;\n      Serial.println(score);\n    }\n    previous = button;\n    delay(20);\n  } else if (finished == 0) {     // Time up: show the result ONCE.\n    digitalWrite(8, LOW);\n    Serial.print(\"Time up! Score: \");\n    Serial.println(score);\n    if (score >= target) {      // At least the target score?\n      Serial.println(\"Qualified!\");\n      digitalWrite(8, HIGH);\n    } else {\n      Serial.println(\"Try again!\");\n    }\n    finished = 1;                // Do not print the result again.\n  }\n}"}], "codeMain": "int score = 0;\nint previous = HIGH;\nint finished = 0;                // 0 = final message not shown yet.\nunsigned long startTime;         // Stores a time in milliseconds.\nunsigned long roundTime = 10000; // 10000 ms = 10 seconds.\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(8, OUTPUT);            // Ready / playing LED.\n  Serial.begin(9600);\n  for (int count = 3; count > 0; count = count - 1) {\n    Serial.println(count);\n    delay(1000);\n  }\n  Serial.println(\"GO!\");\n  previous = digitalRead(2);     // A held early press earns no point.\n  digitalWrite(8, HIGH);         // The round is open.\n  startTime = millis();          // Remember when GO happened.\n}\n\nvoid loop() {\n  if (millis() - startTime \u003c roundTime) { // Still inside the round?\n    int button = digitalRead(2);\n    if (button == LOW && previous == HIGH) {\n      score = score + 1;\n      Serial.println(score);\n    }\n    previous = button;\n    delay(20);\n  } else if (finished == 0) {     // Time up: show the result ONCE.\n    digitalWrite(8, LOW);\n    Serial.print(\"Time up! Score: \");\n    Serial.println(score);\n    finished = 1;                // Do not print the result again.\n  }\n}", "rubric": [[["Working", "Работает", "能运行", "עובד"], ["The countdown, click count and final score work.", "Отсчёт, клики и итог работают.", "倒计时、点击计数、最终分数正常。", "הספירה לאחור, הלחיצות והניקוד הסופי עובדים."]], [["Secure", "Уверенно", "掌握", "מבוסס"], ["Holds, early presses and late presses do not add unfair points.", "Удержание, ранние и поздние нажатия не дают лишних очков.", "按住、提前按下、超时按下不会获得不公平分数。", "החזקה ולחיצות מוקדמות או מאוחרות אינן מוסיפות נקודות לא הוגנות."]], [["Independent", "Самостоятельно", "能独立完成", "עצמאי"], ["Change a setting and explain the loop or counting rule without copying an explanation.", "Измени настройку и объясни цикл или правило счёта своими словами.", "修改设置，用自己的话解释循环或计数规则。", "שנו הגדרה והסבירו את הלולאה או כלל הספירה במילים שלכם."]]], "exit": [["Hold the button. Show why the score does not keep rising.", "Удержи кнопку. Покажи, почему счёт не растёт постоянно.", "按住按钮，展示为什么分数不会一直增长。", "החזיקו את הכפתור. הראו למה הניקוד אינו ממשיך לעלות."], ["Point to the start, condition and change in your for loop.", "Покажи начало, условие и изменение в цикле for.", "指出 for 循环中的起始值、条件、变化。", "הצביעו על ההתחלה, התנאי והשינוי בלולאת for."], ["Show how you would give every player fifteen seconds.", "Покажи, как дать каждому пятнадцать секунд.", "展示怎样给每位玩家十五秒。", "הראו איך תתנו לכל שחקן חמש עשרה שניות."]], "teacher": {"sections": [{"title": "Class learning considerations", "items": ["Year 7 has used Arduino outputs, delay and decisions. Treat Serial Monitor, counters, a for countdown, edge detection and millis as explicit new learning. Do not introduce while loops.", "The clock structure is supplied and explained. Ask students to build and explain one change at a time; continuing a working checkpoint is preferable to rushing a complete sketch."]}, {"title": "Learning objective and inquiry", "items": ["Build and explain a fair timed clicker. Inquiry: what stops a player gaining points by holding the button?"]}, {"title": "Suggested lesson sequence", "items": ["40 minutes: 4 setup, 5 button readings, 7 counting, 7 countdown, 9 timer, 6 partner check and 2 exit. Use the supplied timed checkpoint if the class needs longer on counting.", "Period 2 remains the separate Community Project research session.", "Resources: a school laptop and school Tinkercad account; the coding guide links to the chosen simulator. Optional later physical kit per pair: Uno, one push button, one LED, one 220-ohm resistor, breadboard, jumper wires and USB cable."]}, {"title": "Differentiation", "items": ["Everyone works towards the same working product. Use the complete checkpoint code or the supplied dimensions when needed. Ask for an explanation of one change before removing a scaffold.", "Early finishers choose the problem in Extra challenges. Judge the behaviour and their explanation, not the amount of code copied."]}, {"title": "Assessment for learning", "items": ["Observe a held button, a held early press, a late press and reset between games. The active round begins after the countdown.", "A final message should appear once. Keep the 20 ms settling pause; the timing window uses millis rather than counting delay calls."]}, {"title": "Challenge", "items": ["Arcade qualifier: below, exactly at and above the target. Full worked examples are available here; ask for the boundary explanation."]}, {"title": "Next steps", "items": ["In Week 9 use this one-button game as the CAD brief. Revisit edge detection if students cannot explain a held press."]}]}, "ui": {"start": ["Start", "Начало", "开始", "התחלה"], "build": ["Build", "Сборка", "制作",
