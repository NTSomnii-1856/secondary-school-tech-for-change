  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 6, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "title": ["One LED, then traffic lights", "Один светодиод, затем светофор", "先点亮一盏灯，再做信号灯", "נורית אחת, ואז רמזור"], "main": {"project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "figure": {"file": "blink7.svg", "caption": ["Each LED uses its own 220 Ω resistor. Connect + towards its pin and − to GND.", "У каждого светодиода свой резистор 220 Ом. Подключи + к выводу через резистор, − к GND.", "每盏 LED 单独使用一个 220 Ω 电阻。正极经电阻接引脚，负极接 GND。", "לכל נורית נגד 220Ω משלה. חברו + לפין דרך הנגד ו-− ל-GND."]}, "start": ["Build the green LED circuit in Tinkercad.", "Собери зелёный светодиод в Tinkercad.", "在 Tinkercad 中接好绿灯。", "בנו את מעגל הנורית הירוקה ב-Tinkercad."], "learn": ["Tell the board which pin is an output, then turn the light on, wait and turn it off.", "Задай вывод как выход, затем включи лампу, подожди и выключи.", "先设定输出引脚，再开灯、等待、关灯。", "הגדירו פין כפלט, ואז הדליקו את האור, המתינו וכבו אותו."], "steps": [["Look at the diagram and find the green light and its pin.", "На схеме найди зелёную лампу и её вывод.", "看图找到绿灯及其引脚。", "מצאו בתרשים את האור הירוק ואת הפין שלו."], ["Open Starter code on this lesson page. Paste it into Code → Text in Tinkercad, then select Start Simulation.", "Открой стартовый код на странице урока. Вставь его в Code → Text в Tinkercad и выбери Start Simulation.", "打开本课程页面的起始代码。粘贴到 Tinkercad 的 Code → Text，再点击 Start Simulation。", "פתחו קוד התחלה בדף השיעור. הדביקו אותו ב-Code → Text ב-Tinkercad ולחצו Start Simulation."], ["Change the on time to 2 seconds. Run again and check the difference.", "Измени время работы на 2 секунды. Запусти снова и проверь разницу.", "把亮灯时间改成 2 秒。再运行，检查变化。", "שנו את זמן ההדלקה לשתי שניות. הריצו שוב ובדקו מה השתנה."]], "notes": [["One pin controls one LED.", "Один вывод управляет одним светодиодом.", "一个引脚控制一盏 LED。", "פין אחד שולט בנורית אחת."], ["The wait sits between the on and off commands.", "Ожидание стоит между включением и выключением.", "等待命令放在开灯和关灯之间。", "ההמתנה נמצאת בין פקודות ההדלקה והכיבוי."], ["The number you change controls how long the light is on.", "Число задаёт, сколько времени горит лампа.", "这个数字决定灯亮多久。", "המספר קובע כמה זמן האור דולק."]], "done": ["Green lights up for 2 seconds, then goes off.", "Зелёный горит 2 секунды и гаснет.", "绿灯亮 2 秒，然后熄灭。", "הירוק דולק שתי שניות ואז כבה."], "facts": ["Green 10 · Amber 9 · Red 8. In delay(), 1000 means one second.", "Зелёный 10 · Жёлтый 9 · Красный 8. В delay() 1000 означает секунду.", "绿灯 10 · 黄灯 9 · 红灯 8。delay() 中的 1000 表示 1 秒。", "ירוק 10 · צהוב 9 · אדום 8. ב-delay(), המספר 1000 הוא שנייה אחת."], "code": "digitalWrite(10, HIGH);\ndelay(3000);\ndigitalWrite(10, LOW);", "starter": "void setup() {\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);\n  delay(3000);\n  digitalWrite(10, LOW);\n  delay(1000);\n}\n"}, "extra": {"start": ["Keep your working green light. Use the diagram to add amber and red.", "Оставь рабочий зелёный. Добавь жёлтый и красный по схеме.", "保留能工作的绿灯，按图加入黄灯和红灯。", "שמרו את האור הירוק שעובד. הוסיפו צהוב ואדום לפי התרשים."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["Green 10 · Amber 9 · Red 8. In delay(), 1000 means one second.", "Зелёный 10 · Жёлтый 9 · Красный 8. В delay() 1000 означает секунду.", "绿灯 10 · 黄灯 9 · 红灯 8。delay() 中的 1000 表示 1 秒。", "ירוק 10 · צהוב 9 · אדום 8. ב-delay(), המספר 1000 הוא שנייה אחת."], "code": "digitalWrite(10, HIGH);\ndelay(3000);\ndigitalWrite(10, LOW);", "notes": [["Begin with one working light. The wait gives you time to see it.", "Начни с одной рабочей лампы. Пауза позволяет увидеть её.", "从一盏能工作的灯开始。等待让你看清它。", "התחילו באור אחד שעובד. ההמתנה מאפשרת לראות אותו."], ["Use the same on, wait, off pattern for each colour.", "Для каждого цвета повтори «включи, подожди, выключи».", "每种颜色都使用相同的“亮、等、灭”顺序。", "השתמשו באותו סדר לכל צבע: הדלקה, המתנה, כיבוי."], ["If two lights stay on, check the off command for the first one.", "Если горят две лампы, проверь выключение первой.", "如果两盏灯同时亮着，检查第一盏的关闭命令。", "אם שני אורות נשארים דולקים, בדקו את פקודת הכיבוי של הראשון."]], "figure": {"file": "traffic7.svg", "caption": ["Each LED uses its own 220 Ω resistor. Connect + towards its pin and − to GND.", "У каждого светодиода свой резистор 220 Ом. Подключи + к выводу через резистор, − к GND.", "每盏 LED 单独使用一个 220 Ω 电阻。正极经电阻接引脚，负极接 GND。", "לכל נורית נגד 220Ω משלה. חברו + לפין דרך הנגד ו-− ל-GND."]}, "starter": "void setup() {\n  pinMode(8, OUTPUT);\n  pinMode(9, OUTPUT);\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);\n  delay(3000);\n  digitalWrite(10, LOW);\n  // Add amber and red here.\n}\n", "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"]}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-6-arcade-countdown/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
