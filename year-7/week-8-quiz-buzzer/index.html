  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 8, "title": ["Quiz-show buzzer", "Зуммер для викторины", "抢答器", "זמזם לחידון"], "main": {"start": ["Wire the quiz circuit in Tinkercad. The starter gives Team 1 a light and a sound. Your job is to add Team 2.", "Собери схему викторины в Tinkercad. Заготовка включает свет и звук команды 1. Добавь команду 2.", "在 Tinkercad 中按图接线。起始代码为第 1 组亮灯并发声。你的任务是加入第 2 组。", "חברו את מעגל החידון ב-Tinkercad. הקוד מדליק אור ומפעיל צליל לקבוצה 1. הוסיפו את קבוצה 2."], "learn": ["Read a button with digitalRead(). In this circuit, LOW means pressed. Use if and else if to choose a team.", "Читай кнопку через digitalRead(). В этой схеме LOW значит «нажата». Используй if и else if для выбора команды.", "用 digitalRead() 读取按钮。在这个电路中，LOW 表示按下。用 if 和 else if 选择队伍。", "קראו את הכפתור עם digitalRead(). במעגל הזה LOW פירושו לחוץ. השתמשו ב-if וב-else if כדי לבחור קבוצה."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Open Starter code on this lesson page. Paste it into Code → Text in Tinkercad, then select Start Simulation.", "Открой стартовый код на странице урока. Вставь его в Code → Text в Tinkercad и выбери Start Simulation.", "打开本课程页面的起始代码。粘贴到 Tinkercad 的 Code → Text，再点击 Start Simulation。", "פתחו קוד התחלה בדף השיעור. הדביקו אותו ב-Code → Text ב-Tinkercad ולחצו Start Simulation."], ["Run. Press and release button 1. Watch the red light and listen.", "Запусти. Нажми и отпусти кнопку 1. Посмотри на красный свет и послушай.", "运行。按下并松开按钮 1，观察红灯并听声音。", "הריצו. לחצו ושחררו את כפתור 1. צפו באור האדום והקשיבו."], ["Check button 2 on pin 3 as well. For Team 2, turn green on, red off and sound the buzzer.", "Проверь также кнопку 2 на выводе 3. Для команды 2 включи зелёный и звук, выключи красный.", "再检查引脚 3 上的按钮 2。第 2 组按下时，开绿灯、关红灯并鸣响。", "בדקו גם את כפתור 2 בפין 3. לקבוצה 2 הדליקו ירוק, כבו אדום והפעילו את הזמזם."], ["When no button is pressed, turn both lights and the buzzer off. Run and test each button.", "Если ни одна кнопка не нажата, выключи обе лампы и зуммер. Запусти и проверь обе кнопки.", "没有按钮按下时，关闭两盏灯和蜂鸣器。运行并测试每个按钮。", "כשאין לחיצה, כבו את שני האורות ואת הזמזם. הריצו ובדקו כל כפתור."]], "done": ["Button 1 gives red. Button 2 gives green. When you let go, the light and sound stop.", "Кнопка 1 включает красный, кнопка 2 — зелёный. После отпускания свет и звук выключаются.", "按钮 1 亮红灯，按钮 2 亮绿灯。松开后灯光和声音停止。", "כפתור 1 מדליק אדום. כפתור 2 מדליק ירוק. בשחרור, האור והצליל נפסקים."], "facts": ["Keep setup(). Replace the whole loop() with this block.", "Оставь setup(). Замени весь loop() этим блоком.", "保留 setup()。用这一段替换整个 loop()。", "השאירו את setup(). החליפו את כל loop() בקטע הזה."], "code": "void loop() {\n  if (digitalRead(2) == LOW) {       // Team 1 is pressing.\n    digitalWrite(8, HIGH);          // Red on, green off.\n    digitalWrite(10, LOW);\n    tone(11, 660);                  // Play Team 1's tone.\n  } else if (digitalRead(3) == LOW) { // Team 2 is pressing.\n    digitalWrite(8, LOW);\n    digitalWrite(10, HIGH);         // Green on, red off.\n    tone(11, 880);\n  } else {                          // Both buttons are up.\n    digitalWrite(8, LOW);\n    digitalWrite(10, LOW);\n    noTone(11);                     // Stop the sound.\n  }\n}", "figure": {"file": "quiz7.svg", "caption": ["Each LED needs its own 220 Ω resistor. On each push button, use one leg from each side of the switch.", "У каждого светодиода свой резистор 220 Ом. Подключай одну ножку с каждой стороны кнопки.", "每盏 LED 使用独立的 220 Ω 电阻。每个按钮分别使用开关两侧各一个引脚。", "לכל נורית נגד 220Ω משלה. בכל כפתור חברו רגל אחת מכל צד של המפסק."]}, "starter": "void setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(3, INPUT_PULLUP);\n  pinMode(8, OUTPUT);\n  pinMode(10, OUTPUT);\n  pinMode(11, OUTPUT);\n}\n\nvoid loop() {\n  int buttonState = digitalRead(2);\n\n  if (buttonState == LOW) {\n    digitalWrite(8, HIGH);\n    tone(11, 660);\n  } else {\n    digitalWrite(8, LOW);\n    noTone(11);\n  }\n}\n", "notes": [["Keep the pin numbers in the diagram and code the same.", "Номера выводов на схеме и в коде должны совпадать.", "让图中和代码中的引脚编号一致。", "מספרי הפינים בתרשים ובקוד צריכים להתאים."], ["A press connects pin 2 to GND, so the Arduino reads LOW.", "Нажатие соединяет вывод 2 с GND, и Arduino читает LOW.", "按下按钮会把引脚 2 接到 GND，所以 Arduino 读到 LOW。", "הלחיצה מחברת פין 2 ל-GND, ולכן Arduino קורא LOW."], ["Use else if to check a second input after the first.", "Используй else if для проверки второго входа после первого.", "用 else if 在第一个判断之后检查第二个输入。", "השתמשו ב-else if כדי לבדוק קלט שני אחרי הראשון."], ["The final else handles the case where both buttons are up.", "Последний else работает, когда обе кнопки отпущены.", "两个按钮都松开时，执行最后的 else。", "ה-else האחרון פועל כששני הכפתורים משוחררים."]]}, "extra": {"title": ["Give the first team the turn", "Дай право ответа первой команде", "保留先按队伍的答题权", "תנו את התור לקבוצה הראשונה"], "start": ["The host looks up after both teams have pressed. Make the first team’s light stay on so the host knows who goes first.", "Ведущий смотрит после двух нажатий. Оставь свет первой команды включённым, чтобы ведущий знал, кто отвечает.", "两组都按过后，主持人才看灯。让先按队伍的灯保持亮着，方便主持人判定。", "המנחה מסתכל אחרי ששתי הקבוצות לחצו. השאירו את האור של הקבוצה הראשונה דולק כדי שידע מי עונה."], "learn": ["A variable can remember the first team after the button is released.", "Переменная может помнить первую команду после отпускания кнопки.", "松开按钮后，变量仍能记住先按的队伍。", "משתנה יכול לזכור את הקבוצה הראשונה אחרי שחרור הכפתור."], "steps": [["Make the first light stay on when the team lets go.", "Оставь свет первой команды включённым после отпускания.", "松开后，让先按队伍的灯保持亮着。", "השאירו את האור הראשון דולק כשהקבוצה משחררת."], ["Press the other team’s button. Keep the first result. Stop and Run starts a new question.", "Нажми кнопку другой команды. Первый результат должен остаться. Stop и Run начинают новый вопрос.", "按另一组的按钮，保留第一个结果。用 Stop 再 Run 开始新题。", "לחצו על הכפתור של הקבוצה השנייה. שמרו את התוצאה הראשונה. Stop ואז Run מתחילים שאלה חדשה."]], "done": ["Either team can win. A later press cannot change the light.", "Любая команда может выиграть. Позднее нажатие не меняет свет.", "任意队伍都能先按获胜，后按不能改变灯光。", "כל קבוצה יכולה לזכות. לחיצה מאוחרת לא משנה את האור."], "facts": ["Keep setup(). Replace loop() with this whole block, including the winner line. Stop and start to reset.", "Оставь setup(). Замени loop() всем блоком, включая строку winner. Остановка и запуск сбрасывают результат.", "保留 setup()。用整段代码替换 loop()，包括 winner 那一行。停止后重新启动可重置。", "השאירו את setup(). החליפו את loop() בכל הקטע, כולל שורת winner. עצרו והפעילו כדי לאפס."], "code": "int winner = 0;                    // 0 means no winner yet.\n\nvoid loop() {\n  if (winner == 0) {               // Check for the first press.\n    if (digitalRead(2) == LOW) {\n      winner = 1;                  // Remember Team 1.\n      digitalWrite(8, HIGH);\n      tone(11, 660, 200);          // Beep for 200 milliseconds.\n    } else if (digitalRead(3) == LOW) {\n      winner = 2;                  // Remember Team 2.\n      digitalWrite(10, HIGH);\n      tone(11, 880, 200);\n    }\n  }\n}", "figure": {"file": "quiz7.svg", "caption": ["Each LED needs its own 220 Ω resistor. On each push button, use one leg from each side of the switch.", "У каждого светодиода свой резистор 220 Ом. Подключай одну ножку с каждой стороны кнопки.", "每盏 LED 使用独立的 220 Ω 电阻。每个按钮分别使用开关两侧各一个引脚。", "לכל נורית נגד 220Ω משלה. בכל כפתור חברו רגל אחת מכל צד של המפסק."]}, "notes": [["Keep the winning team number even after release.", "Сохрани номер команды после отпускания.", "松开后仍保留获胜队伍的编号。", "שמרו את מספר הקבוצה גם אחרי השחרור."], ["Only accept a new winner while the stored value is 0.", "Принимай победителя, пока сохранено 0.", "只在保存值为 0 时接受新的获胜队伍。", "קבלו זוכה חדש רק כשהערך השמור הוא 0."]]}, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "notebook": {"main": [{"command": "digitalRead()", "example": "digitalRead(2)", "meaning": ["Reads the pin. In this circuit, LOW means the button is pressed.", "Читает вывод. В этой схеме LOW означает нажатие.", "读取引脚。在此电路中，LOW 表示按钮被按下。", "קוראת את הפין. במעגל הזה LOW מציין כפתור לחוץ."]}, {"command": "INPUT_PULLUP", "example": "pinMode(2, INPUT_PULLUP);", "meaning": ["Sets up this button input. With this wiring, a press reads LOW.", "Настраивает вход кнопки. В этой схеме нажатие даёт LOW.", "设置按钮输入。按此接线，按下时读到 LOW。", "מגדיר את קלט הכפתור. בחיבור הזה לחיצה נקראת LOW."]}, {"command": "if / else if / else", "example": "if (digitalRead(2) == LOW)", "meaning": ["Checks a condition. else if checks another. else handles the rest.", "Проверяет условие. else if проверяет другое, else — остальные случаи.", "检查一个条件。else if 再检查一个条件。else 处理其余情况。", "בודק תנאי. else if בודק תנאי נוסף. else מטפל בשאר המקרים."]}, {"command": "digitalWrite()", "example": "digitalWrite(10, HIGH);", "meaning": ["For these LEDs, HIGH turns the light on and LOW turns it off.", "Для этих ламп HIGH включает свет, LOW выключает.", "在这些 LED 上，HIGH 开灯，LOW 关灯。", "בנוריות האלה HIGH מדליק ו-LOW מכבה."]}, {"command": "tone()", "example": "tone(11, 660);", "meaning": ["Plays a sound on pin 11. 660 sets the pitch.", "Включает звук на выводе 11. 660 задаёт высоту.", "在引脚 11 播放声音。660 决定音高。", "משמיעה צליל בפין 11. 660 קובע את גובה הצליל."]}, {"command": "noTone()", "example": "noTone(11);", "meaning": ["Stops the sound on pin 11.", "Выключает звук на выводе 11.", "停止引脚 11 上的声音。", "מפסיקה את הצליל בפין 11."]}], "extra": [{"command": "int winner = 0;", "example": "if (winner == 0)", "meaning": ["Stores the first team. 0 means nobody has won yet.", "Хранит номер первой команды. 0 значит, что победителя пока нет.", "保存先按队伍的编号。0 表示还没有队伍获胜。", "שומר את מספר הקבוצה הראשונה. 0 פירושו שעדיין אין זוכה."]}]}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-8-quiz-buzzer/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
