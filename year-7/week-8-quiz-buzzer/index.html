  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 8, "title": ["Quiz-show buzzer", "Зуммер для викторины", "抢答器", "זמזם לחידון"], "main": {"start": ["Build the one-button circuit in Tinkercad. Open Starter code and paste it into Code → Text.", "Собери схему с одной кнопкой. Вставь стартовый код в Code → Text.", "在 Tinkercad 中搭好单按钮电路。把起始代码粘贴到 Code → Text。", "בנו מעגל עם כפתור אחד ב־Tinkercad. הדביקו את קוד ההתחלה ב־Code → Text."], "learn": ["Read one button. Use if and else to choose what the light and sound do.", "Читай одну кнопку. Выбери свет и звук с помощью if и else.", "读取一个按钮。用 if 和 else 控制灯光和声音。", "קראו כפתור אחד. השתמשו ב־if וב־else כדי להחליט מה האור והצליל יעשו."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Under “Add the button check here”, check if pin 2 reads LOW.", "Под «Add the button check here» проверь, равен ли вывод 2 LOW.", "在“Add the button check here”下检查引脚 2 是否为 LOW。", "מתחת ל־“Add the button check here” בדקו אם פין 2 נקרא LOW."], ["In if, turn on the red light and play a sound. In else, turn both off.", "В if включи красный свет и звук. В else выключи оба.", "在 if 中开红灯并播放声音。在 else 中关闭两者。", "בתוך if הדליקו אדום והשמיעו צליל. בתוך else כבו את שניהם."], ["Start Simulation. Press and release the button once.", "Нажми Start Simulation. Нажми и отпусти кнопку.", "点击 Start Simulation。按下并松开按钮一次。", "לחצו Start Simulation. לחצו ושחררו את הכפתור פעם אחת."]], "done": ["Press: red light and sound. Release: both stop.", "Нажми: красный и звук. Отпусти: оба выключаются.", "按下时红灯和声音开启，松开后都关闭。", "בלחיצה יש אור אדום וצליל. בשחרור שניהם נכבים."], "facts": ["Paste the whole if / else block below the comment, inside the supplied loop().", "Вставь весь блок if / else под комментарием внутри готовой loop().", "把完整的 if / else 代码块粘贴在注释下方，放进已有的 loop() 中。", "הדביקו את כל בלוק if / else מתחת להערה, בתוך loop() שכבר מוכן."], "code": "  if (digitalRead(2) == LOW) {  // Button 1 is pressed.\n    digitalWrite(8, HIGH);     // Light up Team 1.\n    tone(11, 660);              // Play a sound.\n  } else {                      // Button 1 is released.\n    digitalWrite(8, LOW);\n    noTone(11);                 // Stop the sound.\n  }", "figure": {"file": "one-button-quiz7.svg", "caption": ["Button D2 to GND. Red LED D8 through 220 Ω. Piezo + to D11 and − to GND.", "Кнопка D2–GND. Красный светодиод D8 через 220 Ом. Пьезо + к D11, − к GND.", "按钮连 D2 和 GND。红灯经 220 Ω 接 D8。压电蜂鸣器正极接 D11，负极接 GND。", "כפתור D2 ל־GND. נורית אדומה D8 דרך 220Ω. זמזם: + ל־D11, − ל־GND."]}, "starter": "void setup() {\n  pinMode(2, INPUT_PULLUP);  // Button 1\n  pinMode(8, OUTPUT);        // Red LED\n  pinMode(11, OUTPUT);       // Piezo\n}\n\nvoid loop() {\n  // Add the button check here.\n}\n", "notes": [["In this circuit, LOW means pressed.", "В этой схеме LOW означает нажатие.", "在此电路中，LOW 表示按下。", "במעגל הזה LOW פירושו לחוץ."], ["The starter’s loop() keeps checking the button.", "Готовая loop() снова проверяет кнопку.", "起始代码的 loop() 会不断检查按钮。", "ה־loop() שבקוד ההתחלה ממשיך לבדוק את הכפתור."], ["Check the light and the sound when you let go.", "После отпускания проверь свет и звук.", "松开后检查灯光和声音。", "בדקו מה קורה לאור ולצליל כשאתם משחררים."]]}, "extra": {"title": ["Add a second team", "Добавь вторую команду", "加入第二队", "הוסיפו קבוצה שנייה"], "start": ["Copy your buzzer circuit. Use the diagram to add button 2 and the green LED.", "Скопируй схему. Добавь кнопку 2 и зелёный светодиод.", "复制抢答器电路。按图加入按钮 2 和绿灯。", "העתיקו את מעגל הזמזם. הוסיפו כפתור 2 ונורית ירוקה לפי התרשים."], "learn": ["Use else if to check the second button after checking the first.", "Проверь вторую кнопку после первой с помощью else if.", "用 else if 在检查第一个按钮之后检查第二个。", "השתמשו ב־else if כדי לבדוק את הכפתור השני אחרי הראשון."], "steps": [["Set up button 2 on D3 and green on D10.", "Настрой кнопку 2 на D3 и зелёный на D10.", "把按钮 2 设为 D3，绿灯设为 D10。", "הגדירו את כפתור 2 בפין D3 ואת הירוק בפין D10."], ["Add else if for button 2. Give both teams a one-second beep.", "Добавь else if для кнопки 2. Сделай для каждой команды сигнал на одну секунду.", "为按钮 2 加上 else if。让两个队的提示音都持续一秒。", "הוסיפו else if לכפתור 2. תנו לכל קבוצה צליל של שנייה."], ["Tap each button separately. Check that its light and sound stop after one second.", "По очереди коротко нажми кнопки. Проверь, что свет и звук выключаются через секунду.", "分别轻按两个按钮。检查各自的灯和声音是否在一秒后停止。", "לחצו לחיצה קצרה על כל כפתור בנפרד. בדקו שהאור והצליל נכבים אחרי שנייה."]], "done": ["Tap button 1 for red or button 2 for green. Each tap gives one second of light and sound.", "Коротко нажми кнопку 1 для красного или кнопку 2 для зелёного. Свет и звук работают одну секунду.", "轻按按钮 1 亮红灯，轻按按钮 2 亮绿灯。每次轻按的灯光和声音持续一秒。", "לחיצה קצרה על כפתור 1 מדליקה אדום ועל כפתור 2 מדליקה ירוק. האור והצליל נמשכים שנייה."], "facts": ["Use this full sketch in Code → Text. Match the pin numbers to the diagram.", "Используй весь скетч в Code → Text. Сверь выводы со схемой.", "在 Code → Text 中使用这份完整代码。引脚编号要与图一致。", "השתמשו בכל הסקץ׳ ב-Code → Text. התאימו את הפינים לתרשים."], "code": "void setup() {\n  pinMode(2, INPUT_PULLUP);  // Button 1\n  pinMode(3, INPUT_PULLUP);  // Button 2\n  pinMode(8, OUTPUT);        // Team 1 red\n  pinMode(10, OUTPUT);       // Team 2 green\n  pinMode(11, OUTPUT);       // Piezo\n}\nvoid loop() {\n  if (digitalRead(2) == LOW) {        // Team 1 is pressing.\n    digitalWrite(8, HIGH);\n    tone(11, 660);\n    delay(1000);          // Let the beep play for 1 second.\n    noTone(11);\n    digitalWrite(8, LOW);\n  } else if (digitalRead(3) == LOW) { // Try Team 2 next.\n    digitalWrite(10, HIGH);\n    tone(11, 880);\n    delay(1000);          // Let the beep play for 1 second.\n    noTone(11);\n    digitalWrite(10, LOW);\n  }\n}", "figure": {"file": "quiz7.svg", "caption": ["Each LED needs its own 220 Ω resistor. On each push button, use one leg from each side of the switch.", "У каждого светодиода свой резистор 220 Ом. Подключай одну ножку с каждой стороны кнопки.", "每盏 LED 使用独立的 220 Ω 电阻。每个按钮分别使用开关两侧各一个引脚。", "לכל נורית נגד 220Ω משלה. בכל כפתור חברו רגל אחת מכל צד של המפסק."]}, "notes": [["Use the same setup pattern as button 1.", "Настрой так же, как кнопку 1.", "使用与按钮 1 相同的设置方法。", "השתמשו באותה הגדרה כמו בכפתור 1."], ["Put delay(1000) between tone() and noTone().", "Поставь delay(1000) между tone() и noTone().", "把 delay(1000) 放在 tone() 和 noTone() 之间。", "שימו delay(1000) בין tone() ל־noTone()."], ["Team 1 should be red. Team 2 should be green.", "Первая команда — красный, вторая — зелёный.", "第 1 队亮红灯，第 2 队亮绿灯。", "לקבוצה 1 יש אדום. לקבוצה 2 יש ירוק."]]}, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "notebook": {"main": [{"command": "digitalRead()", "example": "digitalRead(2)", "meaning": ["Reads the pin. In this circuit, LOW means the button is pressed.", "Читает вывод. В этой схеме LOW означает нажатие.", "读取引脚。在此电路中，LOW 表示按钮被按下。", "קוראת את הפין. במעגל הזה LOW מציין כפתור לחוץ."]}, {"command": "INPUT_PULLUP", "example": "pinMode(2, INPUT_PULLUP);", "meaning": ["Sets up this button input. With this wiring, a press reads LOW.", "Настраивает вход кнопки. В этой схеме нажатие даёт LOW.", "设置按钮输入。按此接线，按下时读到 LOW。", "מגדיר את קלט הכפתור. בחיבור הזה לחיצה נקראת LOW."]}, {"command": "if / else", "example": "if (digitalRead(2) == LOW) {", "meaning": ["Use if for the pressed case and else for the released case.", "Используй if для нажатия, else — для отпускания.", "if 处理按下，else 处理松开。", "if מטפל בלחיצה ו־else מטפל בשחרור."]}, {"command": "digitalWrite()", "example": "digitalWrite(10, HIGH);", "meaning": ["For these LEDs, HIGH turns the light on and LOW turns it off.", "Для этих ламп HIGH включает свет, LOW выключает.", "在这些 LED 上，HIGH 开灯，LOW 关灯。", "בנוריות האלה HIGH מדליק ו-LOW מכבה."]}, {"command": "tone()", "example": "tone(11, 660);", "meaning": ["Plays a sound on pin 11. 660 sets the pitch.", "Включает звук на выводе 11. 660 задаёт высоту.", "在引脚 11 播放声音。660 决定音高。", "משמיעה צליל בפין 11. 660 קובע את גובה הצליל."]}, {"command": "noTone()", "example": "noTone(11);", "meaning": ["Stops the sound on pin 11.", "Выключает звук на выводе 11.", "停止引脚 11 上的声音。", "מפסיקה את הצליל בפין 11."]}, {"command": "==", "example": "digitalRead(2) == LOW", "meaning": ["Checks whether the reading is LOW.", "Проверяет, равно ли значение LOW.", "检查读数是否为 LOW。", "בודק אם הקריאה שווה ל־LOW."]}, {"command": "loop()", "example": "void loop() { ... }", "meaning": ["The ready-made block checks the button again and again.", "Готовый блок проверяет кнопку снова и снова.", "现成的代码块反复检查按钮。", "הבלוק המוכן בודק את הכפתור שוב ושוב."]}], "extra": [{"command": "else if", "example": "else if (digitalRead(3) == LOW) {", "meaning": ["Checks button 2 if button 1 is up.", "Проверяет кнопку 2, если первая отпущена.", "按钮 1 松开时检查按钮 2。", "בודק את כפתור 2 אם כפתור 1 משוחרר."]}, {"command": "delay(1000)", "example": "tone(11, 660);\ndelay(1000);\nnoTone(11);", "meaning": ["Starts the tone, waits one second, then stops it. Arduino checks the buttons again after that.", "Включает звук, ждёт одну секунду, затем выключает звук. После этого Arduino снова проверяет кнопки.", "先发声，等一秒，再停止。之后 Arduino 再检查按钮。", "מפעילים צליל, ממתינים שנייה ואז מפסיקים אותו. אחר כך Arduino בודק את הכפתורים שוב."]}]}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-8-quiz-buzzer/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
