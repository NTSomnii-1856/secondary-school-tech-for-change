  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 7, "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"], "main": {"start": ["Open your Lesson 6 project. If you need a fresh start, use the starter below. Green is already set up.", "Открой проект с урока 6. Если нужно начать заново, открой заготовку ниже. Зелёный свет уже настроен.", "打开第 6 课的项目。需要重新开始时，打开下方的起始项目，绿灯已设置好。", "פתחו את הפרויקט משיעור 6. אם צריך להתחיל מחדש, פתחו את פרויקט ההתחלה למטה. האור הירוק כבר מוכן."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "traffic7", "open": ["Open traffic-light starter", "Открыть заготовку светофора", "打开信号灯起始项目", "פתיחת פרויקט הרמזור"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["Green 10 · Amber 9 · Red 8. In delay(), 1000 means one second.", "Зелёный 10 · Жёлтый 9 · Красный 8. В delay() 1000 означает секунду.", "绿灯 10 · 黄灯 9 · 红灯 8。delay() 中的 1000 表示 1 秒。", "ירוק 10 · צהוב 9 · אדום 8. ב-delay(), המספר 1000 הוא שנייה אחת."], "code": "digitalWrite(10, HIGH);\ndelay(3000);\ndigitalWrite(10, LOW);"}, "extra": {"title": ["Build a pedestrian crossing", "Сделай пешеходный переход", "制作行人过街信号灯", "בנו מעבר חצייה"], "start": ["A pedestrian presses while cars are moving. The starter remembers the press and waits for car red. You control the pedestrian lights.", "Пешеход нажимает кнопку, пока машины едут. Заготовка запоминает нажатие и ждёт красного для машин. Ты управляешь огнями для пешеходов.", "车辆行驶时，行人按下按钮。起始项目会记住按键并等到车灯变红。你来控制行人灯。", "הולך רגל לוחץ בזמן שהמכוניות נוסעות. פרויקט ההתחלה זוכר את הלחיצה ומחכה לאדום למכוניות. אתם שולטים באורות להולכי הרגל."], "learn": ["Use the car’s red phase to give pedestrians a safe turn.", "Дай пешеходам пройти, когда для машин горит красный.", "在车辆红灯阶段给行人安全通行的时间。", "תנו להולכי הרגל לחצות בזמן שהאור למכוניות אדום."], "project": "crossing7", "open": ["Open in Wokwi", "Открыть в Wokwi", "在 Wokwi 中打开", "פתיחה ב-Wokwi"], "steps": [["Find the comment “Add your pedestrian lights here”. Put your crossing code below it.", "Найди комментарий «Add your pedestrian lights here». Добавь код сразу под ним.", "找到注释 “Add your pedestrian lights here”，把过街代码写在下一行。", "מצאו את ההערה “Add your pedestrian lights here”. כתבו מתחתיה את קוד החצייה."], ["Turn pedestrian red off. Turn pedestrian green on for 5 seconds.", "Выключи красный для пешеходов. Включи их зелёный на 5 секунд.", "关闭行人红灯，开启行人绿灯 5 秒。", "כבו את האדום להולכי הרגל. הדליקו את הירוק שלהם ל-5 שניות."], ["Turn pedestrian green off and red back on. Run and press the button while car green is on.", "Выключи зелёный для пешеходов и верни красный. Запусти и нажми кнопку, пока машинам горит зелёный.", "关闭行人绿灯并重新开启红灯。运行，在车辆绿灯时按按钮。", "כבו את הירוק להולכי הרגל והדליקו שוב אדום. הריצו ולחצו על הכפתור כשהאור למכוניות ירוק."]], "done": ["Cars stop first. Pedestrians get 5 seconds of green, then their red returns before cars go.", "Машины сначала останавливаются. Пешеходам горит зелёный 5 секунд. Их красный возвращается до начала движения машин.", "车辆先停下。行人绿灯亮 5 秒，随后在车辆通行前恢复行人红灯。", "המכוניות עוצרות קודם. להולכי הרגל יש 5 שניות של ירוק. האדום שלהם חוזר לפני שהמכוניות נוסעות."], "facts": ["Use pedestrianRed and pedestrianGreen. The two red-light pauses are already in the starter.", "Используй pedestrianRed и pedestrianGreen. Обе паузы с красным уже есть в заготовке.", "使用 pedestrianRed 和 pedestrianGreen。起始项目已安排两次红灯等待。", "השתמשו ב-pedestrianRed וב-pedestrianGreen. שתי ההמתנות באור אדום כבר כלולות."], "code": "    digitalWrite(pedestrianGreen, HIGH);\n    Crossing.pause(5000);"}}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"]}, "links": {"traffic7": "https://wokwi.com/projects/480513421513756673", "crossing7": "https://wokwi.com/projects/480513880390634497"}};</script>
