  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 7, "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"], "main": {"start": ["Open your traffic-light circuit from Week 6 in Tinkercad. Use the diagram to check the pins. For a fresh circuit, use the starter code.", "Открой светофор с недели 6 в Tinkercad. Сверь выводы со схемой. Для новой схемы используй заготовку.", "在 Tinkercad 中打开第 6 周的信号灯。用图检查引脚。新建电路时可用起始代码。", "פתחו את הרמזור משבוע 6 ב-Tinkercad. בדקו פינים לפי התרשים. למעגל חדש השתמשו בקוד ההתחלה."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["Green 10 · Amber 9 · Red 8. In delay(), 1000 means one second.", "Зелёный 10 · Жёлтый 9 · Красный 8. В delay() 1000 означает секунду.", "绿灯 10 · 黄灯 9 · 红灯 8。delay() 中的 1000 表示 1 秒。", "ירוק 10 · צהוב 9 · אדום 8. ב-delay(), המספר 1000 הוא שנייה אחת."], "code": "digitalWrite(10, HIGH);\ndelay(3000);\ndigitalWrite(10, LOW);", "notes": [["Begin with one working light. The wait gives you time to see it.", "Начни с одной рабочей лампы. Пауза позволяет увидеть её.", "从一盏能工作的灯开始。等待让你看清它。", "התחילו באור אחד שעובד. ההמתנה מאפשרת לראות אותו."], ["Use the same on, wait, off pattern for each colour.", "Для каждого цвета повтори «включи, подожди, выключи».", "每种颜色都使用相同的“亮、等、灭”顺序。", "השתמשו באותו סדר לכל צבע: הדלקה, המתנה, כיבוי."], ["If two lights stay on, check the off command for the first one.", "Если горят две лампы, проверь выключение первой.", "如果两盏灯同时亮着，检查第一盏的关闭命令。", "אם שני אורות נשארים דולקים, בדקו את פקודת הכיבוי של הראשון."]], "figure": {"file": "traffic7.svg", "caption": ["Each LED uses its own 220 Ω resistor. Connect + towards its pin and − to GND.", "У каждого светодиода свой резистор 220 Ом. Подключи + к выводу через резистор, − к GND.", "每盏 LED 单独使用一个 220 Ω 电阻。正极经电阻接引脚，负极接 GND。", "לכל נורית נגד 220Ω משלה. חברו + לפין דרך הנגד ו-− ל-GND."]}, "starter": "void setup() {\n  pinMode(8, OUTPUT);\n  pinMode(9, OUTPUT);\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);\n  delay(3000);\n  digitalWrite(10, LOW);\n  // Add amber and red here.\n}\n"}, "extra": {"title": ["Build a pedestrian crossing", "Сделай пешеходный переход", "制作行人过街信号灯", "בנו מעבר חצייה"], "start": ["Make a copy of your traffic lights. Add the two WALK lights and the request button shown below.", "Скопируй светофор. Добавь два пешеходных огня и кнопку по схеме.", "复制你的信号灯项目。按图添加两盏行人灯和请求按钮。", "צרו עותק של הרמזור. הוסיפו את שני אורות החצייה ואת הכפתור שבתרשים."], "learn": ["Use the car’s red phase to give pedestrians a safe turn.", "Дай пешеходам пройти, когда для машин горит красный.", "在车辆红灯阶段给行人安全通行的时间。", "תנו להולכי הרגל לחצות בזמן שהאור למכוניות אדום."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Open Starter code on this lesson page. Paste it into Code → Text in Tinkercad, then select Start Simulation.", "Открой стартовый код на странице урока. Вставь его в Code → Text в Tinkercad и выбери Start Simulation.", "打开本课程页面的起始代码。粘贴到 Tinkercad 的 Code → Text，再点击 Start Simulation。", "פתחו קוד התחלה בדף השיעור. הדביקו אותו ב-Code → Text ב-Tinkercad ולחצו Start Simulation."], ["Find the comment “Add your pedestrian lights here”. Put your crossing code below it.", "Найди комментарий «Add your pedestrian lights here». Добавь код сразу под ним.", "找到注释 “Add your pedestrian lights here”，把过街代码写在下一行。", "מצאו את ההערה “Add your pedestrian lights here”. כתבו מתחתיה את קוד החצייה."], ["Turn pedestrian red off. Turn pedestrian green on for 5 seconds.", "Выключи красный для пешеходов. Включи их зелёный на 5 секунд.", "关闭行人红灯，开启行人绿灯 5 秒。", "כבו את האדום להולכי הרגל. הדליקו את הירוק שלהם ל-5 שניות."], ["Turn pedestrian green off and red back on. Run and press the button while car green is on.", "Выключи зелёный для пешеходов и верни красный. Запусти и нажми кнопку, пока машинам горит зелёный.", "关闭行人绿灯并重新开启红灯。运行，在车辆绿灯时按按钮。", "כבו את הירוק להולכי הרגל והדליקו שוב אדום. הריצו ולחצו על הכפתור כשהאור למכוניות ירוק."]], "done": ["Cars stop first. Pedestrians get 5 seconds of green, then their red returns before cars go.", "Машины сначала останавливаются. Пешеходам горит зелёный 5 секунд. Их красный возвращается до начала движения машин.", "车辆先停下。行人绿灯亮 5 秒，随后在车辆通行前恢复行人红灯。", "המכוניות עוצרות קודם. להולכי הרגל יש 5 שניות של ירוק. האדום שלהם חוזר לפני שהמכוניות נוסעות."], "facts": ["D6 is walk red. D7 is walk green. Put these lines under the comment. Add the red-off and return-to-red commands yourself.", "D6 — красный для пешеходов, D7 — зелёный. Добавь строки под комментарием. Сам добавь выключение и возврат красного.", "D6 是行人红灯，D7 是行人绿灯。把这些行放在注释下方，再自己加上关闭和恢复红灯的命令。", "D6 אדום להולכי רגל, D7 ירוק. שימו את השורות מתחת להערה. הוסיפו בעצמכם כיבוי אדום וחזרה לאדום."], "code": "    digitalWrite(7, HIGH);\n    waitAndRead(5000, false);", "notes": [["The starter keeps car green and pedestrian green apart.", "Заготовка разделяет зелёный для машин и пешеходов.", "起始代码让车灯和行人灯的绿灯分开。", "קוד ההתחלה מפריד בין האור הירוק למכוניות ולהולכי רגל."], ["The car is already on red at this point.", "В этот момент машинам уже горит красный.", "此处车辆红灯已经亮起。", "בנקודה הזו האור למכוניות כבר אדום."], ["While pedestrians walk, the cars must stay on red.", "Пока пешеходы идут, машинам должен гореть красный.", "行人通行时，车辆应保持红灯。", "בזמן החצייה, האור למכוניות צריך להישאר אדום."], ["A request during car green should wait for car red.", "Нажатие на зелёном должно дождаться красного для машин.", "车辆绿灯时的请求应等到车辆红灯。", "לחיצה בזמן ירוק למכוניות צריכה לחכות לאדום."]], "figure": {"file": "crossing7.svg", "caption": ["Each LED needs its own 220 Ω resistor. On each push button, use one leg from each side of the switch.", "У каждого светодиода свой резистор 220 Ом. Подключай одну ножку с каждой стороны кнопки.", "每盏 LED 使用独立的 220 Ω 电阻。每个按钮分别使用开关两侧各一个引脚。", "לכל נורית נגד 220Ω משלה. בכל כפתור חברו רגל אחת מכל צד של המפסק."]}, "starter": "bool request = false;\nbool wasPressed = false;\n\n// This helper waits and remembers a new button press.\nvoid waitAndRead(unsigned long duration, bool takeRequest) {\n  unsigned long start = millis();\n  while (millis() - start \u003c duration) {\n    bool pressed = digitalRead(2) == LOW;\n    if (takeRequest && pressed && !wasPressed) request = true;\n    wasPressed = pressed;\n    delay(10);\n  }\n}\n\nvoid setup() {\n  pinMode(2, INPUT_PULLUP);\n  pinMode(6, OUTPUT);\n  pinMode(7, OUTPUT);\n  pinMode(8, OUTPUT);\n  pinMode(9, OUTPUT);\n  pinMode(10, OUTPUT);\n  digitalWrite(6, HIGH);\n  wasPressed = digitalRead(2) == LOW;\n}\n\nvoid loop() {\n  digitalWrite(8, LOW);\n  digitalWrite(10, HIGH);\n  waitAndRead(3000, true);\n  digitalWrite(10, LOW);\n  digitalWrite(9, HIGH);\n  waitAndRead(1000, true);\n  digitalWrite(9, LOW);\n  digitalWrite(8, HIGH);\n  waitAndRead(1000, true);\n\n  if (request) {\n    request = false;\n    waitAndRead(1000, false);\n    // Add your pedestrian lights here.\n    waitAndRead(1000, false);\n  }\n}\n"}, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-7-pedestrian-crossing/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
