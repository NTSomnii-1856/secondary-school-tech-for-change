  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 7, "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"], "main": {"start": ["Open your traffic-light circuit from Week 6 in Tinkercad. Use the diagram to check the pins. For a fresh circuit, use the starter code.", "Открой светофор с недели 6 в Tinkercad. Сверь выводы со схемой. Для новой схемы используй заготовку.", "在 Tinkercad 中打开第 6 周的信号灯。用图检查引脚。新建电路时可用起始代码。", "פתחו את הרמזור משבוע 6 ב-Tinkercad. בדקו פינים לפי התרשים. למעגל חדש השתמשו בקוד ההתחלה."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["Use this full sketch in Code → Text. Match the pin numbers to the diagram.", "Используй весь скетч в Code → Text. Сверь выводы со схемой.", "在 Code → Text 中使用这份完整代码。引脚编号要与图一致。", "השתמשו בכל הסקץ׳ ב-Code → Text. התאימו את הפינים לתרשים."], "code": "void setup() {\n  pinMode(10, OUTPUT);       // Green\n  pinMode(9, OUTPUT);        // Amber\n  pinMode(8, OUTPUT);        // Red\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);    // Green for 3 seconds.\n  delay(3000);\n  digitalWrite(10, LOW);     // Green off before amber.\n  digitalWrite(9, HIGH);     // Amber for 1 second.\n  delay(1000);\n  digitalWrite(9, LOW);\n  digitalWrite(8, HIGH);     // Red for 1 second.\n  delay(1000);\n  digitalWrite(8, LOW);      // Red off before green repeats.\n}", "notes": [["Begin with one working light. The wait gives you time to see it.", "Начни с одной рабочей лампы. Пауза позволяет увидеть её.", "从一盏能工作的灯开始。等待让你看清它。", "התחילו באור אחד שעובד. ההמתנה מאפשרת לראות אותו."], ["Use the same on, wait, off pattern for each colour.", "Для каждого цвета повтори «включи, подожди, выключи».", "每种颜色都使用相同的“亮、等、灭”顺序。", "השתמשו באותו סדר לכל צבע: הדלקה, המתנה, כיבוי."], ["If two lights stay on, check the off command for the first one.", "Если горят две лампы, проверь выключение первой.", "如果两盏灯同时亮着，检查第一盏的关闭命令。", "אם שני אורות נשארים דולקים, בדקו את פקודת הכיבוי של הראשון."]], "figure": {"file": "traffic7.svg", "caption": ["Each LED uses its own 220 Ω resistor. Connect + towards its pin and − to GND.", "У каждого светодиода свой резистор 220 Ом. Подключи + к выводу через резистор, − к GND.", "每盏 LED 单独使用一个 220 Ω 电阻。正极经电阻接引脚，负极接 GND。", "לכל נורית נגד 220Ω משלה. חברו + לפין דרך הנגד ו-− ל-GND."]}, "starter": "void setup() {\n  pinMode(8, OUTPUT);\n  pinMode(9, OUTPUT);\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);\n  delay(3000);\n  digitalWrite(10, LOW);\n  // Add amber and red here.\n}\n"}, "extra": {"title": ["Build a push-button crossing", "Сделай переход с кнопкой", "制作按钮控制的过街信号灯", "בנו מעבר חצייה עם כפתור"], "start": ["Copy your traffic-light circuit. Add the two walk LEDs and a push button using the diagram.", "Скопируй схему светофора. Добавь два пешеходных светодиода и кнопку по схеме.", "复制交通灯电路。按图加上两盏行人灯和一个按钮。", "העתיקו את מעגל הרמזור. הוסיפו את שתי נוריות החצייה וכפתור לפי התרשים."], "learn": ["Use INPUT_PULLUP and if to start the crossing when someone presses the button.", "Используй INPUT_PULLUP и if, чтобы переход начинался при нажатии кнопки.", "用 INPUT_PULLUP 和 if，让按下按钮时启动过街顺序。", "השתמשו ב־INPUT_PULLUP וב־if כדי להתחיל את החצייה בלחיצה על הכפתור."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Wire button leg 1a to D2 and 2a to GND. Paste Starter code into Code → Text.", "Соедини 1a с D2, а 2a с GND. Вставь стартовый код в Code → Text.", "把 1a 接 D2，2a 接 GND。把起始代码粘贴到 Code → Text。", "חברו 1a ל־D2 ואת 2a ל־GND. הדביקו את קוד ההתחלה ב־Code → Text."], ["Under “Add the walk signal here”, switch walk red off and walk green on. After 3 seconds, switch back.", "Под «Add the walk signal here» выключи красный и включи зелёный для пешеходов. Через 3 секунды переключи обратно.", "在“Add the walk signal here”下关掉行人红灯，打开行人绿灯。3 秒后切换回来。", "מתחת ל־“Add the walk signal here” כבו אדום להולכי רגל והדליקו ירוק. אחרי 3 שניות החליפו בחזרה."], ["Run. Check that car green stays on. Tap and release the button once, then watch the lights.", "Запусти. Проверь, что машинам горит зелёный. Коротко нажми кнопку и проследи за огнями.", "运行。确认车辆绿灯保持亮起。轻按并松开按钮，再观察灯光。", "הריצו. בדקו שהירוק למכוניות נשאר דולק. לחצו לחיצה קצרה על הכפתור וצפו באורות."]], "done": ["One tap gives car amber, then car red, then 3 seconds of walk green. Walk red comes back before cars go.", "Одно нажатие даёт жёлтый и красный для машин, затем 3 секунды зелёного для пешеходов. Красный для пешеходов возвращается до начала движения.", "轻按一次，车灯先黄后红，行人绿灯亮 3 秒。车辆通行前，行人红灯重新亮起。", "לחיצה קצרה נותנת צהוב ואז אדום למכוניות, ואז ירוק להולכי רגל ל־3 שניות. האדום להולכי רגל חוזר לפני שהמכוניות נוסעות."], "facts": ["Paste these five lines under “Add the walk signal here”, inside the if block.", "Вставь эти пять строк под «Add the walk signal here» внутри блока if.", "把这五行粘贴到 if 块内“Add the walk signal here”下方。", "הדביקו את חמש השורות מתחת ל־“Add the walk signal here”, בתוך בלוק if."], "code": "    digitalWrite(6, LOW);   // Turn walk red off.\n    digitalWrite(7, HIGH);  // People can cross.\n    delay(3000);            // Give them 3 seconds.\n    digitalWrite(7, LOW);   // End the walk signal.\n    digitalWrite(6, HIGH);  // People wait again.", "notes": [["INPUT_PULLUP keeps D2 HIGH at rest. A press connects it to GND, so it reads LOW.", "INPUT_PULLUP держит D2 в HIGH. Нажатие соединяет его с GND, поэтому он читается как LOW.", "INPUT_PULLUP 让 D2 平时保持 HIGH。按下会接到 GND，所以读到 LOW。", "INPUT_PULLUP שומר על D2 במצב HIGH. לחיצה מחברת אותו ל־GND ולכן קוראים LOW."], ["The starter turns car red on first. Code help shows all five walk lines.", "Заготовка сначала включает красный для машин. В подсказке есть все пять строк для перехода.", "起始代码先开启车辆红灯。代码提示有行人灯的全部五行。", "קוד ההתחלה מדליק קודם אדום למכוניות. העזרה בקוד מציגה את כל חמש שורות החצייה."], ["Walk red must come back on before cars get green again.", "Красный для пешеходов должен вернуться до зелёного для машин.", "车辆恢复绿灯前，行人红灯必须重新亮起。", "האדום להולכי רגל חייב לחזור לפני שהמכוניות מקבלות ירוק."]], "figure": {"file": "push-button-crossing7.svg", "caption": ["Button: 1a to D2, 2a to GND. Use one 220 Ω resistor for each LED.", "Кнопка: 1a к D2, 2a к GND. По одному резистору 220 Ом на светодиод.", "按钮：1a 接 D2，2a 接 GND。每盏灯各用一个 220 Ω 电阻。", "כפתור: 1a ל־D2, 2a ל־GND. נגד 220Ω אחד לכל נורית."]}, "starter": "void setup() {\n  pinMode(2, INPUT_PULLUP); // Crossing button\n  pinMode(10, OUTPUT);  // Car green\n  pinMode(9, OUTPUT);   // Car amber\n  pinMode(8, OUTPUT);   // Car red\n  pinMode(6, OUTPUT);   // Walk red\n  pinMode(7, OUTPUT);   // Walk green\n\n  digitalWrite(10, HIGH); // Cars go.\n  digitalWrite(6, HIGH);  // People wait.\n}\n\nvoid loop() {\n  if (digitalRead(2) == LOW) { // A press starts the crossing.\n    digitalWrite(10, LOW);\n    digitalWrite(9, HIGH);     // Give cars a warning.\n    delay(1000);\n    digitalWrite(9, LOW);\n    digitalWrite(8, HIGH);     // Cars stop first.\n    delay(1000);\n\n    // Add the walk signal here.\n\n    delay(1000);              // Both reds stay on for a moment.\n    digitalWrite(8, LOW);\n    digitalWrite(10, HIGH);    // Cars go again.\n  }\n}\n"}, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "notebook": {"main": [{"command": "pinMode()", "example": "pinMode(10, OUTPUT);", "meaning": ["Sets pin 10 up to control a light.", "Настраивает вывод 10 для управления лампой.", "把引脚 10 设为输出，用来控制灯。", "מגדירה פין 10 כפלט ששולט באור."]}, {"command": "digitalWrite()", "example": "digitalWrite(10, HIGH);", "meaning": ["For these LEDs, HIGH turns the light on and LOW turns it off.", "Для этих ламп HIGH включает свет, LOW выключает.", "在这些 LED 上，HIGH 开灯，LOW 关灯。", "בנוריות האלה HIGH מדליק ו-LOW מכבה."]}, {"command": "delay()", "example": "delay(1000);", "meaning": ["Waits in milliseconds. 1000 is one second.", "Ждёт в миллисекундах. 1000 — одна секунда.", "按毫秒等待。1000 毫秒等于 1 秒。", "ממתינה באלפיות שנייה. 1000 הן שנייה אחת."]}, {"command": "setup()", "example": "void setup() { ... }", "meaning": ["Runs once when the Arduino starts.", "Запускается один раз при старте Arduino.", "Arduino 启动时运行一次。", "פועלת פעם אחת כש-Arduino מתחיל."]}, {"command": "loop()", "example": "void loop() { ... }", "meaning": ["Repeats the commands inside it.", "Повторяет команды внутри.", "重复执行里面的命令。", "חוזרת על הפקודות שבתוכה."]}], "extra": [{"command": "INPUT_PULLUP", "example": "pinMode(2, INPUT_PULLUP);", "meaning": ["Uses a resistor inside the Arduino. It holds D2 at HIGH until the button connects D2 to GND.", "Включает резистор внутри Arduino. D2 остаётся HIGH, пока кнопка не соединит его с GND.", "启用 Arduino 内部的电阻。按钮把 D2 接到 GND 前，D2 保持 HIGH。", "מפעילה נגד בתוך ה־Arduino. הוא שומר על D2 במצב HIGH עד שהכפתור מחבר אותו ל־GND."]}, {"command": "digitalRead()", "example": "digitalRead(2)", "meaning": ["Reads the pin. In this circuit, LOW means the button is pressed.", "Читает вывод. В этой схеме LOW означает нажатие.", "读取引脚。在此电路中，LOW 表示按钮被按下。", "קוראת את הפין. במעגל הזה LOW מציין כפתור לחוץ."]}, {"command": "if", "example": "if (digitalRead(2) == LOW) {", "meaning": ["void loop() checks the button again and again. The crossing starts when D2 is LOW.", "void loop() снова и снова проверяет кнопку. Переход начинается, когда D2 равен LOW.", "void loop() 反复检查按钮。D2 为 LOW 时启动过街顺序。", "void loop() בודק את הכפתור שוב ושוב. החצייה מתחילה כש־D2 נקרא LOW."]}]}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-7-pedestrian-crossing/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
