  <script>window.FOCUSED_LESSON = {"lesson": {"year": 7, "lesson": 7, "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"], "main": {"start": ["Open your traffic-light circuit from Week 6 in Tinkercad. Use the diagram to check the pins. For a fresh circuit, use the starter code.", "Открой светофор с недели 6 в Tinkercad. Сверь выводы со схемой. Для новой схемы используй заготовку.", "在 Tinkercad 中打开第 6 周的信号灯。用图检查引脚。新建电路时可用起始代码。", "פתחו את הרמזור משבוע 6 ב-Tinkercad. בדקו פינים לפי התרשים. למעגל חדש השתמשו בקוד ההתחלה."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["Use this full sketch in Code → Text. Match the pin numbers to the diagram.", "Используй весь скетч в Code → Text. Сверь выводы со схемой.", "在 Code → Text 中使用这份完整代码。引脚编号要与图一致。", "השתמשו בכל הסקץ׳ ב-Code → Text. התאימו את הפינים לתרשים."], "code": "void setup() {\n  pinMode(10, OUTPUT);       // Green\n  pinMode(9, OUTPUT);        // Amber\n  pinMode(8, OUTPUT);        // Red\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);    // Green for 3 seconds.\n  delay(3000);\n  digitalWrite(10, LOW);     // Green off before amber.\n  digitalWrite(9, HIGH);     // Amber for 1 second.\n  delay(1000);\n  digitalWrite(9, LOW);\n  digitalWrite(8, HIGH);     // Red for 1 second.\n  delay(1000);\n  digitalWrite(8, LOW);      // Red off before green repeats.\n}", "notes": [["Begin with one working light. The wait gives you time to see it.", "Начни с одной рабочей лампы. Пауза позволяет увидеть её.", "从一盏能工作的灯开始。等待让你看清它。", "התחילו באור אחד שעובד. ההמתנה מאפשרת לראות אותו."], ["Use the same on, wait, off pattern for each colour.", "Для каждого цвета повтори «включи, подожди, выключи».", "每种颜色都使用相同的“亮、等、灭”顺序。", "השתמשו באותו סדר לכל צבע: הדלקה, המתנה, כיבוי."], ["If two lights stay on, check the off command for the first one.", "Если горят две лампы, проверь выключение первой.", "如果两盏灯同时亮着，检查第一盏的关闭命令。", "אם שני אורות נשארים דולקים, בדקו את פקודת הכיבוי של הראשון."]], "figure": {"file": "traffic7.svg", "caption": ["Each LED uses its own 220 Ω resistor. Connect + towards its pin and − to GND.", "У каждого светодиода свой резистор 220 Ом. Подключи + к выводу через резистор, − к GND.", "每盏 LED 单独使用一个 220 Ω 电阻。正极经电阻接引脚，负极接 GND。", "לכל נורית נגד 220Ω משלה. חברו + לפין דרך הנגד ו-− ל-GND."]}, "starter": "void setup() {\n  pinMode(8, OUTPUT);\n  pinMode(9, OUTPUT);\n  pinMode(10, OUTPUT);\n}\n\nvoid loop() {\n  digitalWrite(10, HIGH);\n  delay(3000);\n  digitalWrite(10, LOW);\n  // Add amber and red here.\n}\n"}, "extra": {"title": ["Build a timed pedestrian crossing", "Сделай переход с таймером", "制作定时行人信号灯", "בנו מעבר חצייה מתוזמן"], "start": ["Copy your traffic-light circuit. Add the two walk LEDs, then paste Starter code into Code → Text.", "Скопируй схему светофора. Добавь два огня перехода. Вставь стартовый код в Code → Text.", "复制交通灯电路。加上两盏行人灯，在 Code → Text 中粘贴起始代码。", "העתיקו את מעגל הרמזור. הוסיפו את שתי נוריות החצייה והדביקו את קוד ההתחלה ב־Code → Text."], "learn": ["Change the walk lights in order. Cars stay on red for the whole crossing.", "Меняй огни перехода по порядку. Машинам всё время горит красный.", "按顺序切换行人灯。过街过程中车辆一直是红灯。", "החליפו את אורות החצייה לפי הסדר. למכוניות יש אדום במשך כל החצייה."], "project": "tinkercad", "open": ["Open Tinkercad Circuits", "Открыть Tinkercad Circuits", "打开 Tinkercad Circuits", "פתיחת Tinkercad Circuits"], "steps": [["Under “Add the walk signal here”, turn walk red off and walk green on.", "Под «Add the walk signal here» выключи красный для пешеходов и включи зелёный.", "在“Add the walk signal here”下方关闭行人红灯，开启行人绿灯。", "מתחת ל־“Add the walk signal here” כבו אדום להולכי רגל והדליקו ירוק."], ["Wait 3 seconds. Then turn walk green off and walk red back on.", "Подожди 3 секунды. Затем выключи зелёный и верни красный для пешеходов.", "等 3 秒。然后关掉行人绿灯，重新打开行人红灯。", "המתינו 3 שניות. כבו ירוק להולכי רגל והדליקו שוב אדום."], ["Run. Watch the car lights change first, then watch the walk lights.", "Запусти. Сначала посмотри на огни для машин, затем на огни перехода.", "运行。先观察车灯变化，再观察行人灯。", "הריצו. צפו קודם באורות למכוניות ואז באורות החצייה."]], "done": ["Cars stop first. Walk green lasts 3 seconds. The two green lights never come on together.", "Сначала машины останавливаются. Зелёный для пешеходов горит 3 секунды. Два зелёных огня никогда не горят вместе.", "车辆先停下。行人绿灯亮 3 秒。两盏绿灯不会同时亮。", "המכוניות עוצרות קודם. הירוק להולכי רגל דולק 3 שניות. שני האורות הירוקים לא דולקים יחד."], "facts": ["Paste these five lines below the comment “Add the walk signal here”.", "Вставь эти пять строк под комментарием «Add the walk signal here».", "把这五行代码粘贴到 “Add the walk signal here” 注释下方。", "הדביקו את חמש השורות מתחת להערה “Add the walk signal here”."], "code": "  digitalWrite(6, LOW);   // Turn walk red off.\n  digitalWrite(7, HIGH);  // People can cross.\n  delay(3000);            // Give them 3 seconds.\n  digitalWrite(7, LOW);   // End the walk signal.\n  digitalWrite(6, HIGH);  // People wait again.", "notes": [["The car red light is already on.", "Красный для машин уже горит.", "车辆红灯已经亮起。", "האור האדום למכוניות כבר דולק."], ["Leave car red on.", "Оставь красный для машин включённым.", "车辆红灯保持亮起。", "השאירו את האדום למכוניות דולק."], ["Both red lights should be on at the end.", "В конце горят оба красных огня.", "结束时两盏红灯都亮。", "בסוף שני האורות האדומים דולקים."]], "figure": {"file": "timed-crossing7.svg", "caption": ["Car green D10, amber D9, red D8. Walk red D6, green D7. Use one 220 Ω resistor for each LED.", "Зелёный D10, жёлтый D9, красный D8. Переход: красный D6, зелёный D7. По одному резистору 220 Ом на светодиод.", "车灯：绿 D10、黄 D9、红 D8。行人灯：红 D6、绿 D7。每盏灯各用一个 220 Ω 电阻。", "מכוניות: ירוק D10, צהוב D9, אדום D8. חצייה: אדום D6, ירוק D7. נגד 220Ω אחד לכל נורית."]}, "starter": "void setup() {\n  pinMode(10, OUTPUT);  // Car green\n  pinMode(9, OUTPUT);   // Car amber\n  pinMode(8, OUTPUT);   // Car red\n  pinMode(6, OUTPUT);   // Walk red\n  pinMode(7, OUTPUT);   // Walk green\n\n  digitalWrite(6, HIGH);   // People wait.\n  digitalWrite(10, HIGH);  // Cars go for 3 seconds.\n  delay(3000);\n  digitalWrite(10, LOW);\n  digitalWrite(9, HIGH);   // Cars get an amber warning.\n  delay(1000);\n  digitalWrite(9, LOW);\n  digitalWrite(8, HIGH);   // Cars stop.\n  delay(1000);\n\n  // Add the walk signal here.\n}\n\nvoid loop() {}  // Leave empty. This sketch runs once.\n"}, "platform": ["Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad", "Arduino Uno · Tinkercad"], "notebook": {"main": [{"command": "pinMode()", "example": "pinMode(10, OUTPUT);", "meaning": ["Sets pin 10 up to control a light.", "Настраивает вывод 10 для управления лампой.", "把引脚 10 设为输出，用来控制灯。", "מגדירה פין 10 כפלט ששולט באור."]}, {"command": "digitalWrite()", "example": "digitalWrite(10, HIGH);", "meaning": ["For these LEDs, HIGH turns the light on and LOW turns it off.", "Для этих ламп HIGH включает свет, LOW выключает.", "在这些 LED 上，HIGH 开灯，LOW 关灯。", "בנוריות האלה HIGH מדליק ו-LOW מכבה."]}, {"command": "delay()", "example": "delay(1000);", "meaning": ["Waits in milliseconds. 1000 is one second.", "Ждёт в миллисекундах. 1000 — одна секунда.", "按毫秒等待。1000 毫秒等于 1 秒。", "ממתינה באלפיות שנייה. 1000 הן שנייה אחת."]}, {"command": "setup()", "example": "void setup() { ... }", "meaning": ["Runs once when the Arduino starts.", "Запускается один раз при старте Arduino.", "Arduino 启动时运行一次。", "פועלת פעם אחת כש-Arduino מתחיל."]}, {"command": "loop()", "example": "void loop() { ... }", "meaning": ["Repeats the commands inside it.", "Повторяет команды внутри.", "重复执行里面的命令。", "חוזרת על הפקודות שבתוכה."]}], "extra": [{"command": "setup() / loop()", "example": "void loop() {}", "meaning": ["For this task, put the steps in setup() to run once. Leave loop() empty.", "Здесь команды в setup() идут один раз. Оставь loop() пустой.", "本任务把步骤放进 setup()，只运行一次。loop() 留空。", "כאן הפקודות ב־setup() רצות פעם אחת. השאירו את loop() ריקה."]}]}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-7/week-7-pedestrian-crossing/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"tinkercad": "https://www.tinkercad.com/circuits"}};</script>
