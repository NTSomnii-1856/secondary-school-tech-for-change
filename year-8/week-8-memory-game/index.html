  <script>window.FOCUSED_LESSON = {"lesson": {"year": 8, "lesson": 8, "title": ["Type the light pattern", "Введи порядок огней", "输入灯光顺序", "הקלידו את רצף האורות"], "main": {"start": ["Watch three flashes. Red is 1, amber is 2 and green is 3. Make the game check the order you type.", "Посмотри три вспышки. Красный — 1, жёлтый — 2, зелёный — 3. Научи игру проверять введённый порядок.", "观察三次闪灯。红灯是 1，黄灯是 2，绿灯是 3。让游戏检查你输入的顺序。", "צפו בשלושה הבהובים. אדום הוא 1, צהוב 2 וירוק 3. גרמו למשחק לבדוק את הסדר שהקלדתם."], "learn": ["input() reads the digits you type as text. == checks if your text matches the stored order.", "input() читает введённые цифры как текст. == проверяет, совпадает ли текст с сохранённым порядком.", "input() 把输入的数字读成文本。== 检查文本是否与保存的顺序相同。", "input() קוראת את הספרות שהקלדתם כטקסט. == בודק אם הטקסט מתאים לסדר שנשמר."], "project": "memory8", "open": ["Open in Wokwi", "Открыть в Wokwi", "在 Wokwi 中打开", "פתיחה ב-Wokwi"], "steps": [["Run. Click the Wokwi terminal, type 132 without spaces and press Enter.", "Запусти. Нажми на терминал Wokwi, введи 132 без пробелов и нажми Enter.", "运行。点击 Wokwi 终端，输入 132（不加空格），按 Enter。", "הריצו. לחצו בחלון המסוף של Wokwi, הקלידו 132 בלי רווחים ולחצו Enter."], ["In main.py, replace the last print line with a check. Print “Correct!” if the order matches and “Try again!” otherwise.", "В main.py замени последний print проверкой. При совпадении выводи «Correct!», иначе «Try again!».", "在 main.py 中，把最后一行 print 改成判断。顺序正确时显示 “Correct!”，否则显示 “Try again!”。", "ב-main.py החליפו את שורת ה-print האחרונה בבדיקה. הדפיסו “Correct!” כשהסדר מתאים, אחרת “Try again!”."], ["Run twice. Try 132 first, then 123. Restart with Stop and Run.", "Запусти дважды. Сначала попробуй 132, затем 123. Перезапусти через Stop и Run.", "运行两次。先试 132，再试 123。用 Stop 再 Run 重启。", "הריצו פעמיים. נסו קודם 132 ואז 123. התחילו שוב עם Stop ו-Run."]], "done": ["132 passes. 123 fails even though it uses the same digits.", "132 подходит. 123 не подходит, хотя цифры те же.", "132 通过。123 使用相同数字，但顺序不对。", "132 מתקבל. 123 נכשל למרות שהוא משתמש באותן ספרות."], "facts": ["Replace print(\"You typed\", answer). Keep the four spaces before each new print.", "Замени print(\"You typed\", answer). Сохрани четыре пробела перед каждым новым print.", "替换 print(\"You typed\", answer)。每个新 print 前保留四个空格。", "החליפו את print(\"You typed\", answer). השאירו ארבעה רווחים לפני כל print חדש."], "code": "if answer == expected:\n    print(\"Correct!\")\nelse:\n    print(\"Try again!\")"}, "extra": {"title": ["Make every round a surprise", "Сделай каждый раунд неожиданным", "让每轮都有惊喜", "הפתיעו בכל סיבוב"], "start": ["A player could memorise 132 once and win every time. Let the game choose the three flashes when it starts.", "Игрок может запомнить 132 и всегда выигрывать. Пусть игра выбирает три вспышки при запуске.", "玩家记住 132 就能一直赢。让程序在启动时选择三次闪灯。", "שחקן יכול לזכור 132 ולנצח בכל פעם. תנו למשחק לבחור שלושה הבהובים בהתחלה."], "learn": ["randint(1, 3) picks 1, 2 or 3. The same light can be picked twice.", "randint(1, 3) выбирает 1, 2 или 3. Один цвет может выпасть дважды.", "randint(1, 3) 随机选出 1、2 或 3。同一盏灯可能被选两次。", "randint(1, 3) בוחרת 1, 2 או 3. אותו אור יכול להיבחר פעמיים."], "steps": [["Replace the pattern line with three random picks. Keep your answer check.", "Замени строку pattern тремя случайными числами. Оставь проверку ответа.", "把 pattern 那一行改为三次随机选择。保留答案判断。", "החליפו את שורת pattern בשלוש בחירות אקראיות. השאירו את בדיקת התשובה."], ["Play a round. Type the order you actually saw.", "Сыграй раунд. Введи порядок, который увидел.", "玩一轮，输入你实际看到的顺序。", "שחקו סיבוב. הקלידו את הסדר שראיתם."]], "done": ["The game checks the lights it actually flashed. The old answer is only right if it matches this round.", "Игра проверяет показанные вспышки. Старый ответ верен, только если он совпал с новым порядком.", "游戏检查实际闪出的顺序。旧答案只有与本轮相同时才正确。", "המשחק בודק את הרצף שהבהב בפועל. התשובה הקודמת נכונה רק אם היא מתאימה לסיבוב הזה."], "facts": ["randint is already imported at the top of main.py.", "randint уже импортирован в начале main.py.", "main.py 顶部已导入 randint。", "randint כבר מיובאת בראש main.py."], "code": "pattern = [randint(1, 3), randint(1, 3), randint(1, 3)]"}}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"]}, "links": {"memory8": "https://wokwi.com/projects/480513900882960385"}};</script>
