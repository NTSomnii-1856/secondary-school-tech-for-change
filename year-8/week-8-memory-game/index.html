  <script>window.FOCUSED_LESSON = {"lesson": {"year": 8, "lesson": 8, "platform": ["Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico"], "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-8-memory-game/", "main": {"open": ["Open Wokwi starter", "Открыть заготовку Wokwi", "打开 Wokwi 起始项目", "פתיחת פרויקט Wokwi"], "done": ["132 is correct. 123 is rejected.", "132 верно, 123 неверно.", "132 正确，123 错误。", "132 מתקבל, 123 נדחה."], "project": "simpleGuess8", "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "starter": "from machine import Pin\nimport time\n\nrled = Pin(15, Pin.OUT)  # Car red\nyled = Pin(13, Pin.OUT)  # Car yellow\ngled = Pin(14, Pin.OUT)  # Car green\n\norder = [rled, gled, yled]         # Red, green, yellow.\nfor position in range(0, 3):       # Visit 0, 1 and 2.\n    light = order[position]        # Choose the next LED.\n    light.value(1)\n    time.sleep(1)\n    light.value(0)\n    time.sleep(1)                   # A gap between flashes.\n\n# Add the guess and result here.\n", "code": "answer = input(\"Type the three digits: \")  # Wait for Enter.\nif answer == \"132\":                         # Check the order.\n    print(\"Correct!\")\nelse:\n    print(\"Try again!\")", "start": ["Open the ready-wired Wokwi starter. Watch three flashes. Red is 1, yellow is 2 and green is 3.", "Открой заготовку Wokwi и посмотри три вспышки. Красный — 1, жёлтый — 2, зелёный — 3.", "打开接好线的 Wokwi 项目。观察三次闪灯。红为 1，黄为 2，绿为 3。", "פתחו את הפרויקט המוכן ב־Wokwi. צפו בשלושה הבהובים. אדום הוא 1, צהוב 2 וירוק 3."], "learn": ["Use input() to get a guess. Use if and else to tell the player whether it matches.", "Получи ответ через input(). Сообщи результат с if и else.", "用 input() 读取答案，再用 if 和 else 反馈是否正确。", "קבלו ניחוש עם input(). השתמשו ב־if וב־else כדי לומר אם הוא מתאים."], "steps": [["Run the starter. Check that red, green and yellow flash in that order.", "Запусти заготовку. Проверь порядок: красный, зелёный, жёлтый.", "运行起始项目，检查红、绿、黄是否按顺序闪烁。", "הריצו את קוד ההתחלה. בדקו שהאורות מהבהבים אדום, ירוק ואז צהוב."], ["Under “Add the guess and result here”, use input(), then check if the answer is \"132\".", "Под «Add the guess and result here» добавь input(), затем проверь ответ \"132\".", "在“Add the guess and result here”下用 input() 读取答案，再判断是否为“132”。", "מתחת ל־“Add the guess and result here” השתמשו ב־input(), ואז בדקו אם התשובה היא \"132\"."], ["Run again. Click the terminal, type 132 and press Enter. Restart and try 123.", "Запусти снова. В терминале введи 132 и нажми Enter. Перезапусти и попробуй 123.", "再运行。点击终端，输入 132 并按 Enter。重启后试 123。", "הריצו שוב. לחצו במסוף, הקלידו 132 ולחצו Enter. התחילו מחדש ונסו 123."]], "notes": [["The list and for loop already play the lights.", "Список и for уже мигают огнями.", "列表和 for 循环已控制闪灯。", "הרשימה ולולאת for כבר מפעילות את האורות."], ["Put input at the left margin so it asks once, after the flashes.", "Пиши input без отступа, чтобы спросить один раз после вспышек.", "input 顶格写，闪灯后只询问一次。", "כתבו input בלי הזחה כדי לשאול פעם אחת, אחרי ההבהובים."], ["Keep the digits together, without spaces.", "Пиши цифры вместе, без пробелов.", "连续输入数字，不加空格。", "הקלידו את הספרות ברצף, בלי רווחים."]], "facts": ["Paste these lines below the last comment. Keep the if and else at the left margin.", "Вставь эти строки под последним комментарием. Пиши if и else без отступа.", "把这些行粘贴到最后一行注释下方。if 和 else 顶格写。", "הדביקו את השורות מתחת להערה האחרונה. השאירו את if ואת else צמודים לשוליים."]}, "extra": {"title": ["Add a fourth flash", "Добавь четвёртую вспышку", "加入第四次闪灯", "הוסיפו הבהוב רביעי"], "start": ["Use the game you just made. Give the player a sequence with two red flashes in a row.", "Используй готовую игру. Добавь две красные вспышки подряд.", "使用你刚做好的游戏。让玩家记住连续两次红灯。", "השתמשו במשחק שבניתם. תנו לשחקן רצף עם שני הבהובים אדומים ברצף."], "learn": ["Change the list and the number of repeats to match the new answer.", "Согласуй список, число повторов и новый ответ.", "让列表和循环次数匹配新答案。", "התאימו את הרשימה ואת מספר החזרות לתשובה החדשה."], "done": ["3112 is correct. 312 is rejected.", "3112 верно, 312 неверно.", "3112 正确，312 错误。", "3112 מתקבל, 312 נדחה."], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "code": "order = [gled, rled, rled, yled]   # Green, red, red, yellow.\nfor position in range(0, 4):\n    light = order[position]\n    light.value(1)\n    time.sleep(1)\n    light.value(0)\n    time.sleep(1)                  # Separate the red flashes.\n\nanswer = input(\"Type the four digits: \")\nif answer == \"3112\":              # Match all four digits.\n    print(\"Correct!\")\nelse:\n    print(\"Try again!\")", "steps": [["Change the list to green, red, red, yellow.", "Поменяй список на зелёный, красный, красный, жёлтый.", "把列表改为绿、红、红、黄。", "שנו את הרשימה לירוק, אדום, אדום, צהוב."], ["Change range to four turns and the answer to \"3112\".", "Измени range на четыре повтора, а ответ — на \"3112\".", "把 range 改成循环四次，并把答案改为“3112”。", "שנו את range לארבע חזרות ואת התשובה ל־\"3112\"."], ["Run. Check that you see two separate red flashes. Test 3112 and 312.", "Запусти и проверь две отдельные красные вспышки. Попробуй 3112 и 312.", "运行。确认红灯分两次闪烁。测试 3112 和 312。", "הריצו. בדקו שיש שני הבהובים אדומים נפרדים. נסו 3112 ו־312."]], "notes": [["Use the same red light twice in the list.", "Дважды укажи красную лампу.", "在列表中使用红灯两次。", "השתמשו באור האדום פעמיים ברשימה."], ["Four lights need four turns of the loop.", "Для четырёх вспышек нужны четыре повтора.", "四次闪灯需要循环四次。", "ארבעה הבהובים דורשים ארבע חזרות."], ["Restart between guesses.", "Между попытками перезапускай программу.", "两次猜测之间重新运行。", "התחילו מחדש בין ניחושים."]], "facts": ["Keep the imports and pins. Replace everything from order = onward with this block.", "Оставь импорты и выводы. Замени всё от order = этим блоком.", "保留导入和引脚设置。从 order = 起替换为以下代码。", "השאירו את הייבוא ואת הגדרת הפינים. החליפו הכול מ־order = והלאה בבלוק הזה."]}, "title": ["Guess the light order", "Угадай порядок огней", "猜灯光顺序", "נחשו את רצף האורות"], "notebook": {"main": [{"command": "input()", "example": "answer = input(\"Your order: \")", "meaning": ["Waits for Enter and stores what you typed as text.", "Ждёт Enter и сохраняет введённое как текст.", "等待按 Enter，把输入保存成文本。", "ממתינה ל-Enter ושומרת את מה שהקלדתם כטקסט."]}, {"command": "==", "example": "answer == expected", "meaning": ["Checks whether both values match. For text, order matters.", "Проверяет совпадение значений. В тексте важен порядок.", "检查两个值是否相同。比较文本时，顺序很重要。", "בודק אם הערכים שווים. בטקסט, הסדר חשוב."]}, {"command": "if / else", "example": "if answer == expected:", "meaning": ["Runs the indented if lines when the check is true. Otherwise, it runs else.", "Выполняет строки внутри if, когда проверка верна. Иначе выполняет else.", "条件成立时执行 if 下缩进的代码，否则执行 else。", "מריץ את השורות המוזחות ב-if כשהתנאי נכון. אחרת מריץ את else."]}, {"command": "print()", "example": "print(\"Correct!\")", "meaning": ["Shows a message in the terminal.", "Показывает сообщение в терминале.", "在终端显示消息。", "מציגה הודעה במסוף."]}, {"command": "order[position]", "example": "order = [rled, gled, yled]\nlight = order[0]", "meaning": ["The list stores the lights in order. Position 0 is the first one.", "Список хранит лампы по порядку. Позиция 0 — первая.", "列表按顺序保存灯。位置 0 是第一盏。", "הרשימה שומרת את האורות לפי הסדר. מיקום 0 הוא הראשון."]}, {"command": "for … in range()", "example": "for cycle in range(0, 3):", "meaning": ["Runs the indented lines three times. cycle is 0, 1, then 2.", "Повторяет строки с отступом трижды. cycle равен 0, 1, затем 2.", "缩进的代码执行三次。cycle 依次为 0、1、2。", "מריצה את השורות המוזחות שלוש פעמים. cycle מקבל 0, 1 ואז 2."]}, {"command": "Pin()", "example": "rled = Pin(15, Pin.OUT)", "meaning": ["Sets GP15 up to control the red light.", "Настраивает GP15 для красного света.", "把 GP15 设为控制红灯的输出。", "מגדירה את GP15 לפלט ששולט באור האדום."]}, {"command": ".value() / time.sleep()", "example": "rled.value(1)\ntime.sleep(1)\nrled.value(0)", "meaning": ["Turns red on for one second, then turns it off.", "Включает красный на секунду, затем выключает.", "红灯亮一秒，然后熄灭。", "מדליק אדום לשנייה ואז מכבה אותו."]}], "extra": [{"command": "range(0, 4)", "example": "for position in range(0, 4):", "meaning": ["Visits positions 0, 1, 2 and 3 for four flashes.", "Перебирает позиции 0, 1, 2 и 3 для четырёх вспышек.", "依次访问位置 0、1、2 和 3，共闪四次。", "עובר על מיקומים 0, 1, 2 ו־3 לארבעה הבהובים."]}]}}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"simpleGuess8": "https://wokwi.com/projects/480643476207636481"}};</script>
