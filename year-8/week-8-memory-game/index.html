  <script>
    (() => {
      'use strict';

      const {PICO_CLASS_CIRCUIT, PICO_CLASS_WOKWI} = window;
      const setup = `from machine import Pin
import time

rled = Pin(15, Pin.OUT)
yled = Pin(13, Pin.OUT)
gled = Pin(14, Pin.OUT)

rled.value(0)
yled.value(0)
gled.value(0)`;

      const main = {

          'צפו בהבהובי הנוריות והקלידו את המספרים לפי הסדר. אדום הוא 1, צהוב הוא 2 וירוק הוא 3.'
        ],
        learn: [
          'Read items from a list by their position. Use each item to choose which LED flashes.',
          'Читай элементы списка по их позиции. Каждый элемент подскажет, какому светодиоду мигнуть.',

        ],
        steps: [
          [
            'Copy the pin setup below into main.py. Under it, add pattern = [1, 3, 2] and print(pattern[0]).',

            'Replace the test print with for i in range(3):. Inside the loop, write digit = pattern[i] and print(digit).',
            'Замени пробный print циклом for i in range(3):. Внутри напиши digit = pattern[i] и print(digit).',

            'החליפו את print(digit) ב־if / elif / else בתוך הלולאה. הבהבו באדום עבור 1, בירוק עבור 3 ובצהוב עבור 2.'
          ],
          [
            'After the loop, add answer = input("Your order: "). Run the program and enter 132.',
            'После цикла добавь answer = input("Your order: "). Запусти программу и введи 132.',
            '循环结束后，添加 answer = input("Your order: ")。运行程序并输入 132。',
            'אחרי הלולאה הוסיפו answer = input("Your order: "). הריצו את התוכנית והקלידו 132.'
          ],
          [
            'Below input(), write if answer == "132":. Print “Correct!” when it matches. Add else: to print “Try again!” for other answers.',
            'Под input() напиши if answer == "132":. При совпадении выведи «Correct!». Добавь else:, чтобы для других ответов выводилось «Try again!».',
            '在 input() 下方写 if answer == "132":。相符时显示 “Correct!”。加上 else:，其他答案显示 “Try again!”。',

            'Test 132. Restart with Stop, then Run, and test 123.',
            'Проверь 132. Перезапусти через Stop, затем Run, и проверь 123.',

        steps: [
          [
            'Change the pattern to green, red, red, yellow.',
            'Измени последовательность на зелёный, красный, красный, жёлтый.',
            '把闪灯顺序改成绿、红、红、黄。',
            'שנו את הסדר לירוק, אדום, אדום, צהוב.'

            'שנו את המספר ב־range() כך שיתאים לאורך הרשימה החדשה.'

            'Run and count four flashes. Test 3112. Restart and test 312.',
            'Запусти и посчитай четыре вспышки. Проверь 3112. Перезапусти и проверь 312.',

            'הריצו וספרו ארבעה הבהובים. בדקו 3112. התחילו מחדש ובדקו 312.'

            'ההפסקה כשהאור כבוי מפרידה בין שני ההבהובים האדומים.'

        ],

          'Видны две отдельные красные вспышки. Игра принимает 3112 и отклоняет 312.',

          'רואים שני הבהובים אדומים נפרדים. המשחק מקבל 3112 ודוחה 312.'

          'עדכנו את שורת הרצף במשחק. השתמשו ברשימה החדשה כדי למצוא את מספר החזרות ואת התשובה הנכונה.'

            example: 'rled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)',
            meaning: [
              'Sets up the red, yellow and green pins as outputs.',
              'Настраивает выводы для красного, жёлтого и зелёного как выходы.',
              '把红、黄、绿灯对应的引脚设为输出。',
              'מגדיר את הפינים של האדום, הצהוב והירוק כפלטים.'
            ]
          },
          {
            command: '.value() / time.sleep()',
            example: 'rled.value(1)\ntime.sleep(1)\nrled.value(0)\ntime.sleep(1)',
            meaning: [
              'Turns red on for one second, turns it off and leaves a one-second gap.',
