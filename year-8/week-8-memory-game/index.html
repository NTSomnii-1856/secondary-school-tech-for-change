  <script>window.FOCUSED_LESSON = {"lesson": {"year": 8, "lesson": 8, "platform": ["Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico"], "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-8-memory-game/", "main": {"open": ["Open Wokwi starter", "Открыть заготовку Wokwi", "打开 Wokwi 起始项目", "פתיחת פרויקט Wokwi"], "done": ["Red → green → yellow. 132 passes and 123 fails.", "Красный → зелёный → жёлтый. 132 верно, 123 неверно.", "红 → 绿 → 黄。132 正确，123 错误。", "אדום, ירוק, צהוב. 132 מתקבל ו־123 נכשל."], "project": "directMemory8", "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "starter": "from machine import Pin\nimport time\n\nrled = Pin(15, Pin.OUT)  # Red\nyled = Pin(13, Pin.OUT)  # Yellow\ngled = Pin(14, Pin.OUT)  # Green\n\nrled.value(1)     # Red on.\ntime.sleep(1)     # Keep it on for one second.\nrled.value(0)     # Red off.\ntime.sleep(1)     # Leave a dark gap.\n\n# Add green, then yellow, using the same four commands.\n\n# Add the guess and result here.\n", "code": "rled.value(1)     # Red is 1.\ntime.sleep(1)\nrled.value(0)\ntime.sleep(1)     # A dark gap after each light.\n\ngled.value(1)     # Green is 3.\ntime.sleep(1)\ngled.value(0)\ntime.sleep(1)\n\nyled.value(1)     # Yellow is 2.\ntime.sleep(1)\nyled.value(0)\ntime.sleep(1)\n\nanswer = input(\"Your three digits: \")  # Type in the terminal.\nif answer == \"132\":                    # Check the whole answer.\n    print(\"Correct!\")\nelse:\n    print(\"Try again!\")", "start": ["Use red, green and yellow to make a sequence for your partner to remember. Red is 1, yellow is 2 and green is 3.", "Сделай последовательность из красного, зелёного и жёлтого для напарника. Красный — 1, жёлтый — 2, зелёный — 3.", "用红、绿、黄灯做一个让同伴记住的顺序。红是 1，黄是 2，绿是 3。", "צרו רצף של אדום, ירוק וצהוב שבן הזוג יזכור. אדום הוא 1, צהוב 2 וירוק 3."], "learn": ["Turn each light on and off in order. Use input() and if to check a typed answer.", "Включай и выключай лампы по порядку. Проверь введённый ответ с input() и if.", "依次开灯和关灯。用 input() 和 if 检查输入的答案。", "הדליקו וכבו כל אור לפי הסדר. השתמשו ב־input() וב־if כדי לבדוק תשובה שהוקלדה."], "steps": [["Open the starter and press Run. Read the four red-light commands and watch one flash.", "Открой заготовку и нажми Run. Прочитай четыре команды красной лампы и посмотри вспышку.", "打开起始项目并点 Run。读红灯的四条命令，观察一次闪灯。", "פתחו את קוד ההתחלה ולחצו Run. קראו את ארבע הפקודות של האדום וצפו בהבהוב אחד."], ["Under the red commands, add the same four commands for green, then for yellow. Run and check all three.", "Под красным добавь такие же четыре команды для зелёного, затем для жёлтого. Запусти и проверь три вспышки.", "在红灯命令下面，为绿灯和黄灯各加同样四条命令。运行并检查三次闪灯。", "מתחת לפקודות האדום הוסיפו את אותן ארבע פקודות לירוק ואז לצהוב. הריצו ובדקו את שלושתן."], ["Below the last comment, add input() and check for \"132\". Show “Correct!” or “Try again!”.", "Под последним комментарием добавь input() и проверку \"132\". Выведи «Correct!» или «Try again!».", "在最后的注释下面加 input()，检查是否为“132”。显示“Correct!”或“Try again!”。", "מתחת להערה האחרונה הוסיפו input() ובדקו \"132\". הציגו “Correct!” או “Try again!”."], ["Run. Type 132 in the Wokwi terminal and press Enter. Restart and try 123.", "Запусти. Введи 132 в терминале Wokwi и нажми Enter. Перезапусти и попробуй 123.", "运行。在 Wokwi 终端输入 132 并按 Enter。重新运行，再试 123。", "הריצו. הקלידו 132 במסוף Wokwi ולחצו Enter. התחילו מחדש ונסו 123."]], "notes": [["On → wait → off → wait. The last wait leaves a dark gap.", "Включи → подожди → выключи → подожди. Последняя пауза разделяет вспышки.", "亮 → 等 → 灭 → 等。最后的等待让两次闪灯分开。", "הדלקה, המתנה, כיבוי, המתנה. ההמתנה האחרונה משאירה רווח חשוך."], ["Use gled for green and yled for yellow.", "Используй gled для зелёного и yled для жёлтого.", "绿灯用 gled，黄灯用 yled。", "השתמשו ב־gled לירוק וב־yled לצהוב."], ["input() stores text. Keep the quotes around \"132\".", "input() сохраняет текст. Оставь кавычки вокруг \"132\".", "input() 保存文本。“132”两边保留引号。", "input() שומר טקסט. השאירו את המירכאות סביב \"132\"."], ["The same digits in the wrong order should fail.", "Те же цифры в другом порядке должны дать ошибку.", "相同数字的错误顺序也应判错。", "אותן ספרות בסדר שונה צריכות להיכשל."]], "facts": ["Keep the imports and three Pin lines. Replace everything from the first rled.value(1) with this complete block.", "Оставь импорты и три строки Pin. Замени всё от первого rled.value(1) этим полным блоком.", "保留导入和三行 Pin 设置。从第一个 rled.value(1) 开始，用完整代码块替换。", "השאירו את הייבוא ואת שלוש שורות Pin. החליפו הכול מה־rled.value(1) הראשון בבלוק המלא הזה."]}, "extra": {"title": ["How fast can your partner follow?", "Как быстро напарник запомнит?", "你的同伴能跟上多快？", "כמה מהר בן הזוג יכול לעקוב?"], "start": ["Make a repeat-play game for your partner. Each correct guess starts a faster round. The first wrong guess ends the game.", "Сделай игру для напарника. Верный ответ запускает более быстрый раунд. Первая ошибка завершает игру.", "给同伴制作能连续玩的游戏。答对后自动加速下一轮，第一次答错就结束。", "צרו משחק חוזר לבן הזוג. כל תשובה נכונה מתחילה סיבוב מהיר יותר. הטעות הראשונה מסיימת את המשחק."], "learn": ["while playing repeats the indented round. Set playing to False to stop it.", "while playing повторяет раунд с отступом. playing = False останавливает игру.", "while playing 重复缩进的这一轮。把 playing 设为 False 就停止。", "while playing חוזר על הסיבוב המוזח. הגדירו playing ל־False כדי לעצור."], "done": ["A correct answer plays a faster round. A wrong answer prints Game over and the lights stay off.", "Верный ответ даёт быстрый раунд. Ошибка выводит Game over, и лампы остаются выключенными.", "答对进入更快一轮。答错显示 Game over，灯保持熄灭。", "תשובה נכונה מפעילה סיבוב מהיר יותר. טעות מציגה Game over והאורות נשארים כבויים."], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "code": "speed = 1             # Seconds each light stays on.\nplaying = True         # Start the game.\n\nwhile playing:         # Repeat a round while playing is True.\n    rled.value(1)       # Red, then green, then yellow.\n    time.sleep(speed)\n    rled.value(0)\n    time.sleep(speed)\n    gled.value(1)\n    time.sleep(speed)\n    gled.value(0)\n    time.sleep(speed)\n    yled.value(1)\n    time.sleep(speed)\n    yled.value(0)\n    time.sleep(speed)\n\n    answer = input(\"Your three digits: \")\n    if answer == \"132\":\n        print(\"Correct! Next round is faster.\")\n        speed = speed * 0.8  # A shorter wait next round.\n    else:\n        print(\"Game over\")\n        playing = False     # Stop after a wrong answer.", "steps": [["Keep your imports and Pin lines. Use Code help to replace the light sequence and guess check with the replay block.", "Оставь импорты и строки Pin. Замени вспышки и проверку ответа блоком из подсказки.", "保留导入和 Pin 设置。用代码提示中的重复游戏代码替换闪灯和答案判断。", "השאירו את הייבוא ואת שורות Pin. החליפו את רצף האורות ובדיקת התשובה בבלוק המשחק שבעזרה."], ["Trace one round. Find where the lights use speed and where a correct answer makes speed smaller.", "Проследи один раунд. Найди ожидания speed и строку, которая уменьшает speed после верного ответа.", "读一轮代码，找到使用 speed 的等待，以及答对后减小 speed 的那一行。", "עקבו אחרי סיבוב אחד. מצאו את ההמתנות עם speed ואת השורה שמקטינה אותו אחרי תשובה נכונה."], ["Run with your partner. Enter 132 twice, then 123. Check that the lights speed up and stop after the mistake.", "Сыграй с напарником. Введи 132 дважды, затем 123. Проверь ускорение и остановку после ошибки.", "和同伴运行。输入两次 132，再输入 123。检查灯光加快，并在错误后停止。", "הריצו עם בן הזוג. הקלידו 132 פעמיים ואז 123. בדקו שההבהובים מואצים ושהמשחק נעצר אחרי הטעות."]], "notes": [["playing starts as True. That lets the first round run.", "playing начинается с True. Это запускает первый раунд.", "playing 初始为 True，让第一轮开始。", "playing מתחיל כ־True. כך הסיבוב הראשון יכול להתחיל."], ["speed * 0.8 means the next wait is 80% as long.", "speed * 0.8 даёт ожидание в 80% прежнего времени.", "speed * 0.8 表示下一次等待是之前的 80%。", "speed * 0.8 אומר שההמתנה הבאה היא 80% מהקודמת."], ["The guesses stay in the terminal. Click there to type each answer.", "Ответы вводятся в терминале. Нажми на него для следующего ответа.", "每轮都在终端输入答案。点击终端后再输入。", "ממשיכים להקליד במסוף. לחצו בו כדי לכתוב כל תשובה."]], "facts": ["Keep the imports and Pin lines. Replace everything from the first rled.value(1) onwards. Use four spaces inside while.", "Оставь импорты и строки Pin. Замени всё от первого rled.value(1). Внутри while — отступ в четыре пробела.", "保留导入和 Pin 设置。从第一个 rled.value(1) 开始替换。while 内缩进四个空格。", "השאירו את הייבוא ואת שורות Pin. החליפו הכול מה־rled.value(1) הראשון. הזיחו ארבעה רווחים בתוך while."], "project": "directMemory8", "open": ["Open Wokwi starter", "Открыть заготовку Wokwi", "打开 Wokwi 起始项目", "פתיחת פרויקט Wokwi"], "bonus": {"title": ["Beat your score", "Побей свой рекорд", "挑战你的得分", "שברו את השיא"], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "start": ["Keep the faster-round game. Give the player one point for each correct guess and show the final score when they lose.", "Сохрани быстрые раунды. Дай игроку очко за верный ответ и покажи итог после ошибки.", "继续使用加速游戏。每答对一次加一分，输掉时显示最终得分。", "השאירו את המשחק המואץ. תנו נקודה לכל תשובה נכונה והציגו ניקוד סופי בהפסד."], "learn": ["A score variable keeps the number of correct answers.", "Переменная score хранит число верных ответов.", "变量 score 保存答对次数。", "המשתנה score שומר את מספר התשובות הנכונות."], "steps": [["Before while, set score = 0 so a new game starts at zero.", "Перед while напиши score = 0 для новой игры.", "在 while 前设置 score = 0，让新游戏从零分开始。", "לפני while כתבו score = 0 כדי להתחיל משחק חדש מאפס."], ["Inside the correct-answer branch, add score = score + 1 and print it. In else, print the final score.", "При верном ответе добавь score = score + 1 и выведи его. В else выведи итог.", "在答对的分支中加 score = score + 1 并显示分数。在 else 中显示最终得分。", "בענף התשובה הנכונה הוסיפו score = score + 1 והדפיסו אותו. בתוך else הדפיסו ניקוד סופי."], ["Try two correct answers, then a wrong one. Your final score should be 2. Restart and check that it starts at zero.", "Дай два верных ответа и один неверный. Итог должен быть 2. Перезапусти и проверь начало с нуля.", "先答对两次，再答错一次。最终应为 2 分。重启后检查是否从零开始。", "ענו נכון פעמיים ואז טעו. הניקוד הסופי צריך להיות 2. התחילו מחדש ובדקו שהניקוד מתחיל מאפס."]], "notes": [["Keep score = 0 outside the repeating round.", "Оставь score = 0 вне раунда.", "score = 0 放在重复的一轮外面。", "השאירו score = 0 מחוץ לסיבוב החוזר."], ["Only correct answers earn a point.", "Очко даётся только за верный ответ.", "只有答对才加分。", "רק תשובה נכונה מקבלת נקודה."], ["A wrong answer must leave the score unchanged.", "Ошибка не меняет счёт.", "答错时分数不变。", "תשובה שגויה משאירה את הניקוד כפי שהוא."]], "facts": ["Keep imports and Pin lines. Replace the whole replay block, starting at speed = 1, with this version.", "Оставь импорты и строки Pin. Замени блок от speed = 1 этой версией.", "保留导入和 Pin 设置。从 speed = 1 开始，用这一版替换整个重复游戏代码块。", "השאירו את הייבוא ואת שורות Pin. החליפו את כל בלוק המשחק, החל מ־speed = 1, בגרסה הזאת."], "code": "speed = 1             # Seconds each light stays on.\nplaying = True         # Start the game.\nscore = 0              # Begin with zero points.\n\nwhile playing:         # Repeat a round while playing is Tru
