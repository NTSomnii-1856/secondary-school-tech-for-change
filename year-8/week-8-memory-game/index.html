  <script>window.FOCUSED_LESSON = {"lesson": {"year": 8, "lesson": 8, "platform": ["Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico"], "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-8-memory-game/", "main": {"open": ["Open Wokwi starter", "Открыть заготовку Wokwi", "打开 Wokwi 起始项目", "פתיחת פרויקט Wokwi"], "done": ["Red → green → yellow. 132 passes and 123 fails.", "Красный → зелёный → жёлтый. 132 верно, 123 неверно.", "红 → 绿 → 黄。132 正确，123 错误。", "אדום, ירוק, צהוב. 132 מתקבל ו־123 נכשל."], "project": "directMemory8", "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "starter": "from machine import Pin\nimport time\n\nrled = Pin(15, Pin.OUT)  # Red\nyled = Pin(13, Pin.OUT)  # Yellow\ngled = Pin(14, Pin.OUT)  # Green\n\nrled.value(1)     # Red on.\ntime.sleep(1)     # Keep it on for one second.\nrled.value(0)     # Red off.\ntime.sleep(1)     # Leave a dark gap.\n\n# Add green, then yellow, using the same four commands.\n\n# Add the guess and result here.\n", "code": "rled.value(1)     # Red is 1.\ntime.sleep(1)\nrled.value(0)\ntime.sleep(1)     # A dark gap after each light.\n\ngled.value(1)     # Green is 3.\ntime.sleep(1)\ngled.value(0)\ntime.sleep(1)\n\nyled.value(1)     # Yellow is 2.\ntime.sleep(1)\nyled.value(0)\ntime.sleep(1)\n\nanswer = input(\"Your three digits: \")  # Type in the terminal.\nif answer == \"132\":                    # Check the whole answer.\n    print(\"Correct!\")\nelse:\n    print(\"Try again!\")", "start": ["Use red, green and yellow to make a sequence for your partner to remember. Red is 1, yellow is 2 and green is 3.", "Сделай последовательность из красного, зелёного и жёлтого для напарника. Красный — 1, жёлтый — 2, зелёный — 3.", "用红、绿、黄灯做一个让同伴记住的顺序。红是 1，黄是 2，绿是 3。", "צרו רצף של אדום, ירוק וצהוב שבן הזוג יזכור. אדום הוא 1, צהוב 2 וירוק 3."], "learn": ["Turn each light on and off in order. Use input() and if to check a typed answer.", "Включай и выключай лампы по порядку. Проверь введённый ответ с input() и if.", "依次开灯和关灯。用 input() 和 if 检查输入的答案。", "הדליקו וכבו כל אור לפי הסדר. השתמשו ב־input() וב־if כדי לבדוק תשובה שהוקלדה."], "steps": [["Open the starter and press Run. Read the four red-light commands and watch one flash.", "Открой заготовку и нажми Run. Прочитай четыре команды красной лампы и посмотри вспышку.", "打开起始项目并点 Run。读红灯的四条命令，观察一次闪灯。", "פתחו את קוד ההתחלה ולחצו Run. קראו את ארבע הפקודות של האדום וצפו בהבהוב אחד."], ["Under the red commands, add the same four commands for green, then for yellow. Run and check all three.", "Под красным добавь такие же четыре команды для зелёного, затем для жёлтого. Запусти и проверь три вспышки.", "在红灯命令下面，为绿灯和黄灯各加同样四条命令。运行并检查三次闪灯。", "מתחת לפקודות האדום הוסיפו את אותן ארבע פקודות לירוק ואז לצהוב. הריצו ובדקו את שלושתן."], ["Below the last comment, add input() and check for \"132\". Show “Correct!” or “Try again!”.", "Под последним комментарием добавь input() и проверку \"132\". Выведи «Correct!» или «Try again!».", "在最后的注释下面加 input()，检查是否为“132”。显示“Correct!”或“Try again!”。", "מתחת להערה האחרונה הוסיפו input() ובדקו \"132\". הציגו “Correct!” או “Try again!”."], ["Run. Type 132 in the Wokwi terminal and press Enter. Restart and try 123.", "Запусти. Введи 132 в терминале Wokwi и нажми Enter. Перезапусти и попробуй 123.", "运行。在 Wokwi 终端输入 132 并按 Enter。重新运行，再试 123。", "הריצו. הקלידו 132 במסוף Wokwi ולחצו Enter. התחילו מחדש ונסו 123."]], "notes": [["On → wait → off → wait. The last wait leaves a dark gap.", "Включи → подожди → выключи → подожди. Последняя пауза разделяет вспышки.", "亮 → 等 → 灭 → 等。最后的等待让两次闪灯分开。", "הדלקה, המתנה, כיבוי, המתנה. ההמתנה האחרונה משאירה רווח חשוך."], ["Use gled for green and yled for yellow.", "Используй gled для зелёного и yled для жёлтого.", "绿灯用 gled，黄灯用 yled。", "השתמשו ב־gled לירוק וב־yled לצהוב."], ["input() stores text. Keep the quotes around \"132\".", "input() сохраняет текст. Оставь кавычки вокруг \"132\".", "input() 保存文本。“132”两边保留引号。", "input() שומר טקסט. השאירו את המירכאות סביב \"132\"."], ["The same digits in the wrong order should fail.", "Те же цифры в другом порядке должны дать ошибку.", "相同数字的错误顺序也应判错。", "אותן ספרות בסדר שונה צריכות להיכשל."]], "facts": ["Keep the imports and three Pin lines. Replace everything from the first rled.value(1) with this complete block.", "Оставь импорты и три строки Pin. Замени всё от первого rled.value(1) этим полным блоком.", "保留导入和三行 Pin 设置。从第一个 rled.value(1) 开始，用完整代码块替换。", "השאירו את הייבוא ואת שלוש שורות Pin. החליפו הכול מה־rled.value(1) הראשון בבלוק המלא הזה."]}, "extra": {"title": ["How fast can your partner follow?", "Как быстро напарник запомнит?", "你的同伴能跟上多快？", "כמה מהר בן הזוג יכול לעקוב?"], "start": ["Make a repeat-play game for your partner. Each correct guess starts a faster round. The first wrong guess ends the game.", "Сделай игру для напарника. Верный ответ запускает более быстрый раунд. Первая ошибка завершает игру.", "给同伴制作能连续玩的游戏。答对后自动加速下一轮，第一次答错就结束。", "צרו משחק חוזר לבן הזוג. כל תשובה נכונה מתחילה סיבוב מהיר יותר. הטעות הראשונה מסיימת את המשחק."], "learn": ["while playing repeats the indented round. Set playing to False to stop it.", "while playing повторяет раунд с отступом. playing = False останавливает игру.", "while playing 重复缩进的这一轮。把 playing 设为 False 就停止。", "while playing חוזר על הסיבוב המוזח. הגדירו playing ל־False כדי לעצור."], "done": ["A correct answer plays a faster round. A wrong answer prints Game over and the lights stay off.", "Верный ответ даёт быстрый раунд. Ошибка выводит Game over, и лампы остаются выключенными.", "答对进入更快一轮。答错显示 Game over，灯保持熄灭。", "תשובה נכונה מפעילה סיבוב מהיר יותר. טעות מציגה Game over והאורות נשארים כבויים."], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "code": "speed = 1             # Seconds each light stays on.\nplaying = True         # Start the game.\n\nwhile playing:         # Repeat a round while playing is True.\n    rled.value(1)       # Red, then green, then yellow.\n    time.sleep(speed)\n    rled.value(0)\n    time.sleep(speed)\n    gled.value(1)\n    time.sleep(speed)\n    gled.value(0)\n    time.sleep(speed)\n    yled.value(1)\n    time.sleep(speed)\n    yled.value(0)\n    time.sleep(speed)\n\n    answer = input(\"Your three digits: \")\n    if answer == \"132\":\n        print(\"Correct! Next round is faster.\")\n        speed = speed * 0.8  # A shorter wait next round.\n    else:\n        print(\"Game over\")\n        playing = False     # Stop after a wrong answer.", "steps": [["Keep your imports and Pin lines. Use Code help to replace the light sequence and guess check with the replay block.", "Оставь импорты и строки Pin. Замени вспышки и проверку ответа блоком из подсказки.", "保留导入和 Pin 设置。用代码提示中的重复游戏代码替换闪灯和答案判断。", "השאירו את הייבוא ואת שורות Pin. החליפו את רצף האורות ובדיקת התשובה בבלוק המשחק שבעזרה."], ["Trace one round. Find where the lights use speed and where a correct answer makes speed smaller.", "Проследи один раунд. Найди ожидания speed и строку, которая уменьшает speed после верного ответа.", "读一轮代码，找到使用 speed 的等待，以及答对后减小 speed 的那一行。", "עקבו אחרי סיבוב אחד. מצאו את ההמתנות עם speed ואת השורה שמקטינה אותו אחרי תשובה נכונה."], ["Run with your partner. Enter 132 twice, then 123. Check that the lights speed up and stop after the mistake.", "Сыграй с напарником. Введи 132 дважды, затем 123. Проверь ускорение и остановку после ошибки.", "和同伴运行。输入两次 132，再输入 123。检查灯光加快，并在错误后停止。", "הריצו עם בן הזוג. הקלידו 132 פעמיים ואז 123. בדקו שההבהובים מואצים ושהמשחק נעצר אחרי הטעות."]], "notes": [["playing starts as True. That lets the first round run.", "playing начинается с True. Это запускает первый раунд.", "playing 初始为 True，让第一轮开始。", "playing מתחיל כ־True. כך הסיבוב הראשון יכול להתחיל."], ["speed * 0.8 means the next wait is 80% as long.", "speed * 0.8 даёт ожидание в 80% прежнего времени.", "speed * 0.8 表示下一次等待是之前的 80%。", "speed * 0.8 אומר שההמתנה הבאה היא 80% מהקודמת."], ["The guesses stay in the terminal. Click there to type each answer.", "Ответы вводятся в терминале. Нажми на него для следующего ответа.", "每轮都在终端输入答案。点击终端后再输入。", "ממשיכים להקליד במסוף. לחצו בו כדי לכתוב כל תשובה."]], "facts": ["Keep the imports and Pin lines. Replace everything from the first rled.value(1) onwards. Use four spaces inside while.", "Оставь импорты и строки Pin. Замени всё от первого rled.value(1). Внутри while — отступ в четыре пробела.", "保留导入和 Pin 设置。从第一个 rled.value(1) 开始替换。while 内缩进四个空格。", "השאירו את הייבוא ואת שורות Pin. החליפו הכול מה־rled.value(1) הראשון. הזיחו ארבעה רווחים בתוך while."], "project": "directMemory8", "open": ["Open Wokwi starter", "Открыть заготовку Wokwi", "打开 Wokwi 起始项目", "פתיחת פרויקט Wokwi"], "bonus": {"title": ["Beat your score", "Побей свой рекорд", "挑战你的得分", "שברו את השיא"], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "start": ["Keep the faster-round game. Give the player one point for each correct guess and show the final score when they lose.", "Сохрани быстрые раунды. Дай игроку очко за верный ответ и покажи итог после ошибки.", "继续使用加速游戏。每答对一次加一分，输掉时显示最终得分。", "השאירו את המשחק המואץ. תנו נקודה לכל תשובה נכונה והציגו ניקוד סופי בהפסד."], "learn": ["A score variable keeps the number of correct answers.", "Переменная score хранит число верных ответов.", "变量 score 保存答对次数。", "המשתנה score שומר את מספר התשובות הנכונות."], "steps": [["Before while, set score = 0 so a new game starts at zero.", "Перед while напиши score = 0 для новой игры.", "在 while 前设置 score = 0，让新游戏从零分开始。", "לפני while כתבו score = 0 כדי להתחיל משחק חדש מאפס."], ["Inside the correct-answer branch, add score = score + 1 and print it. In else, print the final score.", "При верном ответе добавь score = score + 1 и выведи его. В else выведи итог.", "在答对的分支中加 score = score + 1 并显示分数。在 else 中显示最终得分。", "בענף התשובה הנכונה הוסיפו score = score + 1 והדפיסו אותו. בתוך else הדפיסו ניקוד סופי."], ["Try two correct answers, then a wrong one. Your final score should be 2. Restart and check that it starts at zero.", "Дай два верных ответа и один неверный. Итог должен быть 2. Перезапусти и проверь начало с нуля.", "先答对两次，再答错一次。最终应为 2 分。重启后检查是否从零开始。", "ענו נכון פעמיים ואז טעו. הניקוד הסופי צריך להיות 2. התחילו מחדש ובדקו שהניקוד מתחיל מאפס."]], "notes": [["Keep score = 0 outside the repeating round.", "Оставь score = 0 вне раунда.", "score = 0 放在重复的一轮外面。", "השאירו score = 0 מחוץ לסיבוב החוזר."], ["Only correct answers earn a point.", "Очко даётся только за верный ответ.", "只有答对才加分。", "רק תשובה נכונה מקבלת נקודה."], ["A wrong answer must leave the score unchanged.", "Ошибка не меняет счёт.", "答错时分数不变。", "תשובה שגויה משאירה את הניקוד כפי שהוא."]], "facts": ["Keep imports and Pin lines. Replace the whole replay block, starting at speed = 1, with this version.", "Оставь импорты и строки Pin. Замени блок от speed = 1 этой версией.", "保留导入和 Pin 设置。从 speed = 1 开始，用这一版替换整个重复游戏代码块。", "השאירו את הייבוא ואת שורות Pin. החליפו את כל בלוק המשחק, החל מ־speed = 1, בגרסה הזאת."], "code": "speed = 1             # Seconds each light stays on.\nplaying = True         # Start the game.\nscore = 0              # Begin with zero points.\n\nwhile playing:         # Repeat a round while playing is True.\n    rled.value(1)       # Red, then green, then yellow.\n    time.sleep(speed)\n    rled.value(0)\n    time.sleep(speed)\n    gled.value(1)\n    time.sleep(speed)\n    gled.value(0)\n    time.sleep(speed)\n    yled.value(1)\n    time.sleep(speed)\n    yled.value(0)\n    time.sleep(speed)\n\n    answer = input(\"Your three digits: \")\n    if answer == \"132\":\n        score = score + 1   # One point per correct answer.\n        print(\"Score:\", score)\n        speed = speed * 0.8  # A shorter wait next round.\n    else:\n        print(\"Game over. Final score:\", score)\n        playing = False     # Stop after a wrong answer.", "done": ["The final score equals the number of correct guesses. Restarting clears it.", "Итог равен числу верных ответов. Перезапуск очищает его.", "最终分数等于答对次数。重启后清零。", "הניקוד הסופי שווה למספר הניחושים הנכונים. התחלה מחדש מאפסת אותו."]}, "shuffle": {"title": ["Challenge 3 · Shuffle the lights", "Задание 3 · Перемешай огни", "挑战 3 · 打乱灯光顺序", "אתגר 3 · ערבבו את האורות"], "figure": {"file": "simpleGuess8.png", "caption": ["1 red GP15, 2 yellow GP13, 3 green GP14. Type your guess in the Wokwi terminal.", "1 красный GP15, 2 жёлтый GP13, 3 зелёный GP14. Введи ответ в терминале Wokwi.", "1 红 GP15，2 黄 GP13，3 绿 GP14。在 Wokwi 终端输入答案。", "1 אדום GP15, 2 צהוב GP13, 3 ירוק GP14. הקלידו את הניחוש במסוף Wokwi."]}, "printFigure": false, "start": ["Your partner knows 132 now. Make the game choose a random light order each round. Keep the faster rounds and the score.", "Напарник уже знает 132. Пусть игра выбирает случайный порядок в каждом раунде. Сохрани ускорение и очки.", "同伴已经记住 132 了。让游戏每轮随机选择灯光顺序，保留加速和计分。", "בן הזוג כבר מכיר את 132. גרמו למשחק לבחור סדר אקראי בכל סיבוב. השאירו את ההאצה ואת הניקוד."], "learn": ["Choose a pattern, flash its digits, then check the player’s answer against that pattern.", "Выбери последовательность, покажи её лампами и сравни с ответом игрока.", "选择一个顺序，按其中的数字闪灯，再检查玩家的答案是否相同。", "בחרו רצף, הבהבו לפי הספרות שלו ובדקו את תשובת השחקן מול הרצף שנבחר."], "steps": [["Open Code help. Replace your game from speed = 1 onwards with this version. Keep the imports and three Pin lines above it.", "Открой подсказку с кодом. Замени игру от speed = 1 этой версией. Оставь импорты и три строки Pin выше.", "打开代码提示。从 speed = 1 开始，用这一版替换游戏代码。保留前面的导入和三行 Pin 设置。", "פתחו את העזרה בקוד. החליפו את המשחק מ־speed = 1 והלאה בגרסה הזאת. השאירו מעליו את הייבוא ואת שלוש שורות Pin."], ["Find pattern = random.choice(...) inside while. It chooses one of the six orders at the start of every round.", "Найди pattern = random.choice(...) внутри while. В начале каждого раунда выбирается один из шести порядков.", "在 while 内找到 pattern = random.choice(...)。它在每轮开始时从六种顺序中选一种。", "מצאו pattern = random.choice(...) בתוך while. השורה בוחרת אחד מששת הסדרים בתחילת כל סיבוב."], ["Read the for loop. It takes one digit from pattern at a time and flashes that digit’s light.", "Проследи for colour in pattern:. Цикл читает по одной цифре и включает нужную лампу.", "读 for colour in pattern:。它逐个读取数字，并闪烁对应的灯。", "עקבו אחרי for colour in pattern:. הלולאה קוראת ספרה אחת בכל פעם ומהבהבת באור המתאים."], ["Play two rounds, then enter a wrong answer. Check that correct guesses add a point and make the next round faster.", "Сыграй два раунда, затем введи ошибку. Проверь: верные ответы дают очко и ускоряют следующий раунд.", "玩两轮，再故意答错。检查答对是否加一分，并让下一轮更快。", "שחקו שני סיבובים ואז הקלידו תשובה שגויה. בדקו שתשובות נכונות מוסיפות נקודה ומאיצות את הסיבוב הבא."]], "notes": [["The new import random line is included in Code help.", "Новая строка import random уже есть в подсказке.", "代码提示中已包含新的 import random 行。", "השורה החדשה import random כלולה בעזרה בקוד."], ["1 = red. 2 = yellow. 3 = green.", "1 — красный. 2 — жёлтый. 3 — зелёный.", "1 = 红。2 = 黄。3 = 绿。", "1 = אדום. 2 = צהוב. 3 = ירוק."], ["For \"132\", colour becomes \"1\", then \"3\", then \"2\".", "Для \"132\" colour получает \"1\", затем \"3\", затем \"2\".", "对于“132”，colour 依次变成“1”、“3”、“2”。", "ברצף \"132\", colour מקבל \"1\", אחר כך \"3\" ואז \"2\"."], ["A random choice can repeat an order. A wrong answer ends the game.", "Случайный выбор может повторить порядок. Ошибка завершает игру.", "随机选择可能重复上一轮顺序。答错就结束游戏。", "בחירה אקראית יכולה לחזור על סדר קודם. תשובה שגויה מסיימת את המשחק."]], "definitions": [{"command": "import random", "example": "", "meaning": ["Adds the tool for random choices.", "Подключает инструмент случайного выбора.", "添加随机选择工具。", "מוסיף את הכלי לבחירות אקראיות."]}, {"command": "random.choice()", "example": "", "meaning": ["Chooses one item from the list in brackets and saves it in pattern.", "Выбирает один элемент списка в скобках и сохраняет в pattern.", "从方括号中的列表选一项，保存到 pattern。", "בוחר פריט אחד מהרשימה שבסוגריים ושומר אותו ב־pattern."]}, {"command": "for colour in pattern:", "example": "", "meaning": ["You used for with range(). Here it reads each digit in the text instead.", "Раньше for работал с range(). Здесь он читает цифры текста по одной.", "以前你用 for 读取 range()。这里用它逐个读取文本中的数字。", "כבר השתמשתם ב־for עם range(). כאן הוא קורא כל ספרה בטקסט במקום זאת."]}, {"command": "answer == pattern", "example": "", "meaning": ["Checks the guess against this round’s pattern. pattern is a variable, so it has no quotes.", "Сравнивает ответ с текущим порядком. pattern — переменная, поэтому без кавычек.", "把答案与本轮顺序比较。pattern 是变量名，不加引号。", "בודק את התשובה מול רצף הסיבוב הזה. pattern הוא משתנה, לכן אין סביבו מירכאות."]}], "facts": ["Keep the imports and three Pin lines. Replace everything from speed = 1 onwards with this whole block, including import random.", "Оставь импорты и три строки Pin. Замени всё от speed = 1 полным блоком, включая import random.", "保留导入和三行 Pin 设置。从 speed = 1 开始，用整个代码块替换，包括 import random。", "השאירו את הייבוא ואת שלוש שורות Pin. החליפו הכול מ־speed = 1 בבלוק המלא, כולל import random."], "code": "import random          # Add random choices to the game.\n\nspeed = 1              # Start with one-second waits.\nplaying = True\nscore = 0\n\nwhile playing:\n    pattern = random.choice([\"123\", \"132\", \"213\", \"231\", \"312\", \"321\"])\n\n    for colour in pattern:  # Read one digit at a time.\n        if colour == \"1\":\n            rled.value(1)   # 1 means red.\n        elif colour == \"2\":\n            yled.value(1)   # 2 means yellow.\n        else:\n            gled.value(1)   # 3 means green.\n        time.sleep(speed)\n        rled.value(0)       # Turn all lights off.\n        yled.value(0)\n        gled.value(0)\n        time.sleep(speed)  # Leave a dark gap.\n\n    answer = input(\"Your three digits: \")\n    if answer == pattern:  # Match this round's chosen pattern.\n        score = score + 1\n        print(\"Score:\", score)\n        speed = speed * 0.8\n    else:\n        print(\"Game over. Final score:\", score)\n        playing = False", "done": ["Each round chooses an order and checks that same order. Correct = one point and faster lights. Wrong = game over and final score.", "Каждый раунд выбирает порядок и проверяет его. Верно — очко и ускорение. Ошибка — конец и итоговый счёт.", "每轮选择顺序，并检查这个顺序。答对加一分并加速。答错结束并显示最终得分。", "כל סיבוב בוחר סדר ובודק את אותו הסדר. תשובה נכונה: נקודה ואורות מהירים יותר. טעות: סיום וניקוד סופי."]}}, "title": ["Guess the light order", "Угадай порядок огней", "猜灯光顺序", "נחשו את רצף האורות"], "notebook": {"main": [{"command": ".value()", "example": "rled.value(1)\nrled.value(0)", "meaning": ["1 turns red on. 0 turns it off.", "1 включает красный, 0 выключает.", "1 开红灯，0 关红灯。", "1 מדליק אדום. 0 מכבה אותו."]}, {"command": "time.sleep()", "example": "time.sleep(1)", "meaning": ["Waits one second before the next line.", "Ждёт секунду до следующей строки.", "等待一秒再执行下一行。", "ממתינה שנייה לפני השורה הבאה."]}, {"command": "rled / gled / yled", "example": "rled = Pin(15, Pin.OUT)", "meaning": ["Names for red, green and yellow outputs. The starter sets the pins.", "Имена красного, зелёного и жёлтого выходов. Заготовка настраивает выводы.", "红、绿、黄输出的名字。起始项目已设置引脚。", "שמות לפלטי האדום, הירוק והצהוב. קוד ההתחלה מגדיר את הפינים."]}, {"command": "input()", "example": "answer = input(\"Your digits: \")", "meaning": ["Waits for Enter and saves the typed text in answer.", "Ждёт Enter и сохраняет текст в answer.", "等待 Enter，把输入文本保存到 answer。", "ממתינה ל־Enter ושומרת את הטקסט ב־answer."]}, {"command": "if / else and ==", "example": "if answer == \"132\":", "meaning": ["== checks a match. if runs for a match, else runs for a wrong answer.", "== проверяет совпадение. if — для верного ответа, else — для ошибки.", "== 检查相同。相同执行 if，答错执行 else。", "== בודק התאמה. if פועל בהתאמה, else פועל בטעות."]}, {"command": "print()", "example": "print(\"Correct!\")", "meaning": ["Shows a message in the terminal.", "Показывает сообщение в терминале.", "在终端显示消息。", "מציגה הודעה במסוף."]}], "extra": [{"command": "while playing:", "example": "playing = True\nwhile playing:", "meaning": ["Repeats the indented round while playing is True.", "Повторяет раунд с отступом, пока playing равно True.", "playing 为 True 时，重复缩进的一轮。", "חוזר על הסיבוב המוזח כל עוד playing הוא True."]}, {"command": "True / False", "example": "playing = False", "meaning": ["True keeps the game going. False stops the next round.", "True продолжает игру. False останавливает следующий раунд.", "True 继续游戏。False 阻止下一轮。", "True ממשיך את המשחק. False עוצר את הסיבוב הבא."]}, {"command": "speed", "example": "speed = speed * 0.8", "meaning": ["Makes the wait 20% shorter after a correct guess.", "Уменьшает ожидание на 20% после верного ответа.", "答对后把等待缩短 20%。", "מקצר את ההמתנה ב־20% אחרי תשובה נכונה."]}, {"command": "score", "example": "score = score + 1", "meaning": ["Adds one to the stored score.", "Добавляет один к сохранённому счёту.", "给保存的分数加一。", "מוסיף אחד לניקוד שנשמר."]}, {"command": "import random / random.choice()", "example": "import random\npattern = random.choice([\"123\", \"132\"])", "meaning": ["Chooses one pattern from the list. The full game lists all six possible orders.", "Выбирает порядок из списка. В полной игре есть все шесть вариантов.", "从列表中选一个顺序。完整游戏列出了全部六种顺序。", "בוחר רצף אחד מהרשימה. המשחק המלא כולל את כל ששת הסדרים האפשריים."]}, {"command": "for colour in pattern:", "example": "for colour in pattern:", "meaning": ["Reads one digit at a time. \"132\" gives \"1\", then \"3\", then \"2\".", "Читает по одной цифре. \"132\" даёт \"1\", затем \"3\", затем \"2\".", "一次读一个数字。“132”依次得到“1”、“3”、“2”。", "קורא ספרה אחת בכל פעם. \"132\" נותן \"1\", אחר כך \"3\" ואז \"2\"."]}, {"command": "if / elif / else", "example": "if colour == \"1\":\n    rled.value(1)\nelif colour == \"2\":\n    yled.value(1)\nelse:\n    gled.value(1)", "meaning": ["if checks red. elif means otherwise, check yellow. else handles green.", "if проверяет красный. elif — иначе проверь жёлтый. else — зелёный.", "if 检查红灯。elif 表示否则检查黄灯。else 处理绿灯。", "if בודק אדום. elif אומר: אחרת, בדוק צהוב. else מטפל בירוק."]}, {"command": "answer == pattern", "example": "if answer == pattern:", "meaning": ["Checks the guess against the chosen pattern, not fixed text such as \"132\".", "Сравнивает ответ с выбранным порядком, а не с постоянным \"132\".", "检查答案是否等于选中的顺序，而不是固定的“132”。", "בודק את התשובה מול הרצף שנבחר, ולא מול טקסט קבוע כמו \"132\"."]}]}}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"], "scoreChallenge": ["Score challenge", "Задание со счётом", "计分挑战", "אתגר ניקוד"], "shuffleChallenge": ["Challenge 3 · Random lights", "Задание 3 · Случайные огни", "挑战 3 · 随机灯光", "אתגר 3 · אורות אקראיים"]}, "links": {"directMemory8": "https://wokwi.com/projects/481152966023162881"}};</script>
