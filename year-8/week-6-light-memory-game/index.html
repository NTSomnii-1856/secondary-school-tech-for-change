  <script>window.FOCUSED_LESSON = {"lesson": {"year": 8, "lesson": 6, "platform": ["Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico", "Python · Wokwi Pico"], "title": ["One LED, then traffic lights", "Один светодиод, затем светофор", "先点亮一盏灯，再做信号灯", "נורית אחת, ואז רמזור"], "main": {"project": "traffic8", "open": ["Open in Wokwi", "Открыть в Wokwi", "在 Wokwi 中打开", "פתיחה ב-Wokwi"], "figure": {"file": "traffic8.png", "caption": ["Wokwi Pico starter. Green GP17, amber GP16, red GP15.", "Заготовка Pico в Wokwi. Зелёный GP17, жёлтый GP16, красный GP15.", "Wokwi Pico 起始项目。绿灯 GP17，黄灯 GP16，红灯 GP15。", "פרויקט ההתחלה ב-Wokwi Pico. ירוק GP17, צהוב GP16, אדום GP15."]}, "start": ["Open the Wokwi Pico starter. Work with the green light first.", "Открой заготовку Pico в Wokwi. Начни с зелёного.", "打开 Wokwi Pico 起始项目。先练习绿灯。", "פתחו את פרויקט ההתחלה ב-Wokwi Pico. התחילו באור הירוק."], "learn": ["Tell the board which pin is an output, then turn the light on, wait and turn it off.", "Задай вывод как выход, затем включи лампу, подожди и выключи.", "先设定输出引脚，再开灯、等待、关灯。", "הגדירו פין כפלט, ואז הדליקו את האור, המתינו וכבו אותו."], "steps": [["Look at the diagram and find the green light and its pin.", "На схеме найди зелёную лампу и её вывод.", "看图找到绿灯及其引脚。", "מצאו בתרשים את האור הירוק ואת הפין שלו."], ["Add sleep(1) after green.off(). Run main.py and watch three flashes.", "Добавь sleep(1) после green.off(). Запусти main.py и посмотри три вспышки.", "在 green.off() 后加上 sleep(1)。运行 main.py，观察三次闪灯。", "הוסיפו sleep(1) אחרי green.off(). הריצו main.py וצפו בשלושה הבהובים."], ["Change the on time to 2 seconds. Run again and check the difference.", "Измени время работы на 2 секунды. Запусти снова и проверь разницу.", "把亮灯时间改成 2 秒。再运行，检查变化。", "שנו את זמן ההדלקה לשתי שניות. הריצו שוב ובדקו מה השתנה."]], "notes": [["One pin controls one LED.", "Один вывод управляет одним светодиодом.", "一个引脚控制一盏 LED。", "פין אחד שולט בנורית אחת."], ["The wait sits between the on and off commands.", "Ожидание стоит между включением и выключением.", "等待命令放在开灯和关灯之间。", "ההמתנה נמצאת בין פקודות ההדלקה והכיבוי."], ["The number you change controls how long the light is on.", "Число задаёт, сколько времени горит лампа.", "这个数字决定灯亮多久。", "המספר קובע כמה זמן האור דולק."]], "done": ["Green lights up for 2 seconds, then goes off.", "Зелёный горит 2 секунды и гаснет.", "绿灯亮 2 秒，然后熄灭。", "הירוק דולק שתי שניות ואז כבה."], "facts": ["In the Wokwi starter, replace the contents of main.py with this full example.", "В заготовке Wokwi замени содержимое main.py этим полным примером.", "在 Wokwi 起始项目中，用完整示例替换 main.py 的内容。", "בפרויקט ההתחלה ב-Wokwi החליפו את כל main.py בדוגמה הזו."], "code": "from machine import Pin\nfrom time import sleep\n\ngreen = Pin(17, Pin.OUT)     # GP17 controls green.\n\nfor cycle in range(0, 3):    # Flash three times.\n    green.on()\n    sleep(2)                 # Keep green on for 2 seconds.\n    green.off()\n    sleep(1)                 # Leave a gap between flashes."}, "extra": {"start": ["Keep your working green light. Use the diagram to add amber and red.", "Оставь рабочий зелёный. Добавь жёлтый и красный по схеме.", "保留能工作的绿灯，按图加入黄灯和红灯。", "שמרו את האור הירוק שעובד. הוסיפו צהוב ואדום לפי התרשים."], "learn": ["Make each light turn on, wait, then turn off before the next one starts.", "Включи лампу, подожди и выключи её перед включением следующей.", "让每盏灯依次亮起、等待、熄灭，再开启下一盏。", "הדליקו כל אור, המתינו, וכבו אותו לפני שהאור הבא נדלק."], "project": "traffic8", "open": ["Open traffic-light starter", "Открыть заготовку светофора", "打开信号灯起始项目", "פתיחת פרויקט הרמזור"], "steps": [["Run your project. Get green working for 3 seconds.", "Запусти проект. Добейся, чтобы зелёный горел 3 секунды.", "运行项目，让绿灯亮 3 秒。", "הריצו את הפרויקט. גרמו לאור הירוק לדלוק 3 שניות."], ["After green turns off, add amber for 1 second, then red for 1 second.", "После зелёного добавь жёлтый на 1 секунду, затем красный на 1 секунду.", "绿灯熄灭后，加上亮 1 秒的黄灯，再加上亮 1 秒的红灯。", "אחרי שהירוק כבה, הוסיפו אור צהוב לשנייה ואז אדום לשנייה."], ["Run it again. Watch one full cycle.", "Запусти снова и посмотри один полный цикл.", "再运行一次，观察一个完整循环。", "הריצו שוב וצפו במחזור אחד שלם."]], "done": ["Green → amber → red. Only one light is on at a time.", "Зелёный → жёлтый → красный. Одновременно горит только одна лампа.", "绿灯 → 黄灯 → 红灯。每次只亮一盏灯。", "ירוק ← צהוב ← אדום. בכל רגע דולק אור אחד בלבד."], "facts": ["In the Wokwi starter, replace the contents of main.py with this full example.", "В заготовке Wokwi замени содержимое main.py этим полным примером.", "在 Wokwi 起始项目中，用完整示例替换 main.py 的内容。", "בפרויקט ההתחלה ב-Wokwi החליפו את כל main.py בדוגמה הזו."], "code": "from machine import Pin\nfrom time import sleep\n\ngreen = Pin(17, Pin.OUT)\namber = Pin(16, Pin.OUT)\nred = Pin(15, Pin.OUT)\n\nfor cycle in range(0, 3):    # Run the cycle three times.\n    green.on()               # Green for 3 seconds.\n    sleep(3)\n    green.off()              # Turn it off before amber.\n    amber.on()               # Amber for 1 second.\n    sleep(1)\n    amber.off()\n    red.on()                 # Red for 1 second.\n    sleep(1)\n    red.off()", "notes": [["Begin with one working light. The wait gives you time to see it.", "Начни с одной рабочей лампы. Пауза позволяет увидеть её.", "从一盏能工作的灯开始。等待让你看清它。", "התחילו באור אחד שעובד. ההמתנה מאפשרת לראות אותו."], ["Use the same on, wait, off pattern for each colour.", "Для каждого цвета повтори «включи, подожди, выключи».", "每种颜色都使用相同的“亮、等、灭”顺序。", "השתמשו באותו סדר לכל צבע: הדלקה, המתנה, כיבוי."], ["If two lights stay on, check the off command for the first one.", "Если горят две лампы, проверь выключение первой.", "如果两盏灯同时亮着，检查第一盏的关闭命令。", "אם שני אורות נשארים דולקים, בדקו את פקודת הכיבוי של הראשון."]], "figure": {"file": "traffic8.png", "caption": ["Wokwi Pico starter. Green GP17, amber GP16, red GP15.", "Заготовка Pico в Wokwi. Зелёный GP17, жёлтый GP16, красный GP15.", "Wokwi Pico 起始项目。绿灯 GP17，黄灯 GP16，红灯 GP15。", "פרויקט ההתחלה ב-Wokwi Pico. ירוק GP17, צהוב GP16, אדום GP15."]}, "title": ["Finish your traffic lights", "Закончи светофор", "完成交通信号灯", "השלימו את הרמזור"]}, "notebook": {"main": [{"command": "Pin()", "example": "green = Pin(17, Pin.OUT)", "meaning": ["Sets up GP17 as an output and calls it green.", "Настраивает GP17 как выход с именем green.", "将 GP17 设为输出，并命名为 green。", "מגדירה את GP17 כפלט בשם green."]}, {"command": ".on() / .off()", "example": "green.on()\ngreen.off()", "meaning": ["Turns the named light on or off.", "Включает или выключает указанную лампу.", "打开或关闭指定的灯。", "מדליקות או מכבות את האור שבחרתם."]}, {"command": "sleep()", "example": "sleep(1)", "meaning": ["Waits in seconds. sleep(1) waits one second.", "Ждёт в секундах. sleep(1) ждёт секунду.", "按秒等待。sleep(1) 等待 1 秒。", "ממתינה בשניות. sleep(1) ממתינה שנייה אחת."]}, {"command": "for … in range()", "example": "for cycle in range(0, 3):", "meaning": ["Runs the indented lines three times. cycle is 0, 1, then 2.", "Повторяет строки с отступом трижды. cycle равен 0, 1, затем 2.", "缩进的代码执行三次。cycle 依次为 0、1、2。", "מריצה את השורות המוזחות שלוש פעמים. cycle מקבל 0, 1 ואז 2."]}], "extra": []}, "url": "https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-6-light-memory-game/"}, "ui": {"main": ["Main task", "Основное задание", "主要任务", "משימה עיקרית"], "challenge": ["Extra challenge", "Дополнительное задание", "额外挑战", "אתגר נוסף"], "copy": ["Copy code", "Скопировать код", "复制代码", "העתקת קוד"], "copied": ["Code copied", "Код скопирован", "代码已复制", "הקוד הועתק"], "copyFail": ["Select the code and copy it.", "Выдели и скопируй код.", "选中代码后复制。", "בחרו את הקוד והעתיקו אותו."], "show": ["You’re done when", "Готово, если", "完成标准", "סיימתם כאשר"], "help": ["Code help", "Подсказка по коду", "代码提示", "עזרה בקוד"], "learn": ["What you’re learning", "Чему ты учишься", "学习目标", "מה לומדים"], "extraLink": ["Open the extra challenge", "Открыть дополнительное задание", "打开额外挑战", "פתיחת האתגר הנוסף"], "back": ["Back to the main task", "Назад к основному заданию", "返回主要任务", "חזרה למשימה העיקרית"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ-PDF"], "starter": ["Starter code", "Стартовый код", "起始代码", "קוד התחלה"], "starterOnline": ["Copy the starter from the lesson page", "Скопируй заготовку на странице урока", "到课程页面复制起始代码", "העתיקו את קוד ההתחלה מדף השיעור"], "online": ["Open the lesson online", "Открыть урок онлайн", "打开在线课程", "פתיחת השיעור באתר"], "notebook": ["Code Notebook", "Справочник по коду", "代码笔记", "מחברת קוד"], "notebookExtra": ["For the challenge", "Для дополнительного задания", "挑战用法", "לאתגר הנוסף"]}, "links": {"traffic8": "https://wokwi.com/projects/480513819835355137"}};</script>
