<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 Lesson 10 · A case for your memory game</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122-clear"><script>window.GAME_LESSON={"year":8,"week":10,"title":["A case for your memory game","Корпус для игры памяти","记忆游戏外壳","מארז למשחק הזיכרון"],"platform":"Tinkercad · 3D Design","context":["Design a three-button game case","Создай корпус игры с тремя кнопками","设计三按钮游戏外壳","תכננו מארז למשחק עם שלושה כפתורים"],"brief":["Start a new design. Make a hollow body, a separate lid and openings for three buttons, three LEDs and a USB cable.","Начни новый проект. Сделай полый корпус, отдельную крышку и отверстия для трёх кнопок, трёх светодиодов и USB-кабеля.","新建设计。制作中空盒体、独立盖子，以及三个按钮、三盏 LED 和 USB 线的开孔。","פתחו עיצוב חדש. בנו גוף חלול, מכסה נפרד ופתחים לשלושה כפתורים, לשלוש נוריות ולכבל USB."],"objectives":[["Make a case with space for the board, controls and cable.","Сделай корпус с местом для платы, кнопок и кабеля.","制作能容纳电路板、控制部件和线缆的外壳。","בנו מארז עם מקום ללוח, לפקדים ולכבל."]],"launch":{"url":"https://www.tinkercad.com/3d-design","label":["Open Tinkercad 3D Design","Открыть Tinkercad 3D Design","打开 Tinkercad 3D Design","פתחו Tinkercad 3D Design"]},"figure":"../../game-studio/diagrams/case-8.svg","figureCaption":["The finished model has a hollow body and a separate lid.","Готовая модель имеет полый корпус и отдельную крышку.","完成的模型有中空盒体和独立盖子。","לדגם המוגמר יש גוף חלול ומכסה נפרד."],"setup":[["Sign in to your school Tinkercad account. Choose Create → 3D Design.","Войди в школьный аккаунт Tinkercad. Выбери Create → 3D Design.","登录学校的 Tinkercad 账户。选择 Create → 3D Design。","היכנסו לחשבון Tinkercad של בית הספר. בחרו Create → 3D Design."],["Name the design Memory game case. Use millimetres for every measurement.","Назови проект Memory game case. Все размеры вводи в миллиметрах.","将设计命名为 Memory game case。所有尺寸均使用毫米。","תנו לעיצוב את השם Memory game case. השתמשו במילימטרים לכל המידות."]],"cards":{"box":{"title":"Box / dimensions","meaning":["Drag Box from Basic Shapes. Click a size number to change it. X is width, Y is depth and Z is height.","Перетащи Box из Basic Shapes. Нажми число размера для изменения. X — ширина, Y — глубина, Z — высота.","从 Basic Shapes 拖出 Box。点击尺寸数字进行修改。X 是宽，Y 是深，Z 是高。","גררו Box מתוך Basic Shapes. לחצו על מספר מידה כדי לשנותו. X הוא רוחב, Y עומק ו־Z גובה."],"example":"X size 100 mm\nY size 70 mm\nZ size 30 mm"},"ruler":{"title":"Ruler / position","meaning":["Place Ruler at a workplane corner. Select Endpoint. X and Y locate the bottom corner. Lift sets its height above the workplane.","Поставь Ruler в угол плоскости. Выбери Endpoint. X и Y задают положение нижнего угла. Lift — его высота над плоскостью.","把 Ruler 放在工作平面一角。选择 Endpoint。X、Y 定位底部角点。Lift 是底部离平面的高度。","הניחו Ruler בפינת משטח העבודה. בחרו Endpoint. X ו־Y ממקמים את הפינה התחתונה. Lift קובע את גובהה מעל המשטח."],"example":"Size = X × Y × Z\nPosition = X, Y, Lift"},"hole":{"title":"Hole","meaning":["Select a shape, then choose Hole. Group it with a solid to cut material away.","Выбери фигуру, затем Hole. Сгруппируй с твёрдой фигурой, чтобы вырезать материал.","选中形状，再选 Hole。与实体分组后，就会切除材料。","בחרו צורה ואז Hole. קבצו אותה עם גוף מלא כדי לחתוך חומר."],"example":"Select shape → Hole"},"group":{"title":"Group","meaning":["Hold Shift to select the body and cutter. Click Group or press Ctrl+G. Press Ctrl+Z to undo a mistake.","Удерживай Shift и выбери корпус с резаком. Нажми Group или Ctrl+G. Ctrl+Z отменяет ошибку.","按住 Shift 选择盒体和切割体。点击 Group 或按 Ctrl+G。按 Ctrl+Z 撤销错误。","החזיקו Shift לבחירת הגוף והחותך. לחצו Group או Ctrl+G. לחצו Ctrl+Z לביטול טעות."],"example":"Select both → Group"},"lid":{"title":"Separate lid","meaning":["The lid is a second solid Box, 100 × 70 × 3 mm. Keep it beside the body so you can select it on its own.","Крышка — второй твёрдый Box, 100 × 70 × 3 мм. Оставь её рядом с корпусом для отдельного выбора.","盖子是第二个实体 Box，尺寸为 100 × 70 × 3 mm。把它留在盒体旁，便于单独选中。","המכסה הוא Box מלא נוסף בגודל 100 × 70 × 3 מ״מ. השאירו אותו לצד הגוף כדי לבחור בו בנפרד."],"example":"Lid: 100 × 70 × 3 mm\nX position 120\nY position 0\nLift 0"},"cylinder":{"title":"Cylinder Hole","meaning":["Use Cylinder and select Hole. A 5 mm high cutter passes through the 3 mm lid. Group the lid with its round cutters.","Выбери Cylinder, затем Hole. Резак высотой 5 мм проходит через крышку 3 мм. Сгруппируй крышку с круглыми резаками.","使用 Cylinder 并选择 Hole。5 mm 高的切割体穿过 3 mm 盖子。将盖子与圆形切割体分组。","השתמשו ב־Cylinder ובחרו Hole. חותך בגובה 5 מ״מ עובר דרך המכסה שעוביו 3 מ״מ. קבצו את המכסה עם החותכים העגולים."],"example":"Cylinder → Hole\nButton trial hole: 12 × 12 × 5 mm\nLED trial hole: 6 × 6 × 5 mm"},"fit":{"title":"Fit allowance","meaning":["These are practice sizes. Before printing, measure the actual buttons, LEDs and board. Check the cable opening too.","Это учебные размеры. Перед печатью измерь настоящие кнопки, светодиоды и плату. Проверь и отверстие кабеля.","这些是练习尺寸。打印前，测量实际按钮、LED 和电路板，也检查线缆开口。","אלה מידות לתרגול. לפני הדפסה מדדו את הכפתורים, הנוריות והלוח האמיתיים. בדקו גם את פתח הכבל."],"example":""},"footprint":{"title":"Planning footprint","meaning":["Use a 55 × 25 × 15 mm Box to reserve space for the Pico. Keep space around it for wires.","Box размером 55 × 25 × 15 мм резервирует место под Pico. Оставь вокруг место для проводов.","用 55 × 25 × 15 mm 的 Box 为 Pico 预留空间。周围留出导线空间。","השתמשו ב־Box בגודל 55 × 25 × 15 מ״מ לשמירת מקום ל־Pico. השאירו סביבו מקום לחוטים."],"example":"Size 55 × 25 × 15 mm\nPosition 5, 5, 3 mm"}},"stages":[{"title":["Size the body","Задай размер корпуса","设置盒体尺寸","קבעו את מידות הגוף"],"learn":["Set the size of one Box.","Задай размер одного Box.","设置一个 Box 的尺寸。","קבעו את המידות של Box אחד."],"tasks":[["Drag Ruler to a workplane corner. Select Endpoint.","Перетащи Ruler в угол плоскости. Выбери Endpoint.","把 Ruler 拖到工作平面一角。选择 Endpoint。","גררו Ruler לפינת משטח העבודה. בחרו Endpoint."],["Drag a Box onto the workplane. Enter the Body row below.","Перетащи Box на плоскость. Введи строку Body ниже.","把 Box 拖到工作平面。输入下方 Body 行的数据。","גררו Box למשטח העבודה. הקלידו את שורת Body שלמטה."]],"concepts":["box","ruler"],"check":["Body is 100 × 70 × 30 mm. Lift is 0.","Корпус — 100 × 70 × 30 мм. Lift равен 0.","盒体为 100 × 70 × 30 mm。Lift 为 0。","הגוף בגודל 100 × 70 × 30 מ״מ. Lift הוא 0."],"snippet":"","place":"","figure":"../../game-studio/diagrams/case-8.svg","caption":["Target case. In this step, start with its solid body.","Целевой корпус. На этом шаге начни с цельного тела.","目标外壳。本步骤先制作实体盒身。","מארז היעד. בשלב הזה התחילו מהגוף המלא שלו."],"hint":["Click each size number to type a new value.","Нажми каждое число размера, чтобы ввести новое значение.","点击每个尺寸数字，输入新值。","לחצו על כל מספר מידה והקלידו ערך חדש."],"table":{"headers":[["Part","Деталь","部件","חלק"],["Size X × Y × Z (mm)","Размер X × Y × Z (мм)","尺寸 X × Y × Z（mm）","מידות X × Y × Z (מ״מ)"],["Position X, Y, Lift (mm)","Позиция X, Y, Lift (мм)","位置 X、Y、Lift（mm）","מיקום X, Y, Lift (מ״מ)"]],"rows":[["Body","100 × 70 × 30","0, 0, 0"]]}},{"title":["Hollow the body","Сделай корпус полым","挖空盒体","רוקנו את הגוף"],"learn":["Cut out the inside. Leave a floor and four walls.","Вырежи внутренность. Оставь дно и четыре стенки.","切除内部，保留底板和四面墙。","חתכו את החלק הפנימי. השאירו רצפה וארבעה קירות."],"tasks":[["Drag a second Box. Select Hole.","Перетащи второй Box. Выбери Hole.","拖出第二个 Box。选择 Hole。","גררו Box שני. בחרו Hole."],["Enter the Inner cutter row below.","Введи строку Inner cutter ниже.","输入下方 Inner cutter 行的数据。","הקלידו את שורת Inner cutter שלמטה."],["Hold Shift and select the body and cutter. Click Group. Look inside.","Удерживай Shift и выбери корпус с резаком. Нажми Group. Загляни внутрь.","按住 Shift，选中盒体和切割体。点击 Group。查看内部。","החזיקו Shift ובחרו את הגוף והחותך. לחצו Group. הביטו פנימה."]],"concepts":["hole","group"],"check":["The top is open. The floor and walls are 3 mm thick.","Верх открыт. Дно и стенки толщиной 3 мм.","顶部敞开。底板和墙壁厚 3 mm。","החלק העליון פתוח. עובי הרצפה והקירות הוא 3 מ״מ."],"snippet":"","place":"","figure":"../../game-studio/diagrams/hollow-8.svg","caption":null,"hint":["If the floor disappears, press Ctrl+Z. Set the cutter Lift to 3 and group again.","Если дно исчезло, нажми Ctrl+Z. Задай резаку Lift 3 и снова сгруппируй.","若底板消失，按 Ctrl+Z。将切割体的 Lift 设为 3，再次分组。","אם הרצפה נעלמת, לחצו Ctrl+Z. הגדירו לחותך Lift של 3 וקבצו שוב."],"table":{"headers":[["Part","Деталь","部件","חלק"],["Size X × Y × Z (mm)","Размер X × Y × Z (мм)","尺寸 X × Y × Z（mm）","מידות X × Y × Z (מ״מ)"],["Position X, Y, Lift (mm)","Позиция X, Y, Lift (мм)","位置 X、Y、Lift（mm）","מיקום X, Y, Lift (מ״מ)"]],"rows":[["Inner cutter","94 × 64 × 30","3, 3, 3"]]}},{"title":["Make the lid","Сделай крышку","制作盖子","בנו את המכסה"],"learn":["Make a lid beside the body.","Сделай крышку рядом с корпусом.","在盒体旁制作盖子。","בנו מכסה לצד הגוף."],"tasks":[["Drag a new solid Box beside the body. Enter the Lid row below.","Перетащи новый твёрдый Box рядом с корпусом. Введи строку Lid ниже.","把新的实体 Box 拖到盒体旁。输入下方 Lid 行的数据。","גררו Box מלא חדש לצד הגוף. הקלידו את שורת Lid שלמטה."],["Select the lid. Check that you can move it on its own.","Выбери крышку. Проверь, что она двигается отдельно.","选中盖子。检查它能单独移动。","בחרו במכסה. בדקו שאפשר להזיז אותו בנפרד."]],"concepts":["lid","ruler"],"check":["The lid is 100 × 70 × 3 mm and sits beside the body.","Крышка — 100 × 70 × 3 мм, рядом с корпусом.","盖子为 100 × 70 × 3 mm，位于盒体旁。","המכסה בגודל 100 × 70 × 3 מ״מ ונמצא לצד הגוף."],"snippet":"","place":"","figure":"../../game-studio/diagrams/lid-blank-8.svg","caption":null,"hint":["Keep the lid as its own part while cutting its holes.","Оставь крышку отдельной деталью при вырезании отверстий.","切孔时，保持盖子为独立部件。","השאירו את המכסה כחלק נפרד בזמן חיתוך החורים."],"table":{"headers":[["Part","Деталь","部件","חלק"],["Size X × Y × Z (mm)","Размер X × Y × Z (мм)","尺寸 X × Y × Z（mm）","מידות X × Y × Z (מ״מ)"],["Position X, Y, Lift (mm)","Позиция X, Y, Lift (мм)","位置 X、Y、Lift（mm）","מיקום X, Y, Lift (מ״מ)"]],"rows":[["Lid","100 × 70 × 3","120, 0, 0"]]}},{"title":["Cut the openings","Вырежи отверстия","切出开口","חתכו את הפתחים"],"learn":["Add holes for the buttons, lights and cable.","Добавь отверстия для кнопок, ламп и кабеля.","为按钮、灯和线缆开孔。","הוסיפו פתחים לכפתורים, לאורות ולכבל."],"tasks":[["Make a Cylinder Hole for each button and LED row. Enter one row at a time.","Создай Cylinder Hole для каждой строки кнопки и LED. Вводи по одной строке.","为每个按钮和 LED 行制作 Cylinder Hole。一次输入一行。","בנו Cylinder Hole לכל שורת כפתור ונורית. הקלידו שורה אחת בכל פעם."],["Select the lid and its six round cutters. Click Group.","Выбери крышку и шесть круглых резаков. Нажми Group.","选中盖子和六个圆形切割体。点击 Group。","בחרו את המכסה ואת ששת החותכים העגולים. לחצו Group."],["Make a Box Hole for the USB row. Group it with the body.","Сделай Box Hole по строке USB. Сгруппируй с корпусом.","按 USB 行制作 Box Hole。将它与盒体分组。","בנו Box Hole לפי שורת USB. קבצו אותו עם הגוף."]],"concepts":["cylinder","ruler","group"],"check":["Six holes pass through the lid. The cable opening passes through a side wall.","В крышке шесть сквозных отверстий. Отверстие кабеля проходит через боковую стенку.","六个孔贯穿盖子。线缆开口贯穿侧壁。","שישה חורים עוברים דרך המכסה. פתח הכבל עובר דרך הקיר הצדדי."],"snippet":"","place":"","figure":"../../game-studio/diagrams/lid-8.svg","caption":null,"hint":["If a hole stays solid, select its cutter and check Hole. Then group it with the correct part.","Если отверстия нет, выбери резак и проверь Hole. Затем сгруппируй с нужной деталью.","若没有形成孔，选中切割体并检查 Hole，再与对应部件分组。","אם חור נשאר מלא, בחרו בחותך ובדקו Hole. אחר כך קבצו אותו עם החלק המתאים."],"table":{"headers":[["Part","Деталь","部件","חלק"],["Size X × Y × Z (mm)","Размер X × Y × Z (мм)","尺寸 X × Y × Z（mm）","מידות X × Y × Z (מ״מ)"],["Position X, Y, Lift (mm)","Позиция X, Y, Lift (мм)","位置 X、Y、Lift（mm）","מיקום X, Y, Lift (מ״מ)"]],"rows":[[["Button 1","Кнопка 1","按钮 1","כפתור 1"],"12 × 12 × 5","134, 29, 0"],[["LED 1","LED
