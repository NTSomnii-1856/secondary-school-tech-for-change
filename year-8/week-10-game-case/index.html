<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 Week 10 · A case for your memory game</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122"><script>window.GAME_LESSON={"year": 8, "week": 10, "title": ["A case for your memory game", "Корпус для игры памяти", "记忆游戏外壳", "מארז למשחק הזיכרון"], "platform": "Tinkercad · 3D Design", "context": ["Turn your working circuit into a product prototype", "Преврати схему в прототип изделия", "把能工作的电路变成产品原型", "הפכו מעגל עובד לאב־טיפוס של מוצר"], "brief": ["Design a body and removable lid for your game. The controls belong on the case; the score stays on the computer. Use the supplied practice sizes today.", "Спроектируй корпус и съёмную крышку. Кнопки — на корпусе, счёт — на компьютере. Сегодня используй учебные размеры.", "为游戏设计盒体与可拆盖子。控制部件在外壳上，分数仍在电脑显示，今天使用提供的练习尺寸。", "תכננו גוף ומכסה נשלף למשחק. הפקדים על המארז והניקוד נשאר במחשב. השתמשו היום במידות התרגול שסופקו."], "objectives": [["Use dimensions, Hole and Group to make a hollow case.", "Сделать полый корпус с размерами, Hole и Group.", "用尺寸、Hole 和 Group 制作中空外壳。", "להשתמש במידות, Hole ו־Group ליצירת מארז חלול."], ["Leave space for the board, controls, wiring and USB cable.", "Оставить место для платы, кнопок, проводов и USB.", "为电路板、控制部件、导线和 USB 线留空间。", "להשאיר מקום ללוח, לפקדים, לחיווט ולכבל USB."], ["Improve the product after someone tries to understand it.", "Улучшить изделие после проверки другим человеком.", "根据他人的试用理解改进产品。", "לשפר את המוצר אחרי שמישהו מנסה להבין אותו."]], "launch": {"url": "https://www.tinkercad.com/3d-design", "label": ["Open Tinkercad 3D Design", "Открыть Tinkercad 3D Design", "打开 Tinkercad 3D Design", "פתחו Tinkercad 3D Design"]}, "figure": "../../game-studio/diagrams/case-8.svg", "figureCaption": ["Target model: hollow body, separate lid, controls and a cable opening. Use Box, Hole, Ruler and Group in Tinkercad.", "Целевая модель: полый корпус, отдельная крышка, управление и отверстие кабеля. Используй Box, Hole, Ruler и Group в Tinkercad.", "目标模型：中空盒体、独立盖子、控制部件和线缆开口。在 Tinkercad 中使用 Box、Hole、Ruler 和 Group。", "דגם היעד: גוף חלול, מכסה נפרד, פקדים ופתח לכבל. השתמשו ב־Box, Hole, Ruler ו־Group ב־Tinkercad."], "setup": [["Use your school Tinkercad account. Choose Create → 3D Design, not Circuits.", "Войди в школьный Tinkercad. Выбери Create → 3D Design, не Circuits.", "使用学校 Tinkercad 账户，选择 Create → 3D Design，而不是 Circuits。", "השתמשו בחשבון Tinkercad הבית ספרי. בחרו Create → 3D Design, לא Circuits."], ["Work in millimetres. Keep the body and lid separate until you test their fit.", "Работай в миллиметрах. Не объединяй корпус с крышкой до проверки.", "使用毫米，盒体与盖子保持独立，之后检查配合。", "עבדו במילימטרים. השאירו את הגוף והמכסה נפרדים עד בדיקת ההתאמה."], ["No printer or purchased parts are needed today. The practice holes are not a guarantee of fit for a real switch.", "Сегодня не нужны принтер и купленные детали. Учебные отверстия не гарантируют посадку настоящей кнопки.", "今天不需要打印机或购买零件。练习孔不代表一定适合真实开关。", "אין צורך היום במדפסת או בחלקים קנויים. חורי התרגול אינם מבטיחים התאמה למתג אמיתי."]], "cards": {"box": {"title": "Box / dimensions", "meaning": ["Drag Box from Basic Shapes. Click a size number to type it. X is width, Y is depth and Z is height. All our sizes are millimetres.", "Перетащи Box из Basic Shapes. Нажми число размера для ввода. X — ширина, Y — глубина, Z — высота. Все размеры в миллиметрах.", "从 Basic Shapes 拖出 Box，点击尺寸数字输入。X 是宽，Y 是深，Z 是高，本课都用毫米。", "גררו Box מתוך Basic Shapes. לחצו על מספר מידה והקלידו. X הוא רוחב, Y עומק ו־Z גובה. כל המידות שלנו במילימטרים."], "example": "X size 100 mm\nY size 70 mm\nZ size 30 mm"}, "ruler": {"title": "Ruler / position", "meaning": ["Drag Ruler onto a corner of the blue workplane. Keep it there. Use Endpoint mode so positions describe a shape’s lower corner. X and Y move the shape; Lift is how high its bottom sits.", "Помести Ruler в угол синей плоскости и оставь там. Используй Endpoint, чтобы позиция относилась к нижнему углу. X и Y двигают фигуру; Lift — высота её низа.", "把 Ruler 放在蓝色工作平面的一角并保留。使用 Endpoint 模式，让位置表示形状底部角点。X、Y 移动形状，Lift 是底部离平面的高度。", "גררו Ruler לפינת משטח העבודה הכחול והשאירו שם. השתמשו ב־Endpoint כדי שהמיקום יתייחס לפינה התחתונה. X ו־Y מזיזים את הצורה; Lift הוא גובה התחתית."], "example": "X position 0\nY position 0\nLift 0"}, "hole": {"title": "Hole", "meaning": ["A Hole is a cutter. It removes material only when grouped with a solid. Our inner cutter starts 3 mm above the workplane, leaving a 3 mm floor.", "Hole — резак. Удаляет материал только при группировке с твёрдой фигурой. Внутренний резак начинается на высоте 3 мм, оставляя дно 3 мм.", "Hole 是切割体，只有与实体分组才会减去材料。内部切割体从工作平面上方 3 mm 开始，留下 3 mm 底板。", "Hole הוא חותך. הוא מסיר חומר רק כשמקבצים אותו עם גוף מלא. החותך הפנימי מתחיל 3 מ״מ מעל המשטח ומשאיר רצפה של 3 מ״מ."], "example": "Select shape → Hole"}, "group": {"title": "Group", "meaning": ["Hold Shift to select the solid and its Hole. Click Group, or Ctrl+G. Do not include the separate lid when hollowing the body. Ctrl+Z undoes a mistake.", "Удержи Shift для выбора тела и Hole. Нажми Group или Ctrl+G. Не включай отдельную крышку при вырезании корпуса. Ctrl+Z отменяет ошибку.", "按住 Shift 选择实体与 Hole，点击 Group 或按 Ctrl+G。挖空盒体时不要选中旁边的盖子。Ctrl+Z 可撤销。", "החזיקו Shift לבחירת הגוף וה־Hole שלו. לחצו Group או Ctrl+G. אל תכללו את המכסה הנפרד בריקון הגוף. Ctrl+Z מבטל טעות."], "example": "Select both → Group"}, "align": {"title": "Align", "meaning": ["Align moves selected shapes into line. The middle dots centre them. It does not join shapes or make a cut; use Group for that.", "Align выравнивает выбранные фигуры. Средние точки центрируют. Он не соединяет и не режет — для этого Group.", "Align 对齐选中的形状，中间圆点用于居中。它不会连接或切割形状，那需要 Group。", "Align מיישר צורות נבחרות. הנקודות האמצעיות ממרכזות. הוא אינו מחבר או חותך; לכך משתמשים ב־Group."], "example": "Select two shapes → Align → middle dots"}, "lid": {"title": "Separate lid", "meaning": ["Keep the lid beside the body while modelling. It has the same outside width and depth, but is only 3 mm thick. Keep these as two separate parts.", "Строй крышку рядом с корпусом. Её внешние ширина и глубина те же, толщина 3 мм. Сохрани две отдельные детали.", "建模时把盖子放在盒体旁。它与盒体外宽、外深相同，但厚度只有 3 mm。保留为两个独立部件。", "בנו את המכסה לצד הגוף. הרוחב והעומק החיצוניים זהים, אך העובי הוא 3 מ״מ. השאירו שני חלקים נפרדים."], "example": "Lid: 100 × 70 × 3 mm\nX position 120\nY position 0\nLift 0"}, "cylinder": {"title": "Cylinder Hole", "meaning": ["A cylinder cuts a round opening. Set X and Y size to the same value. Make its height 5 mm so it goes right through a 3 mm lid.", "Цилиндр вырезает круглое отверстие. Размеры X и Y равны. Высота 5 мм проходит насквозь крышку 3 мм.", "圆柱可切出圆孔。X、Y 尺寸设为相同，切割体高 5 mm，能穿透 3 mm 盖子。", "גליל חותך פתח עגול. הגדירו X ו־Y זהים. גובה 5 מ״מ עובר דרך מכסה בעובי 3 מ״מ."], "example": "Cylinder → Hole\nButton trial hole: 12 × 12 × 5 mm\nLED trial hole: 6 × 6 × 5 mm"}, "fit": {"title": "Fit allowance", "meaning": ["A part needs space around it. Today’s button and LED holes are practice sizes. A real button’s body and cap may differ; measure the chosen parts before printing.", "Детали нужно место вокруг. Сегодняшние отверстия — учебные размеры. Корпус и шляпка настоящей кнопки могут отличаться; перед печатью измерь детали.", "零件周围需要余量。今天的按钮与 LED 孔是练习尺寸。真实按钮的主体和帽盖可能不同，打印前需测量选用零件。", "חלק צריך מרווח סביבו. חורי הכפתורים והנוריות היום הם מידות לתרגול. גוף וכיפת כפתור אמיתי עשויים להיות שונים; מדדו את החלקים שנבחרו לפני הדפסה."], "example": "Practice CAD ≠ verified physical fit"}, "footprint": {"title": "Planning footprint", "meaning": ["Use a 55 × 25 × 15 mm Box as a planning space for the Pico. It is not a detailed component model. Leave extra room for wires and controls.", "Используй Box 55 × 25 × 15 мм как место под Pico. Это не точная модель детали. Оставь место для проводов и органов управления.", "用 55 × 25 × 15 mm 的 Box 作为 Pico 规划空间，它不是精细零件模型。还要给导线和控制部件留空间。", "השתמשו ב־Box בגודל 55 × 25 × 15 מ״מ כמרחב תכנון עבור Pico. זה אינו דגם מפורט של הרכיב. השאירו מקום לחוטים ולפקדים."], "example": "Pico planning block: 55 × 25 × 15 mm"}, "text": {"title": "Text", "meaning": ["Drag Text from Basic Shapes. Change the word in its panel and set the height. Raised numbers let players identify controls without colour alone.", "Перетащи Text из Basic Shapes. Измени текст в панели и задай высоту. Выпуклые цифры обозначают кнопки не только цветом.", "从 Basic Shapes 拖出 Text，在面板修改文字并设置高度。凸起数字让玩家不只靠颜色识别控制。", "גררו Text מתוך Basic Shapes. שנו את המילה בלוח והגדירו גובה. מספרים בולטים מאפשרים לזהות פקדים בלי להסתמך רק על צבע."], "example": "Text → change text → height 1 mm"}}, "stages": [{"title": ["Set the body size", "Задай размер корпуса", "设置盒体尺寸", "הגדירו מידות גוף"], "learn": ["Start with one accurately sized Box.", "Начни с одного Box точного размера.", "从一个尺寸准确的 Box 开始。", "התחילו ב־Box אחד במידות מדויקות."], "tasks": [["Create a new 3D Design. Name it with your game title. Drag Ruler to a workplane corner and leave it there.", "Создай 3D Design и назови именем игры. Перетащи Ruler в угол плоскости и оставь там.", "新建 3D Design，以游戏名称命名。把 Ruler 放到工作平面一角并保留。", "צרו 3D Design חדש ותנו לו את שם המשחק. גררו Ruler לפינת המשטח והשאירו אותו שם."], ["Drag one Box. Type the Body sizes and positions from the table. Use Endpoint mode on the Ruler.", "Перетащи Box. Введи размеры и позиции Body из таблицы. Используй режим Endpoint у Ruler.", "拖出一个 Box，输入表中 Body 的尺寸与位置。Ruler 使用 Endpoint 模式。", "גררו Box אחד. הקלידו את מידות ומיקום Body מהטבלה. השתמשו במצב Endpoint בסרגל."]], "concepts": ["box", "ruler"], "check": ["The body is 100 × 70 × 30 mm and sits on the workplane.", "Корпус 100 × 70 × 30 мм стоит на плоскости.", "盒体为 100 × 70 × 30 mm，底部位于工作平面。", "הגוף הוא 100 × 70 × 30 מ״מ ויושב על המשטח."], "snippet": "", "place": "", "full": "", "figure": "../../game-studio/diagrams/case-8.svg", "caption": ["Target case. In this step, start with its solid body.", "Целевой корпус. На этом шаге начни с цельного тела.", "目标外壳。本步骤先制作实体盒身。", "מארז היעד. בשלב הזה התחילו מהגוף המלא שלו."], "hint": null, "table": {"headers": [["Part", "Деталь", "部件", "חלק"], "X size", "Y size", "Z size", "X position", "Y position", "Lift"], "rows": [["Body", "100", "70", "30", "0", "0", "0"]]}}, {"title": ["Hollow the body", "Вырежи внутренность", "挖空盒体", "רוקנו את הגוף"], "learn": ["Use a Hole to leave walls and a floor.", "Используй Hole, оставив стенки и дно.", "用 Hole 留下侧壁和底板。", "השתמשו ב־Hole כדי להשאיר קירות ורצפה."], "tasks": [["Drag a second Box and choose Hole. Enter the Inner cutter row below. Its bottom is 3 mm above the workplane.", "Добавь второй Box и выбери Hole. Введи строку Inner cutter. Его низ на высоте 3 мм.", "拖出第二个 Box，选 Hole，输入下表 Inner cutter 的数据。它的底部高于工作平面 3 mm。", "גררו Box שני ובחרו Hole. הקלידו את שורת Inner cutter. התחתית שלו 3 מ״מ מעל המשטח."], ["Hold Shift and select only the outer body and inner cutter. Click Group. Tilt the view to look inside.", "С Shift выбери только внешний корпус и внутренний резак. Нажми Group. Наклони вид и загляни внутрь.", "按住 Shift，只选外盒体与内切割体，点击 Group，倾斜视图查看内部。", "החזיקו Shift ובחרו רק את הגוף החיצוני והחותך הפנימי. לחצו Group. הטו את התצוגה והביטו פנימה."]], "concepts": ["hole", "group"], "check": ["The top is open. The floor and four walls are each 3 mm thick. If the bottom is missing, undo and check Lift = 3.", "Верх открыт. Дно и четыре стенки по 3 мм. Нет дна? Отмени и проверь Lift = 3.", "顶部敞开，底板与四壁均为 3 mm。底板消失时，撤销并检查 Lift = 3。", "החלק העליון פתוח. הרצפה וארבעת הקירות בעובי 3 מ״מ. אם הרצפה חסרה, בטלו ובדקו Lift = 3."], "snippet": "", "place": "", "full": "", "figure": "../../game-studio/diagrams/hollow-8.svg", "caption": null, "hint": null, "table": {"headers": [["Part", "Деталь", "部件", "חלק"], "X size", "Y size", "Z size", "X position", "Y position", "Lift"], "rows": [["Inner cutter", "94", "64", "30", "3", "3", "3"]]}}, {"title": ["Make a separate lid", "Сделай отдельную крышку", "制作独立盖子", "צרו מכסה נפרד"], "learn": ["Make a lid that covers the opening and can be removed.", "Сделай съёмную крышку для отверстия.", "制作能盖住开口、也能取下的盖子。", "צרו מכסה שמכסה את הפתח ואפשר להסיר."], "tasks": [["Drag a new solid Box beside the body. Enter the Lid row below. Do not group it with the body.", "Добавь новый твёрдый Box рядом. Введи строку Lid. Не группируй с корпусом.", "在盒体旁拖出新的实体 Box，输入 Lid 数据，不要与盒体分组。", "גררו Box מלא חדש לצד הגוף. הקלידו את שורת Lid. אל תקבצו עם הגוף."], ["Use the top view cube to compare the outside sizes. Keep the lid beside the body for the next step.", "Используй верхний вид куба для сравнения внешних размеров. Оставь крышку рядом для следующего шага.", "用视角立方体的顶视图比较外形尺寸。下一步仍把盖子留在盒体旁。", "השתמשו בתצוגת העל של קוביית התצוגה להשוואת המידות. השאירו את המכסה לצד הגוף לשלב הבא."]], "concepts": ["lid", "align"], "check": ["Body and lid have matching outside width and depth. You can select and move the lid on its own.", "Внешние ширина и глубина совпадают. Крышку можно выделить и двигать отдельно.", "盒体与盖子的外宽和外深相同，可以单独选中并移动盖子。", "הרוחב והעומק החיצוניים של הגוף והמכסה תואמים. אפשר לבחור ולהזיז את המכסה לבד."], "snippet": "", "place": "", "full": "", "figure": "../../game-studio/diagrams/lid-blank-8.svg", "caption": null, "hint": null, "table": {"headers": [["Part", "Деталь", "部件", "חלק"], "X size", "Y size", "Z size", "X position", "Y position", "Lift"], "rows": [["Lid", "100", "70", "3", "120", "0", "0"]]}}, {"title": ["Openings for the controls", "Отверстия для управления", "为控制部件开孔", "פתחים לפקדים"], "learn": ["Cut the button, LED and USB openings.", "Вырежи отверстия кнопок, LED и USB.", "切出按钮孔、LED 孔和 USB 开口。", "חתכו פתחי כפתורים, נוריות ו־USB."], "tasks": [["Use Cylinder Holes for the button and LED rows. Enter one row at a time. The size columns come before the position columns.", "Для кнопок и LED используй Cylinder Hole. Вводи по одной строке. Сначала размеры, затем позиции.", "按钮与 LED 使用 Cylinder Hole，一次输入一行。尺寸列在前，位置列在后。", "השתמשו ב־Cylinder Hole לשורות הכפתורים והנוריות. הקלידו שורה אחת בכל פעם. עמודות המידה באות לפני עמודות המיקום."], ["Select only the lid and its cylinder cutters. Group them. Keep the body separate.", "Выбери только крышку и её цилиндры. Сгруппируй. Корпус оставь отдельно.", "只选择盖子及其圆柱切割体并分组，保持盒体独立。", "בחרו רק את המכסה ואת חותכי הגליל שלו. קבצו אותם והשאירו את הגוף נפרד."], ["For USB, use a Box Hole with the USB row. Group that cutter with the body, not the lid.", "Для USB возьми Box Hole по строке USB. Сгруппируй с корпусом, не крышкой.", "USB 使用 Box Hole，按 USB 行设置，与盒体分组，不是盖子。", "ל־USB השתמשו ב־Box Hole לפי שורת USB. קבצו אותו עם הגוף, לא עם המכסה."]], "concepts": ["cylinder", "ruler", "group", "fit"], "check": ["You can see through every lid hole. The USB opening crosses a side wall. These are practice sizes for the prototype.", "Каждое отверстие крышки сквозное. USB проходит сквозь стенку. Размеры учебные, для прототипа.", "每个盖孔均贯穿，USB 开口穿过侧壁。这些是原型练习尺寸。", "אפשר לראות דרך כל חור במכסה. פתח ה־USB חוצה קיר צד. אלה מידות תרגול לאב־טיפוס."], "snippet": "", "place": "", "full": "", "figure": "../../game-studio/diagrams/lid-8.svg", "caption": null, "hint": null, "table": {"headers": [["Part", "Деталь", "部件", "חלק"], "X size", "Y size", "Z size", "X position", "Y position", "Lift"], "rows": [[["Button 1", "Кнопка 1", "按钮 1", "כפתור 1"], "12", "12", "5", "134", "29", "0"], [["LED 1", "LED 1", "LED 1", "נורית 1"], "6", "6", "5", "137", "52", "0"], [["Button 2", "Кнопка 2", "按钮 2", "כפתור 2"], "12", "12", "5", "164", "29", "0"], [["LED 2", "LED 2", "LED 2", "נורית 2"], "6", "6", "5", "167", "52", "0"], [["Button 3", "Кнопка 3", "按钮 3", "כפתור 3"], "12", "12", "5", "194", "29", "0"], [["LED 3", "LED 3", "LED 3", "נורית 3"], "6", "6", "5", "197", "52", "0"], ["USB", "5", "20", "12", "-1", "25", "5"]]}, "printFigure": false}, {"title": ["Check the product", "Проверь изделие", "检查产品", "בדקו את המוצר"], "learn": ["Make sure the case supports the game.", "Проверь, что корпус подходит игре.", "检查外壳是否支持游戏使用。", "בדקו שהמארז תומך במשחק."], "tasks": [["Add a temporary solid Box of 55 × 25 × 15 mm inside the body at X = 5, Y = 5, Lift = 3. This reserves planning space for the Pico.", "Добавь временный Box 55 × 25 × 15 мм внутри при X = 5, Y = 5, Lift = 3. Это место под Pico.", "在盒内添加临时实体 Box，尺寸 55 × 25 × 15 mm，X = 5、Y = 5、Lift = 3，为 Pico 预留规划空间。", "הוסיפו בתוך הגוף Box זמני בגודל 55 × 25 × 15 מ״מ במיקום X = 5, Y = 5, Lift = 3. זהו מרחב תכנון ל־Pico."], ["Keep the planning block separate. Check room for wires, the USB cable and the underside of each control.", "Не группируй временный блок. Проверь место для проводов, USB и нижней части кнопок.", "保持规划块独立，检查导线、USB 线与控制部件下方的空间。", "השאירו את בלוק התכנון נפרד. בדקו מקום לחוטים, כבל USB ולתחתית כל פקד."], ["Show a partner how to use the game. Point to the controls, cable route and removable lid. Keep the score on the computer’s Serial Monitor or terminal.", "Покажи напарнику игру. Укажи управление, путь кабеля и крышку. Счёт остаётся в Serial Monitor или терминале компьютера.", "向同伴演示游戏，指出控制部件、线缆路径和可拆盖子。分数仍显示在电脑 Serial Monitor 或终端上。", "הראו לבן זוג איך משתמשים במשחק. הצביעו על הפקדים, מסלול הכבל והמכסה הנשלף. הניקוד נשאר ב־Serial Monitor או במסוף המחשב."]], "concepts": ["footprint", "fit"], "check": ["The planning block fits and the controls are usable. Explain one change you made after the partner check. Measure actual parts before manufacturing.", "Временный блок помещается, управление доступно. Объясни изменение после проверки напарником. Перед изготовлением измерь реальные детали.", "规划块能放入，控制部件可操作。解释同伴检查后所做的一处修改，制造前测量实际零件。", "בלוק התכנון נכנס והפקדים שימושיים. הסבירו שינוי אחד שעשיתם אחרי בדיקת בן הזוג. מדדו חלקים אמיתיים לפני הייצור."], "snippet": "", "place": "", "full": "", "figure": "../../game-studio/diagrams/case-8.svg", "caption": null, "hint": null, "table": null}], "challenges": [{"title": ["Stop the lid sliding", "Останови сдвиг крышки", "防止盖子滑动", "מנעו מהמכסה להחליק"], "problem": ["A flat lid slides when the game is moved. Add a locating lip underneath so the lid centres itself but still lifts off.", "Плоская крышка сдвигается при переноске. Добавь нижний бортик: крышка центрируется и снимается.", "移动游戏时平盖会滑动。在底面添加定位边，让盖子自行对齐且仍能取下。", "מכסה שטוח מחליק כשמזיזים את המשחק. הוסיפו שפה מתחתיו כדי שימרכז את עצמו ועדיין יוכל להתרומם."], "tasks": [["Lift the finished lid to 3 mm. Under it, add a solid Box 93 × 63 × 3 mm at X = 123.5, Y = 3.5, Lift = 0.", "Подними готовую крышку на 3 мм. Под ней добавь Box 93 × 63 × 3 мм при X = 123.5, Y = 3.5, Lift = 0.", "把完成的盖子抬升到 3 mm。在下方添加实体 Box 93 × 63 × 3 mm，X = 123.5、Y = 3.5、Lift = 0。", "הרימו את המכסה המוכן ל־3 מ״מ. מתחתיו הוסיפו Box מלא 93 × 63 × 3 מ״מ במיקום X = 123.5, Y = 3.5, Lift = 0."], ["Hollow this new Box with a Hole 87 × 57 × 5 mm at X = 126.5, Y = 6.5, Lift = -1. Group only these two shapes to make a ring.", "Вырежи новый Box фигурой Hole 87 × 57 × 5 мм при X = 126.5, Y = 6.5, Lift = -1. Сгруппируй только эти две фигуры в кольцо.", "用 Hole 87 × 57 × 5 mm 挖空新 Box，X = 126.5、Y = 6.5、Lift = -1。只将这两个形状分组成环。", "רוקנו את ה־Box החדש בעזרת Hole בגודל 87 × 57 × 5 מ״מ במיקום X = 126.5, Y = 6.5, Lift = -1. קבצו רק את שתי הצורות האלה לטבעת."], ["Group the ring with the lid. To test the assembled position, move the whole lid group to X = 0, Y = 0, Lift = 27. Check the lip clears all four inside walls.", "Сгруппируй кольцо с крышкой. Для проверки перемести всю крышку: X = 0, Y = 0, Lift = 27. Проверь зазор с четырьмя стенками.", "把环与盖子分组。测试组装时，把整个盖组移动到 X = 0、Y = 0、Lift = 27，检查定位边与四面内壁都有间隙。", "קבצו את הטבעת עם המכסה. לבדיקת הרכבה הזיזו את כל קבוצת המכסה ל־X = 0, Y = 0, Lift = 27. בדקו שהשפה אינה נוגעת בארבעת הקירות הפנימיים."]], "success": [["The lip is 1 mm smaller than the cavity: a 0.5 mm gap on each side. Controls remain clear and the lid stays removable.", "Бортик на 1 мм меньше полости: по 0,5 мм с каждой стороны. Кнопки свободны, крышка съёмная.", "定位边比内腔小 1 mm，每侧间隙 0.5 mm，不挡控制部件且盖子可拆。", "השפה קטנה מהחלל ב־1 מ״מ: מרווח 0.5 מ״מ בכל צד. הפקדים נשארים פנויים והמכסה נשלף."]], "hint": ["Keep a copy beside the body to see the underside. This locates the lid; it is not a snap lock.", "Оставь копию рядом, чтобы видеть низ. Бортик выравнивает крышку, это не защёлка.", "在盒体旁保留副本，便于看底面。它用于定位盖子，不是卡扣。", "השאירו עותק לצד הגוף כדי לראות את התחתית. השפה ממקמת את המכסה; היא אינה נעילת קליק."], "concepts": ["fit", "group"]}, {"title": ["Controls without colour alone", "Управление не только по цвету", "不只靠颜色识别控制", "פקדים בלי להסתמך רק על צבע"], "problem": ["A visitor cannot reliably tell the colours apart. Make the game understandable with raised labels and a clear start area.", "Посетитель плохо различает цвета. Сделай выпуклые обозначения и понятную зону начала.", "有位游客无法可靠区分颜色。添加凸起标记与明确的开始区域，让游戏易懂。", "מבקר אינו מבחין היטב בין הצבעים. הוסיפו תוויות בולטות ואזור התחלה ברור."], "tasks": [["Use Text to add the same numbers as the program near each button. Keep labels clear of the holes.", "Добавь Text с теми же цифрами, что в программе, рядом с кнопками. Не перекрывай отверстия.", "用 Text 在每个按钮旁添加程序使用的相同数字，不遮住孔。", "השתמשו ב־Text להוספת אותם מספרים שבתוכנית ליד כל כפתור. אל תחסמו חורים."], ["Place the text on the lid with a 1 mm raised height. Group each label with the lid.", "Помести текст на крышку с выступом 1 мм. Сгруппируй с крышкой.", "把文字放到盖子表面，凸起 1 mm，与盖子分组。", "מקמו את הטקסט על המכסה בגובה בולט של 1 מ״מ. קבצו כל תווית עם המכסה."], ["Ask a partner to explain the controls using the labels rather than the colours. Improve one unclear feature.", "Пусть напарник объяснит управление по надписям, не цветам. Исправь одно непонятное место.", "让同伴依靠标记而非颜色解释控制，改进一处不清楚的设计。", "בקשו מבן זוג להסביר את הפקדים בעזרת התוויות במקום הצבעים. שפרו פרט לא ברור אחד."]], "success": [["Labels match the program, are readable and do not block a control or cable.", "Надписи совпадают с программой, читаются и не мешают кнопкам или кабелю.", "标记与程序对应、可读，且不挡按钮或线缆。", "התוויות תואמות לתוכנית, קריאות ואינן חוסמות פקד או כבל."]], "concepts": ["text"], "hint": ["With the plain lid at Lift 0, its top is at 3 mm. Put 1 mm text at Lift 3 before grouping.", "У плоской крышки Lift 0 верх на 3 мм. До группировки поставь текст толщиной 1 мм на Lift 3.", "平盖 Lift 为 0 时，顶面位于 3 mm。分组前把 1 mm 厚文字设为 Lift 3。", "כשהמכסה השטוח ב־Lift 0, פניו העליונים בגובה 3 מ״מ. שימו טקסט בעובי 1 מ״מ ב־Lift 3 לפני הקיבוץ."]}], "solutions": [{"title": "Core dimensions and opening checks", "text": "Body 100 × 70 × 30; cutter 94 × 64 × 30 at (3,3,3) gives 3 mm walls and floor. Lid 100 × 70 × 3 at (120,0,0). Use the hole table exactly for the practice layout. All cutters cross the intended material. USB cutter crosses the left wall."}, {"title": "Locating lip", "text": "Cavity 94 × 64; lip outside 93 × 63. The 1 mm total difference leaves 0.5 mm per side. Ring wall 3 mm. Lid group Lift 27 places the flat lid at body height 30. This is a locating feature, not a validated latch."}], "rubric": [[["Working", "Работает", "能运行", "עובד"], ["Hollow body, separate lid and through-openings match the brief.", "Полый корпус, крышка и сквозные отверстия соответствуют заданию.", "中空盒体、独立盖子与贯穿孔符合任务。", "גוף חלול, מכסה נפרד ופתחים עוברים תואמים לבריף."]], [["Secure", "Уверенно", "掌握", "מבוסס"], ["Dimensions leave room for the planning block, wires and cable; the controls are clear.", "Размеры оставляют место для платы-макета, проводов и кабеля; управление понятно.", "尺寸为规划块、导线和线缆留足空间，控制清晰。", "המידות משאירות מקום לבלוק התכנון, לחוטים ולכבל; הפקדים ברורים."]], [["Independent", "Самостоятельно", "能独立完成", "עצמאי"], ["Improve one fit or usability problem and explain why your change helps.", "Исправь проблему посадки или удобства и объясни пользу изменения.", "改进一个配合或使用问题，解释修改为何有效。", "שפרו בעיית התאמה או שימוש והסבירו למה השינוי עוזר."]]], "exit": [["Show the floor that the inner Hole left behind.", "Покажи дно, оставленное внутренним Hole.", "展示内部 Hole 留下的底板。", "הראו את הרצפה שה־Hole הפנימי השאיר."], ["Point to the route for the USB cable and the space for the board.", "Покажи путь USB и место платы.", "指出 USB 线缆路径和电路板空间。", "הצביעו על מסלול כבל ה־USB ועל המקום ללוח."], ["Explain one dimension you must check against real parts before printing.", "Объясни, какой размер нужно сверить с реальными деталями перед печатью.", "解释打印前必须与真实零件核对的一项尺寸。", "הסבירו מידה אחת שצריך לבדוק מול חלקים אמיתיים לפני הדפסה."]], "teacher": {"sections": [{"title": "Class learning considerations", "items": ["The brief follows the Pico game. Assume no prior Tinkercad 3D knowledge. Teach dimensions, Ruler Endpoint mode, Lift, Hole and Group explicitly.", "The figures are model guides in Tinkercad conventions, not screenshots of an unfamiliar app. Planning blocks and 12 mm / 6 mm openings are supplied practice sizes. Measure purchased parts, their mounting features and wire space before manufacture."]}, {"title": "Learning objective and inquiry", "items": ["Model a usable, repairable game case. Inquiry: how can a case protect a circuit without making the game hard to use?"]}, {"title": "Suggested lesson sequence", "items": ["40 minutes: 5 setup/body, 8 hollow, 5 lid, 12 openings, 8 fit and partner feedback, 2 exit. Continue unfinished CAD rather than skip the floor or fit check.", "The separate Community Project period continues the teacher-opened project stage.", "Resources: a school laptop and school Tinkercad account; the coding guide links to the chosen simulator. Optional later physical kit per pair: Pico, three push buttons, three LEDs, three 330-ohm resistors, breadboard, jumper wires and USB cable."]}, {"title": "Differentiation", "items": ["Everyone works towards the same working product. Use the complete checkpoint code or the supplied dimensions when needed. Ask for an explanation of one change before removing a scaffold.", "Early finishers choose the problem in Extra challenges. Judge the behaviour and their explanation, not the amount of code copied."]}, {"title": "Assessment for learning", "items": ["Inspect the 3 mm floor and walls, through-holes, separate lid and cable path. If the bottom vanishes, check the cutter Lift; if nothing cuts, check Hole and Group.", "Ask students to show a dimension and explain one design change. A digital planning block is not proof of physical fit."]}, {"title": "Challenge", "items": ["Locating lip: outside dimensions are 1 mm smaller than the cavity, leaving 0.5 mm each side. Labels must not obstruct holes or controls."]}, {"title": "Next steps", "items": ["Save the CAD model in the school account. Prototype or print only after actual component dimensions and assembly are checked. Reuse this model during the later physical D&T project."]}]}, "ui": {"start": ["Start", "Начало", "开始", "התחלה"], "build": ["Build", "Сборка", "制作", "בנייה"], "challenges": ["Extra challenges", "Дополнительные задания", "额外挑战", "אתגרים נוספים"], "notebook": ["Notebook", "Справочник", "笔记本", "מחברת"], "exit": ["Exit ticket", "Итог", "出口任务", "כרטיס יציאה"], "teacher": ["Teacher", "Учитель", "教师", "מורה"], "print": ["Print / Save PDF", "Печать / PDF", "打印 / 保存 PDF", "הדפסה / שמירה כ־PDF"], "language": ["Language", "Язык", "语言", "שפה"], "intent": ["Today you will learn to…", "Сегодня ты научишься…", "今天你将学会…", "היום תלמדו…"], "setup": ["Get ready", "Подготовься", "准备好", "התכוננו"], "begin": ["Start building", "Начать сборку", "开始制作", "התחילו לבנות"], "step": ["Step", "Шаг", "步骤", "שלב"], "steps": ["Build steps", "Шаги сборки", "制作步骤", "שלבי הבנייה"], "learn": ["Learn", "Изучи", "学习", "למדו"], "turn": ["Your turn", "Твоя очередь", "轮到你了", "תורכם"], "copy": ["Copy code", "Копировать код", "复制代码", "העתיקו קוד"], "copied": ["Copied. Return to your editor.", "Скопировано. Вернись в редактор.", "已复制。返回编辑器。", "הועתק. חזרו לעורך."], "full": ["Complete code for this step", "Полный код этого шага", "本步骤完整代码", "הקוד המלא לשלב הזה"], "fullNote": ["If you need a fresh start, replace your whole program with this version.", "Если нужно начать заново, замени всю программу этой версией.", "需要重新开始
