  <script>window.FOCUSED_LESSON = {"lesson":{"year":8,"lesson":7,"title":["Finish your traffic lights","Закончи светофор","完成交通信号灯","השלימו את הרמזור"],"extra":{"title":["Build a pedestrian crossing","Сделай пешеходный переход","制作行人过街信号灯","בנו מעבר חצייה"],"start":["The starter has the button, ped_red and ped_green ready. Change the pedestrian lights after the cars stop.","В заготовке уже есть кнопка, ped_red и ped_green. Переключи огни для пешеходов после остановки машин.","起始项目已设置按钮、ped_red 和 ped_green。车辆停下后，再切换行人灯。","פרויקט ההתחלה כבר מכין את הכפתור ואת ped_red ו־ped_green. החליפו את אורות הולכי הרגל אחרי שהמכוניות עוצרות."],"learn":["Use .value() and time.sleep() to give pedestrians five seconds of green while cars wait.","Используй .value() и time.sleep(), чтобы дать пешеходам пять секунд зелёного, пока машины ждут.","使用 .value() 和 time.sleep()，让车辆等待时行人绿灯亮五秒。","השתמשו ב־.value() וב־time.sleep() כדי לתת להולכי הרגל חמש שניות של ירוק בזמן שהמכוניות מחכות."],"project":"crossing8","open":["Open in Wokwi","Открыть в Wokwi","在 Wokwi 中打开","פתיחה ב-Wokwi"],"steps":[["Add import time with the imports at the top of main.py.","Добавь import time к импортам в начале main.py.","在 main.py 顶部的导入语句中加入 import time。","הוסיפו import time ליד שאר שורות הייבוא בתחילת main.py."],["Find “Add your pedestrian lights here”. Match its indentation. Use .value() to turn pedestrian red off and green on.","Найди «Add your pedestrian lights here». Сохрани такой же отступ. С помощью .value() выключи красный для пешеходов и включи зелёный.","找到“Add your pedestrian lights here”，保持相同缩进。用 .value() 关闭行人红灯并开启绿灯。","מצאו את “Add your pedestrian lights here” ושמרו על אותה הזחה. בעזרת ‎.value()‎ כבו את האדום להולכי הרגל והדליקו את הירוק."],["Wait five seconds. Turn pedestrian green off and red back on.","Подожди пять секунд. Выключи зелёный для пешеходов и снова включи красный.","等待五秒。关闭行人绿灯，再打开红灯。","המתינו חמש שניות. כבו את הירוק להולכי הרגל והדליקו שוב את האדום."],["Run. Press the blue button while the cars have green. Watch what happens.","Запусти программу. Нажми синюю кнопку, пока машинам горит зелёный. Посмотри, что произойдёт.","运行程序。在车辆绿灯亮时按下蓝色按钮，观察结果。","הריצו. לחצו על הכפתור הכחול בזמן שהאור למכוניות ירוק. ראו מה קורה."]],"done":["Cars get red first. Pedestrian green lasts five seconds, then pedestrian red comes back before cars go.","Сначала загорается красный для машин. Зелёный для пешеходов горит пять секунд, затем снова загорается красный для пешеходов.","车辆先亮红灯。行人绿灯亮五秒，随后在车辆通行前恢复行人红灯。","תחילה נדלק אדום למכוניות. הירוק להולכי הרגל דולק חמש שניות ואז האדום חוזר לפני שהמכוניות נוסעות."],"facts":["Use these first two lines below the comment. Add the wait and the two commands that bring back pedestrian red.","Добавь эти первые две строки под комментарием. Затем допиши паузу и две команды, которые возвращают красный для пешеходов.","在注释下写入这两行。再添加等待语句和让行人红灯恢复的两条命令。","כתבו את שתי השורות הראשונות מתחת להערה. הוסיפו את ההמתנה ואת שתי הפקודות שמחזירות את האדום להולכי הרגל."],"code":"        ped_red.value(0)\n        ped_green.value(1)","notes":[["This lets you call time.sleep().","Так можно вызвать time.sleep().","这样就可以调用 time.sleep()。","כך תוכלו להשתמש ב־time.sleep()."],["Car red is already on here.","Здесь красный для машин уже горит.","此处车辆红灯已经亮起。","האור האדום למכוניות כבר דולק כאן."],["Use time.sleep(5) while pedestrian green is on.","Используй time.sleep(5), пока зелёный для пешеходов горит.","行人绿灯亮时使用 time.sleep(5)。","השתמשו ב־time.sleep(5) כשהירוק להולכי הרגל דולק."],["The starter remembers the button press.","Заготовка запоминает нажатие кнопки.","起始项目会记住按钮按下。","פרויקט ההתחלה זוכר את הלחיצה על הכפתור."]],"figure":{"file":"crossing8.png","caption":["Wokwi crossing. Walk red GP18, walk green GP19, blue button GP20.","Переход в Wokwi. Красный для пешеходов GP18, зелёный GP19, синяя кнопка GP20.","Wokwi 过街项目。行人红灯 GP18，行人绿灯 GP19，蓝色按钮 GP20。","מעבר חצייה ב-Wokwi. אדום להולכי רגל GP18, ירוק GP19, כפתור כחול GP20."]},"notebook":[{"command":".value(1) / .value(0)","example":"ped_green.value(1)","meaning":["1 turns the LED on. 0 turns it off.","1 включает светодиод. 0 его выключает.","1 点亮 LED，0 熄灭 LED。","1 מדליק את הנורית. 0 מכבה אותה."]},{"command":"time.sleep()","example":"time.sleep(5)","meaning":["With import time at the top, this waits five seconds.","После import time в начале файла эта команда ждёт пять секунд.","在文件顶部加入 import time 后，这条语句会等待五秒。","אחרי הוספת import time בראש הקובץ, פקודה זו ממתינה חמש שניות."]}]},"platform":["Python · Wokwi Pico","Python · Wokwi Pico","Python · Wokwi Pico","Python · Wokwi Pico"],"notebook":{"extra":[]},"url":"https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-7-pedestrian-crossing/"},"ui":{"main":["Main task","Основное задание","主要任务","משימה עיקרית"],"challenge":["Extra challenge","Дополнительное задание","额外挑战","אתגר נוסף"],"copy":["Copy code","Скопировать код","复制代码","העתקת קוד"],"copied":["Code copied","Код скопирован","代码已复制","הקוד הועתק"],"copyFail":["Select the code and copy it.","Выдели и скопируй код.","选中代码后复制。","בחרו את הקוד והעתיקו אותו."],"show":["You’re done when","Готово, если","完成标准","סיימתם כאשר"],"help":["Code help","Подсказка по коду","代码提示","עזרה בקוד"],"learn":["What you’re learning","Чему ты учишься","学习目标","מה לומדים"],"extraLink":["Open the extra challenge","Открыть дополнительное задание","打开额外挑战","פתיחת האתגר הנוסף"],"back":["Back to the main task","Назад к основному заданию","返回主要任务","חזרה למשימה העיקרית"],"print":["Print / Save PDF","Печать / PDF","打印 / 保存 PDF","הדפסה / שמירה כ-PDF"],"starter":["Starter code","Стартовый код","起始代码","קוד התחלה"],"starterOnline":["Copy the starter from the lesson page","Скопируй заготовку на странице урока","到课程页面复制起始代码","העתיקו את קוד ההתחלה מדף השיעור"],"online":["Open the lesson online","Открыть урок онлайн","打开在线课程","פתיחת השיעור באתר"],"notebook":["Code Notebook","Справочник по коду","代码笔记","מחברת קוד"],"notebookExtra":["For the challenge","Для дополнительного задания","挑战用法","לאתגר הנוסף"]},"links":{"crossing8":"https://wokwi.com/projects/480513890722255873"}};</script>
