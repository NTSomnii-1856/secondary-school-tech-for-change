  <script>window.FOCUSED_LESSON = {"lesson":{"year":8,"lesson":7,"title":["Finish your traffic lights","Закончи светофор","完成交通信号灯","השלימו את הרמזור"],"extra":{"title":["Build a pedestrian crossing","Сделай пешеходный переход","制作行人过街信号灯","בנו מעבר חצייה"],"start":["A pedestrian presses while cars are moving. The starter remembers the press and waits for car red. You control the pedestrian lights.","Пешеход нажимает кнопку, пока машины едут. Заготовка запоминает нажатие и ждёт красного для машин. Ты управляешь огнями для пешеходов.","车辆行驶时，行人按下按钮。起始项目会记住按键并等到车灯变红。你来控制行人灯。","הולך רגל לוחץ בזמן שהמכוניות נוסעות. פרויקט ההתחלה זוכר את הלחיצה ומחכה לאדום למכוניות. אתם שולטים באורות להולכי הרגל."],"learn":["Use the car’s red phase to give pedestrians a safe turn.","Дай пешеходам пройти, когда для машин горит красный.","在车辆红灯阶段给行人安全通行的时间。","תנו להולכי הרגל לחצות בזמן שהאור למכוניות אדום."],"project":"crossing8","open":["Open in Wokwi","Открыть в Wokwi","在 Wokwi 中打开","פתיחה ב-Wokwi"],"steps":[["Find the comment “Add your pedestrian lights here”. Put your crossing code below it.","Найди комментарий «Add your pedestrian lights here». Добавь код сразу под ним.","找到注释 “Add your pedestrian lights here”，把过街代码写在下一行。","מצאו את ההערה “Add your pedestrian lights here”. כתבו מתחתיה את קוד החצייה."],["Turn pedestrian red off. Turn pedestrian green on for 5 seconds.","Выключи красный для пешеходов. Включи их зелёный на 5 секунд.","关闭行人红灯，开启行人绿灯 5 秒。","כבו את האדום להולכי הרגל. הדליקו את הירוק שלהם ל-5 שניות."],["Turn pedestrian green off and red back on. Run and press the button while car green is on.","Выключи зелёный для пешеходов и верни красный. Запусти и нажми кнопку, пока машинам горит зелёный.","关闭行人绿灯并重新开启红灯。运行，在车辆绿灯时按按钮。","כבו את הירוק להולכי הרגל והדליקו שוב אדום. הריצו ולחצו על הכפתור כשהאור למכוניות ירוק."]],"done":["Cars stop first. Pedestrians get 5 seconds of green, then their red returns before cars go.","Машины сначала останавливаются. Пешеходам горит зелёный 5 секунд. Их красный возвращается до начала движения машин.","车辆先停下。行人绿灯亮 5 秒，随后在车辆通行前恢复行人红灯。","המכוניות עוצרות קודם. להולכי הרגל יש 5 שניות של ירוק. האדום שלהם חוזר לפני שהמכוניות נוסעות."],"facts":["Paste all five lines below the “Add your pedestrian lights here” comment. Match its indentation.","Вставь все пять строк после комментария «Add your pedestrian lights here». Сохрани его отступ.","把这五行放在 “Add your pedestrian lights here” 注释下方，并与它缩进对齐。","הדביקו את חמש השורות מתחת להערה “Add your pedestrian lights here”. התאימו את ההזחה."],"code":"        ped_red.off()        # Turn walk red off.\n        ped_green.on()       # Give pedestrians green.\n        pause(5)             # Keep green for 5 seconds.\n        ped_green.off()      # Finish the walk signal.\n        ped_red.on()         # Walk red before cars go.","notes":[["The car is already on red at this point.","В этот момент машинам уже горит красный.","此处车辆红灯已经亮起。","בנקודה הזו האור למכוניות כבר אדום."],["While pedestrians walk, the cars must stay on red.","Пока пешеходы идут, машинам должен гореть красный.","行人通行时，车辆应保持红灯。","בזמן החצייה, האור למכוניות צריך להישאר אדום."],["A request during car green should wait for car red.","Нажатие на зелёном должно дождаться красного для машин.","车辆绿灯时的请求应等到车辆红灯。","לחיצה בזמן ירוק למכוניות צריכה לחכות לאדום."]],"figure":{"file":"crossing8.png","caption":["Wokwi crossing. Walk red GP18, walk green GP19, blue button GP20.","Переход в Wokwi. Красный для пешеходов GP18, зелёный GP19, синяя кнопка GP20.","Wokwi 过街项目。行人红灯 GP18，行人绿灯 GP19，蓝色按钮 GP20。","מעבר חצייה ב-Wokwi. אדום להולכי רגל GP18, ירוק GP19, כפתור כחול GP20."]}},"platform":["Python · Wokwi Pico","Python · Wokwi Pico","Python · Wokwi Pico","Python · Wokwi Pico"],"notebook":{"extra":[{"command":"pause()","example":"pause(5)","meaning":["The crossing starter’s wait. 5 means five seconds.","Пауза из заготовки перехода. 5 означает пять секунд.","过街项目提供的等待函数。5 表示 5 秒。","פקודת המתנה מפרויקט החצייה. 5 פירושו חמש שניות."]},{"command":"requested()","example":"if requested():","meaning":["Checks whether the starter remembers a button press.","Проверяет, запомнила ли заготовка нажатие.","检查起始程序是否记住了按键。","בודקת אם קוד ההתחלה זוכר לחיצה על הכפתור."]}]},"url":"https://ntsomnii-1856.github.io/secondary-school-tech-for-change/year-8/week-7-pedestrian-crossing/"},"ui":{"main":["Main task","Основное задание","主要任务","משימה עיקרית"],"challenge":["Extra challenge","Дополнительное задание","额外挑战","אתגר נוסף"],"copy":["Copy code","Скопировать код","复制代码","העתקת קוד"],"copied":["Code copied","Код скопирован","代码已复制","הקוד הועתק"],"copyFail":["Select the code and copy it.","Выдели и скопируй код.","选中代码后复制。","בחרו את הקוד והעתיקו אותו."],"show":["You’re done when","Готово, если","完成标准","סיימתם כאשר"],"help":["Code help","Подсказка по коду","代码提示","עזרה בקוד"],"learn":["What you’re learning","Чему ты учишься","学习目标","מה לומדים"],"extraLink":["Open the extra challenge","Открыть дополнительное задание","打开额外挑战","פתיחת האתגר הנוסף"],"back":["Back to the main task","Назад к основному заданию","返回主要任务","חזרה למשימה העיקרית"],"print":["Print / Save PDF","Печать / PDF","打印 / 保存 PDF","הדפסה / שמירה כ-PDF"],"starter":["Starter code","Стартовый код","起始代码","קוד התחלה"],"starterOnline":["Copy the starter from the lesson page","Скопируй заготовку на странице урока","到课程页面复制起始代码","העתיקו את קוד ההתחלה מדף השיעור"],"online":["Open the lesson online","Открыть урок онлайн","打开在线课程","פתיחת השיעור באתר"],"notebook":["Code Notebook","Справочник по коду","代码笔记","מחברת קוד"],"notebookExtra":["For the challenge","Для дополнительного задания","挑战用法","לאתגר הנוסף"]},"links":{"crossing8":"https://wokwi.com/projects/480513890722255873"}};</script>
