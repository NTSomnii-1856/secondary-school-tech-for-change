<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 Lesson 9 · Button memory game</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122-clear"><script>window.GAME_LESSON={"year":8,"week":9,"title":["Button memory game","Игра памяти с кнопками","按钮记忆游戏","משחק זיכרון עם כפתורים"],"platform":"Python · Wokwi Pico","context":["Build a game with three buttons.","Собери игру с тремя кнопками.","制作一个有三个按钮的游戏。","בנו משחק עם שלושה כפתורים."],"brief":["Watch three lights. Press the matching buttons in the same order.","Посмотри на три вспышки. Нажми соответствующие кнопки в том же порядке.","观察三次闪灯。按相同顺序按下对应按钮。","צפו בשלושה הבהובים. לחצו על הכפתורים המתאימים באותו סדר."],"objectives":[["Use the buttons to enter the pattern shown by the LEDs.","Введи кнопками порядок, показанный светодиодами.","用按钮输入 LED 显示的顺序。","הזינו בכפתורים את הרצף שהנוריות הציגו."]],"launch":{"url":"https://wokwi.com/projects/new/micropython-pi-pico","label":["Open a new Pico project","Открыть новый проект Pico","新建 Pico 项目","פתחו פרויקט Pico חדש"]},"figure":"../../game-studio/diagrams/pico-buttons.png","figureCaption":["LEDs: GP15 red, GP13 yellow, GP14 green. Buttons: GP16 red, GP17 yellow, GP18 green. Each button joins its input to GND.","LED: GP15 красный, GP13 жёлтый, GP14 зелёный. Кнопки: GP16 красная, GP17 жёлтая, GP18 зелёная. Кнопка соединяет вход с GND.","LED：GP15 红、GP13 黄、GP14 绿。按钮：GP16 红、GP17 黄、GP18 绿。每个按钮连接对应输入与 GND。","נוריות: GP15 אדום, GP13 צהוב, GP14 ירוק. כפתורים: GP16 אדום, GP17 צהוב, GP18 ירוק. כל כפתור מחבר את הקלט שלו ל־GND."],"setup":[["Open a new Pico project in Wokwi. Keep this lesson open in another tab.","Открой новый проект Pico в Wokwi. Оставь урок в другой вкладке.","在 Wokwi 新建 Pico 项目。保留另一个标签页中的课程。","פתחו פרויקט Pico חדש ב־Wokwi. השאירו את השיעור פתוח בלשונית נוספת."],["Copy the wiring from this page into diagram.json. You should see three LEDs and three buttons.","Скопируй схему с этой страницы в diagram.json. Должны появиться три светодиода и три кнопки.","把本页接线复制到 diagram.json。应看到三盏 LED 和三个按钮。","העתיקו את החיווט מהעמוד אל diagram.json. אמורים להופיע שלוש נוריות ושלושה כפתורים."],["Copy the starter into main.py. Press Run, then Stop. All three LEDs should stay off.","Скопируй стартовый код в main.py. Нажми Run, затем Stop. Все три светодиода должны оставаться выключенными.","把起始代码复制到 main.py。点击 Run，再点击 Stop。三盏 LED 应保持熄灭。","העתיקו את קוד ההתחלה אל main.py. לחצו Run ואז Stop. שלוש הנוריות צריכות להישאר כבויות."]],"cards":{"imports":{"title":"Imports","meaning":["Pin controls the pins. time gives us pauses. random chooses a number.","Pin управляет выводами. time даёт паузы. random выбирает число.","Pin 控制引脚，time 提供暂停，random 选择数字。","Pin שולט בפינים. time מאפשר המתנות. random בוחר מספר."],"example":"from machine import Pin\nimport time\nimport random"},"pin":{"title":"Pin.IN / Pin.PULL_UP","meaning":["Pin.IN reads a button. Pin.PULL_UP gives 1 when released and 0 when pressed.","Pin.IN читает кнопку. Pin.PULL_UP даёт 1 при отпускании и 0 при нажатии.","Pin.IN 读取按钮。Pin.PULL_UP 让松开时读数为 1，按下时为 0。","Pin.IN קורא כפתור. Pin.PULL_UP נותן 1 כשמשחררים ו־0 כשלוחצים."],"example":"rbutton = Pin(16, Pin.IN, Pin.PULL_UP)"},"value":{"title":".value()","meaning":["Empty brackets read the button. The red button is on GP16.","Пустые скобки читают кнопку. Красная кнопка подключена к GP16.","空括号表示读取按钮。红色按钮连接 GP16。","סוגריים ריקים קוראים את הכפתור. הכפתור האדום מחובר ל־GP16."],"example":"print(rbutton.value())"},"while":{"title":"while","meaning":["Repeat the indented lines while the condition is true.","Повторяй строки с отступом, пока условие верно.","条件成立时，重复缩进的代码。","חזרו על השורות המוזחות כל עוד התנאי מתקיים."],"example":"while rbutton.value() == 0:\n    time.sleep(0.03)"},"release":{"title":"Wait for release","meaning":["A held button still reads 0. Wait for it to return to 1 before counting another press.","Удерживаемая кнопка всё ещё даёт 0. Дождись 1 перед следующим нажатием.","按住按钮时读数仍是 0。等它回到 1 后，再记录下一次按下。","כפתור מוחזק עדיין קורא 0. חכו שיחזור ל־1 לפני שסופרים לחיצה נוספת."],"example":"while rbutton.value() == 0:\n    time.sleep(0.03)"},"length":{"title":"len(answer)","meaning":["len() counts the digits already stored. The loop stops when there are three.","len() считает уже записанные цифры. Цикл остановится, когда их станет три.","len() 计算已经保存的数字个数。达到三个时循环停止。","len() סופר את הספרות שכבר נשמרו. הלולאה נעצרת כשיש שלוש."],"example":"answer = \"13\"\nprint(len(answer))  # 2"},"append":{"title":"answer = answer + \"1\"","meaning":["Add the red digit to the end of the answer. Yellow adds \"2\". Green adds \"3\".","Добавь цифру красной кнопки в конец ответа. Жёлтая добавляет \"2\", зелёная — \"3\".","把红色按钮的数字接到答案末尾。黄色加 \"2\"，绿色加 \"3\"。","הוסיפו את הספרה האדומה לסוף התשובה. צהוב מוסיף \"2\" וירוק מוסיף \"3\"."],"example":"answer = \"\"\nanswer = answer + \"1\""},"branches":{"title":"if / elif","meaning":["Check which button is pressed. Use one button at a time.","Проверь, какая кнопка нажата. Нажимай по одной кнопке.","检查哪个按钮被按下。每次只按一个按钮。","בדקו איזה כפתור לחוץ. לחצו על כפתור אחד בכל פעם."],"example":"if rbutton.value() == 0:\n    answer = answer + \"1\"\nelif ybutton.value() == 0:\n    answer = answer + \"2\""},"random":{"title":"random.randint(0, 2)","meaning":["Choose LED position 0, 1 or 2. The same colour can appear again.","Выбери позицию светодиода 0, 1 или 2. Цвет может повториться.","选择 LED 位置 0、1 或 2。相同颜色可以再次出现。","בחרו מיקום נורית 0, 1 או 2. אותו צבע יכול לחזור."],"example":"number = random.randint(0, 2)\nleds[number].value(1)"},"order":{"title":"order","meaning":["Save each light as a player digit. Red is 1, yellow is 2 and green is 3.","Запиши каждый свет цифрой игрока. Красный — 1, жёлтый — 2, зелёный — 3.","把每盏灯记成玩家数字。红色为 1，黄色为 2，绿色为 3。","שמרו כל אור כספרת שחקן. אדום הוא 1, צהוב 2 וירוק 3."],"example":"order = order + str(number + 1)"},"range":{"title":"for i in range(3)","meaning":["Run the indented light commands three times.","Выполни команды света с отступом три раза.","把缩进的灯光命令运行三次。","הריצו את פקודות האור המוזחות שלוש פעמים."],"example":"for i in range(3):\n    print(i)"},"compare":{"title":"answer == order","meaning":["Check every digit in the answer against the light pattern.","Сравни каждую цифру ответа с порядком огней.","把答案的每个数字与灯光顺序比较。","השוו כל ספרה בתשובה לרצף האורות."],"example":"if answer == order:\n    print(\"You win!\")"},"rounds":{"title":"score","meaning":["Keep score = 0 before the rounds. Add one after a correct answer.","Поставь score = 0 перед раундами. После верного ответа добавь один.","把 score = 0 放在回合前。答对后加一分。","שימו score = 0 לפני הסיבובים. הוסיפו אחד אחרי תשובה נכונה."],"example":"score = score + 1"}},"stages":[{"title":["Read one button","Прочитай одну кнопку","读取一个按钮","קראו כפתור אחד"],"learn":["Check what the red button reads.","Проверь показания красной кнопки.","检查红色按钮的读数。","בדקו מה הכפתור האדום קורא."],"tasks":[["Complete the setup above. In main.py, add this code after speed = 1.","Выполни подготовку выше. В main.py добавь этот код после speed = 1.","完成上方设置。在 main.py 中，把这段代码加在 speed = 1 后面。","השלימו את ההכנה שלמעלה. ב־main.py הוסיפו את הקוד אחרי speed = 1."],["Press Run. Click and hold the red button, then release it.","Нажми Run. Нажми и удерживай красную кнопку, затем отпусти.","点击 Run。按住红色按钮，然后松开。","לחצו Run. לחצו והחזיקו את הכפתור האדום, ואז שחררו."],["Read the numbers in the terminal. Press Stop before editing.","Посмотри числа в терминале. Перед изменениями нажми Stop.","查看终端中的数字。修改前点击 Stop。","קראו את המספרים במסוף. לחצו Stop לפני העריכה."]],"concepts":["pin","value"],"snippet":"while True:\n    print(rbutton.value())\n    time.sleep(0.2)","place":["Add below speed = 1.","Добавь под speed = 1.","加在 speed = 1 下方。","הוסיפו מתחת ל־speed = 1."],"check":["Released gives 1. Pressed gives 0.","Отпущена — 1. Нажата — 0.","松开时为 1，按下时为 0。","משוחרר נותן 1. לחוץ נותן 0."],"hint":["If it always shows 1, check the red button wire to GP16 and its other contact to GND.","Если всегда 1, проверь провод красной кнопки к GP16 и другой контакт к GND.","如果一直显示 1，检查红色按钮接 GP16 的线，以及另一触点到 GND 的线。","אם תמיד מופיע 1, בדקו את החוט של הכפתור האדום אל GP16 ואת המגע השני אל GND."]},{"title":["Count a press once","Считай нажатие один раз","一次按下只算一次","ספרו לחיצה פעם אחת"],"learn":["Wait for the red button to be released.","Дождись отпускания красной кнопки.","等待红色按钮松开。","חכו לשחרור הכפתור האדום."],"tasks":[["Press Stop. Delete the three-line while loop from step 1.","Нажми Stop. Удали цикл while из трёх строк из шага 1.","点击 Stop。删除步骤 1 的三行 while 循环。","לחצו Stop. מחקו את לולאת while בת שלוש השורות משלב 1."],["Paste this code in its place. Run and hold red for two seconds.","Вставь этот код на его место. Запусти и держи красную кнопку две секунды.","在原位置粘贴这段代码。运行并按住红色按钮两秒。","הדביקו את הקוד במקום. הריצו והחזיקו אדום לשתי שניות."],["Release red, then press it again.","Отпусти красную кнопку и нажми снова.","松开红色按钮，再按一次。","שחררו אדום ואז לחצו שוב."]],"concepts":["while","release"],"snippet":"while True:\n    if rbutton.value() == 0:\n        print(\"Red\")\n        while rbutton.value() == 0:\n            time.sleep(0.03)\n        time.sleep(0.03)","place":["Replace the whole loop from step 1.","Замени весь цикл из шага 1.","替换步骤 1 的整个循环。","החליפו את כל הלולאה משלב 1."],"check":["One press prints Red once. Holding the button adds no more messages.","Одно нажатие выводит Red один раз. При удержании новых сообщений нет.","按下一次只显示一次 Red。按住时不会继续显示。","לחיצה אחת מדפיסה Red פעם אחת. החזקה לא מוסיפה הודעות."],"hint":["The second while belongs inside if. Give it eight leading spaces.","Второй while находится внутри if. Перед ним восемь пробелов.","第二个 while 在 if 内，前面要有八个空格。","ה־while השני נמצא בתוך if. שימו לפניו שמונה רווחים."]},{"title":["Save three presses","Запиши три нажатия","保存三次按下","שמרו שלוש לחיצות"],"learn":["Keep the pressed digits in answer.","Сохрани нажатые цифры в answer.","把按下的数字保存在 answer 中。","שמרו את הספרות שנלחצו בתוך answer."],"tasks":[["Replace the loop from step 2 with this code.","Замени цикл из шага 2 этим кодом.","用这段代码替换步骤 2 的循环。","החליפו את הלולאה משלב 2 בקוד הזה."],["Copy the red branch twice. Use elif for yellow and green. Change the button name and the digit in each copy.","Дважды скопируй ветвь красной кнопки. Для жёлтой и зелёной используй elif. В каждой копии поменяй имя кнопки и цифру.","把红色分支复制两次。黄色和绿色使用 elif。每份都要修改按钮名称和数字。","העתיקו את הענף האדום פעמיים. השתמשו ב־elif לצהוב ולירוק. שנו בכל העתק את שם הכפתור ואת הספרה."],["Run. Press red, green, red. Release each button before the next press.","Запусти. Нажми красную, зелёную, красную. Отпускай кнопку перед следующим нажатием.","运行。依次按红、绿、红。每次按下后，先松开再按下一次。","הריצו. לחצו אדום, ירוק, אדום. שחררו כל כפתור לפני הלחיצה הבאה."]],"concepts":["length","append","branches","release"],"snippet":"answer = \"\"\nwhile len(answer) < 3:\n    if rbutton.value() == 0:\n        answer = answer + \"1\"\n        while rbutton.value() == 0:\n            time.sleep(0.03)\n    # Add yellow and green elif branches here.\n    time.sleep(0.03)\nprint(answer)","place":["Replace the whole loop from step 2. Keep the imports and pin setup above it.","Замени весь цикл из шага 2. Оставь импорт и настройку выводов выше.","替换步骤 2 的整个循环。保留上方的导入和引脚设置。","החליפו את כל הלולאה משלב 2. השאירו מעליה את הייבוא והגדרת הפינים."],"check":["The terminal prints 131 after the third press. Holding red still counts once.","После третьего нажатия терминал выводит 131. Удержание красной кнопки всё ещё считается один раз.","第三次按下后，终端显示 131。按住红色按钮仍只算一次。","אחרי הלחיצה השלישית המסוף מדפיס 131. החזקת אדום עדיין נספרת פעם אחת."],"hint":["Use ybutton with \"2\" and gbutton with \"3\". Each elif lines up with if. Clear answer once, before while.","Для ybutton используй \"2\", для gbutton — \"3\". Каждый elif на одном уровне с if. Очищай answer один раз перед while.","ybutton 对应 \"2\"，gbutton 对应 \"3\"。每个 elif 与 if 对齐。只在 while 前清空一次 answer。","השתמשו ב־ybutton עם \"2\" וב־gbutton עם \"3\". כל elif מיושר עם if. נקו את answer פעם אחת לפני while."],"table":{"headers":[["Button","Кнопка","按钮","כפתור"],["Pin","Вывод","引脚","פין"],["Add","Добавь","加入","הוסיפו"]],"rows":[[["Red","Красная","红","אדום"],"GP16","\"1\""],[["Yellow","Жёлтая","黄","צהוב"],"GP17","\"2\""],[["Green","Зелёная","绿","ירוק"],"GP18","\"3\""]]}},{"title":["Show the light pattern","Покажи порядок огней","显示灯光顺序","הציגו את רצף האורות"],"learn":["Show three lights before the player presses the buttons.","Покажи три вспышки перед ответом игрока.","在玩家按按钮前，先显示三次灯光。","הציגו שלושה אורות לפני שהשחקן לוחץ על הכפתורים."],"tasks":[["Find answer = \"\". Add this light code just above that line.","Найди answer = \"\". Добавь код огней прямо над этой строкой.","找到 answer = \"\"，把这段灯光代码加在该行正上方。","מצאו answer = \"\". הוסיפו את קוד האורות ממש מעל השורה הזאת."],["Run and watch the three flashes. Wait for Your turn before pressing buttons.","Запусти и посмотри три вспышки. Перед нажатием дождись Your turn.","运行并观察三次闪灯。看到 Your turn 后再按按钮。","הריצו וצפו בשלושת ההבהובים. חכו ל־Your turn לפני שלוחצים."],["Press the matching order. Check the three digits printed at the end.","Нажми кнопки в показанном порядке. Проверь три цифры в конце.","按下对应顺序。检查最后显示的三个数字。","לחצו לפי הסדר שהוצג. בדקו את שלוש הספרות שמודפסות בסוף."]],"concepts":["random","order","range"],"snippet":"order = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(speed)\n    leds[number].value(0)\n    time.sleep(speed)\n\nprint(\"Your turn! Press three buttons.\")","place":["Add above answer = \"\". Keep answer and its button loop below it.","Добавь над answer = \"\". Оставь answer и цикл кнопок ниже.","加在 answer = \"\" 上方。把 answer 和按钮循环保留在它下面。","הוסיפו מעל answer = \"\". השאירו מתחת את answer ולולאת הכפתורים."],"check":["The lights flash before Your turn. Repeated colours have a dark gap between them.","Огни мигают перед Your turn. Повторы цвета разделены паузой без света.","灯光在 Your turn 前闪烁。重复颜色之间有熄灯间隔。","האורות מהבהבים לפני Your turn. בין צבעים חוזרים יש הפסקה חשוכה."],"hint":["The commands under for need four spaces. Keep answer = \"\" at the left margin, outside for.","Строки под for имеют отступ в четыре пробела. Оставь answer = \"\" без отступа, вне for.","for 下方的代码要缩进四个空格。answer = \"\" 从最左边开始，放在 for 外。","השורות שמתחת ל־for צריכות ארבעה רווחים. השאירו answer = \"\" בשוליים, מחוץ ל־for."]},{"title":["Check the answer","Проверь ответ","检查答案","בדקו את התשובה"],"learn":["Compare the button answer with the light order.","Сравни ответ кнопками с порядком огней.","把按钮答案与灯光顺序比较。","השוו את תשובת הכפתורים לרצף האורות."],"tasks":[["Delete print(answer) at the end. Put this check in its place.","Удали print(answer) в конце. На его место поставь эту проверку.","删除末尾的 print(answer)，在原位置加入这段检查。","מחקו את print(answer) שבסוף. שימו במקומו את הבדיקה הזאת."],["Run and copy the light order with the buttons.","Запусти и повтори порядок огней кнопками.","运行，并用按钮重复灯光顺序。","הריצו וחזרו בכפתורים על רצף האורות."],["Stop and Run again. This time press a wrong order.","Нажми Stop и снова Run. Теперь введи неверный порядок.","点击 Stop，再点击 Run。这次按一个错误顺序。","לחצו Stop ואז Run שוב. הפעם לחצו סדר שגוי."]],"concepts":["compare"],"snippet":"if answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)","place":["Replace the last print(answer), outside the button loop.","Замени последний print(answer) после цикла кнопок.","替换按钮循环外最后的 print(answer)。","החליפו את print(answer) האחרון, מחוץ ללולאת הכפתורים."],"check":["The right order wins. A wrong order shows the correct pattern.","Верный порядок даёт победу. При ошибке показывается правильный.","正确顺序获胜。错误时会显示正确顺序。","הסדר הנכון מנצח. סדר שגוי מציג את הרצף הנכון."],"hint":["Keep if answer == order: at the left margin. Both print lines belong inside their if or else branch.","Поставь if answer == order: без отступа. Каждая строка print находится внутри своей ветви if или else.","if answer == order: 从最左边开始。两行 print 各自在对应的 if 或 else 分支内缩进。","השאירו if answer == order: בשוליים. כל שורת print שייכת בתוך הענף שלה, if או else."]}],"challenges":[{"title":["Play three rounds","Сыграй три раунда","玩三个回合","שחקו שלושה סיבובים"],"problem":["Give the player three rounds and a final score out of 3.","Дай игроку три раунда и итоговый счёт из 3.","给玩家三个回合，最后显示满分为 3 的得分。","תנו לשחקן שלושה סיבובים וניקוד סופי מתוך 3."],"tasks":[["Put score = 0 above a new for game in range(3): loop. Move one whole game inside it.","Поставь score = 0 перед новым for game in range(3):. Перемести всю игру внутрь.","在新的 for game in range(3): 前写 score = 0，把完整一轮放进循环。","שימו score = 0 מעל לולאת for game in range(3): חדשה. העבירו לתוכה משחק שלם אחד."],["Add one point after a correct answer. Print the final score after the rounds.","После верного ответа добавь одно очко. Выведи итог после раундов.","答对后加一分。所有回合结束后显示总分。","הוסיפו נקודה אחרי תשובה נכונה. הדפיסו את הניקוד הסופי אחרי הסיבובים."],["Test two wins and one wrong answer. Restart and check that score starts at 0.","Проверь две победы и одну ошибку. Перезапусти и проверь начало счёта с 0.","测试两次答对和一次答错。重新运行，检查得分是否从 0 开始。","בדקו שני ניצחונות ותשובה שגויה אחת. התחילו מחדש ובדקו שהניקוד מתחיל ב־0."]],"success":[["Two wins give 2 out of 3. Each round has a new order and an empty answer.","Две победы дают 2 из 3. Каждый раунд начинается с нового порядка и пустого ответа.","两次获胜得到 2/3。每轮都有新顺序和空答案。","שני ניצחונות נותנים 2 מתוך 3. לכל סיבוב יש רצף חדש ותשובה ריקה."]],"hint":["Keep score = 0 before the rounds loop. Keep order = \"\" and answer = \"\" inside it.","score = 0 ставится перед циклом раундов. order = \"\" и answer = \"\" остаются внутри.","score = 0 放在回合循环前。order = \"\" 和 answer = \"\" 放在循环内。","השאירו score = 0 לפני לולאת הסיבובים. order = \"\" ו־answer = \"\" נשארים בתוכה."],"concepts":["rounds"]}],"rubric":[[["Working","Работает","能运行","עובד"],["Three matching button presses give You win!","
