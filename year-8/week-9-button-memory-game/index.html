<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 Lesson 9 · Button memory game</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122-clear"><script>window.GAME_LESSON={"year":8,"week":9,"title":["Button memory game","Игра памяти с кнопками","按钮记忆游戏","משחק זיכרון עם כפתורים"],"platform":"Python · Wokwi Pico","context":["A new Pico project","Новый проект Pico","新的 Pico 项目","פרויקט Pico חדש"],"brief":["Watch three lights. Use three turns to save the matching button choices.","Посмотри на три вспышки. За три хода сохрани кнопками тот же порядок.","观察三次闪灯。用三轮按键保存对应的顺序。","צפו בשלושה אורות. השתמשו בשלושה תורים כדי לשמור את הכפתורים המתאימים."],"objectives":[["Save one digit for each button choice, then check the saved answer.","Сохрани цифру для каждой кнопки, затем проверь ответ.","为每次按键保存一个数字，再检查答案。","שמרו ספרה לכל בחירת כפתור, ואז בדקו את התשובה."]],"launch":{"url":"https://wokwi.com/projects/new/micropython-pi-pico","label":["Open a new Pico project","Открыть новый проект Pico","新建 Pico 项目","פתחו פרויקט Pico חדש"]},"figure":"../../game-studio/diagrams/pico-buttons.png","figureCaption":["LEDs: GP15 red, GP13 yellow, GP14 green. Buttons: GP16 red, GP17 yellow, GP18 green. Each button joins its input to GND.","LED: GP15 красный, GP13 жёлтый, GP14 зелёный. Кнопки: GP16 красная, GP17 жёлтая, GP18 зелёная. Кнопка соединяет вход с GND.","LED：GP15 红、GP13 黄、GP14 绿。按钮：GP16 红、GP17 黄、GP18 绿。每个按钮连接对应输入与 GND。","נוריות: GP15 אדום, GP13 צהוב, GP14 ירוק. כפתורים: GP16 אדום, GP17 צהוב, GP18 ירוק. כל כפתור מחבר את הקלט שלו ל־GND."],"setup":[["Open a new Pico project. Copy the wiring below into diagram.json.","Открой новый проект Pico. Скопируй схему ниже в diagram.json.","新建 Pico 项目。把下方接线复制到 diagram.json。","פתחו פרויקט Pico חדש. העתיקו את החיווט שלמטה אל diagram.json."],["Copy Starter code into main.py. Run once. All lights should stay off.","Скопируй стартовый код в main.py. Запусти. Все лампы должны остаться выключенными.","把起始代码复制到 main.py。运行一次，所有灯应保持熄灭。","העתיקו את קוד ההתחלה אל main.py. הריצו פעם אחת. כל האורות אמורים להישאר כבויים."]],"cards":{"pin":{"title":"Pin.IN / Pin.PULL_UP","meaning":["Pin.IN reads a button. Pin.PULL_UP gives 1 when it is released. Pressing connects it to GND and gives 0.","Pin.IN считывает кнопку. С Pin.PULL_UP отпущенная кнопка даёт 1. Нажатая соединяется с GND и даёт 0.","Pin.IN 读取按钮。Pin.PULL_UP 使松开时读到 1。按下后接到 GND，读到 0。","Pin.IN קורא כפתור. Pin.PULL_UP נותן 1 כשהכפתור משוחרר. לחיצה מחברת ל־GND ונותנת 0."],"example":"rbutton = Pin(16, Pin.IN, Pin.PULL_UP)"},"read":{"title":"rbutton.value()","meaning":["Read the red button now. 0 means pressed. 1 means released.","Считай красную кнопку сейчас. 0 — нажата. 1 — отпущена.","读取红色按钮当前状态。0 表示按下，1 表示松开。","קראו את הכפתור האדום עכשיו. 0 אומר לחוץ. 1 אומר משוחרר."],"example":"print(rbutton.value())"},"save":{"title":"answer = answer + \"1\"","meaning":["answer holds the saved text. This line keeps what is there and adds \"1\" at the end. Red adds \"1\", yellow \"2\", green \"3\".","answer хранит текст ответа. Строка сохраняет прежний текст и добавляет в конец «1». Красный добавляет «1», жёлтый «2», зелёный «3».","answer 保存答案文本。这一行保留原有内容，再在末尾加上 \"1\"。红加 \"1\"，黄加 \"2\"，绿加 \"3\"。","answer שומר את הטקסט שנאסף. השורה משאירה את מה שכבר נשמר ומוסיפה \"1\" בסוף. אדום מוסיף \"1\", צהוב \"2\" וירוק \"3\"."],"example":"answer = \"1\"\nanswer = answer + \"3\"\nprint(answer)  # 13"},"blank":{"title":"answer = \"\"","meaning":["Start with an empty answer. Write this once, above the for loop.","Начни с пустого ответа. Напиши эту строку один раз перед циклом for.","从空答案开始。这一行只写一次，放在 for 循环上方。","התחילו עם תשובה ריקה. כתבו זאת פעם אחת, מעל לולאת for."],"example":"answer = \"\""},"turns":{"title":"for i in range(3)","meaning":["The indented lines run three times. i is 0, then 1, then 2.","Строки с отступом выполняются три раза. i равен 0, затем 1, затем 2.","缩进的代码运行三次。i 依次是 0、1、2。","השורות המוזחות רצות שלוש פעמים. i הוא 0, אחר כך 1 ואז 2."],"example":"for i in range(3):\n    print(\"Your turn\")"},"hold":{"title":"time.sleep(3)","meaning":["You have three seconds to press and hold. Keep holding until Saved appears. Then let go during the two-second pause.","У тебя три секунды, чтобы нажать и держать. Держи до сообщения Saved. Затем отпусти на время паузы в две секунды.","你有三秒时间按住按钮。保持按住，直到出现 Saved。然后在两秒暂停期间松开。","יש לכם שלוש שניות ללחוץ ולהחזיק. המשיכו להחזיק עד שמופיע Saved. אחר כך שחררו במהלך ההפסקה של שתי שניות."],"example":"time.sleep(3)\n# Read the buttons here.\nprint(\"Let go.\")\ntime.sleep(2)"},"choose":{"title":"if / elif / else","meaning":["Check red, yellow, then green. Save the digit of the held button. A ? marks a turn when no button was held.","Проверь красный, жёлтый, затем зелёный. Сохрани цифру нажатой кнопки. ? отмечает ход без нажатой кнопки.","依次检查红、黄、绿。保存当前按住按钮的数字。? 表示这一轮没有按住按钮。","בדקו אדום, צהוב ואז ירוק. שמרו את ספרת הכפתור שמוחזק. ? מסמן תור שבו לא הוחזק כפתור."],"example":"if rbutton.value() == 0:\n    answer = answer + \"1\"\nelif ybutton.value() == 0:\n    answer = answer + \"2\""},"flash":{"title":"order","meaning":["order saves the digits of the lights shown. This uses the same list and random-light commands as the class game.","order хранит цифры показанных ламп. Здесь используются знакомые список и команды случайных огней.","order 保存已显示灯光的数字。这里使用课堂游戏中相同的列表和随机闪灯命令。","order שומר את ספרות האורות שהוצגו. משתמשים באותה רשימה ובפקודות האור האקראי מהמשחק בכיתה."],"example":"number = random.randint(0, 2)\norder = order + str(number + 1)"},"compare":{"title":"answer == order","meaning":["Compare the saved button digits with the light digits. Every digit must be in the same place.","Сравни цифры сохранённых кнопок с цифрами ламп. Каждая цифра должна стоять на своём месте.","把保存的按键数字与灯光数字比较。每个数字的位置都必须相同。","השוו את ספרות הכפתורים שנשמרו לספרות האורות. כל ספרה צריכה להיות באותו מקום."],"example":"if answer == order:\n    print(\"You win!\")"}},"stages":[{"title":["Read one button","Считай одну кнопку","读取一个按钮","קראו כפתור אחד"],"learn":["Find the numbers for pressed and released.","Найди числа для нажатой и отпущенной кнопки.","找到按下和松开对应的数字。","גלו אילו מספרים מתקבלים בלחיצה ובשחרור."],"concepts":["pin","read"],"tasks":[["Below the starter, add these lines. Run with red released.","Под стартовым кодом добавь эти строки. Запусти с отпущенной красной кнопкой.","在起始代码下方添加这些行。松开红色按钮并运行。","הוסיפו את השורות מתחת לקוד ההתחלה. הריצו כשהאדום משוחרר."],["Run again. Hold red during the wait, until the number appears.","Запусти снова. Держи красную кнопку во время паузы до появления числа.","再次运行。在等待期间按住红色按钮，直到数字出现。","הריצו שוב. החזיקו אדום בזמן ההמתנה עד שהמספר מופיע."]],"place":["Add below the starter.","Добавь под стартовым кодом.","加在起始代码下方。","הוסיפו מתחת לקוד ההתחלה."],"snippet":"time.sleep(3)\nprint(rbutton.value())","check":["Released gives 1. Held gives 0. Let go before the next Run.","Отпущенная даёт 1. Нажатая — 0. Перед следующим запуском отпусти.","松开时是 1，按住时是 0。下次运行前先松开。","משוחרר נותן 1. לחוץ נותן 0. שחררו לפני ההרצה הבאה."],"hint":["Check GP16, GND and Pin.PULL_UP if the number stays the same.","Если число не меняется, проверь GP16, GND и Pin.PULL_UP.","若数字一直不变，检查 GP16、GND 和 Pin.PULL_UP。","אם המספר לא משתנה, בדקו GP16, GND ו־Pin.PULL_UP."]},{"title":["Save one choice","Сохрани один выбор","保存一次选择","שמרו בחירה אחת"],"learn":["A red press adds \"1\" to the saved answer.","Нажатие красной добавляет «1» в ответ.","按住红色按钮会在答案末尾加上 \"1\"。","לחיצה אדומה מוסיפה \"1\" לתשובה השמורה."],"concepts":["blank","save","read"],"tasks":[["Replace the two test lines with this code. Run and hold red.","Замени две пробные строки этим кодом. Запусти и держи красную кнопку.","用这段代码替换两行测试代码。运行并按住红色按钮。","החליפו את שתי שורות הבדיקה בקוד הזה. הריצו והחזיקו אדום."],["Read the saved answer. Run again with the button released.","Прочитай сохранённый ответ. Запусти снова с отпущенной кнопкой.","查看保存的答案。松开按钮后再运行一次。","קראו את התשובה שנשמרה. הריצו שוב כשהכפתור משוחרר."]],"table":{"headers":[["Before","До","之前","לפני"],["Held button","Нажатая кнопка","按住的按钮","הכפתור המוחזק"],["After","После","之后","אחרי"]],"rows":[["\"\"",["Red","Красная","红","אדום"],"\"1\""],["\"1\"",["Green","Зелёная","绿","ירוק"],"\"13\""],["\"13\"",["Yellow","Жёлтая","黄","צהוב"],"\"132\""]]},"place":["Keep the starter. Replace everything below it.","Оставь стартовый код. Замени всё под ним.","保留起始代码，替换它下面的全部内容。","השאירו את קוד ההתחלה. החליפו את כל מה שמתחתיו."],"snippet":"answer = \"\"\nprint(\"Press and hold red.\")\ntime.sleep(3)\nif rbutton.value() == 0:\n    answer = answer + \"1\"\nprint(\"Saved:\", answer)","check":["Holding red prints Saved: 1. The table shows how later choices will join it.","Нажатая красная выводит Saved: 1. Таблица показывает, как добавятся следующие цифры.","按住红色按钮会显示 Saved: 1。表格展示之后的选择怎样接在末尾。","החזקת אדום מדפיסה Saved: 1. הטבלה מראה איך הבחירות הבאות יצטרפו."],"hint":["The quotes hold text. Keep answer = \"\" above the check.","В кавычках — текст. Оставь answer = \"\" перед проверкой.","引号内是文本。把 answer = \"\" 放在判断之前。","המירכאות מחזיקות טקסט. השאירו answer = \"\" מעל הבדיקה."]},{"title":["Save three choices","Сохрани три выбора","保存三次选择","שמרו שלוש בחירות"],"learn":["Use three turns. Save one digit at the end of each turn.","Сделай три хода. В конце каждого сохрани одну цифру.","进行三轮。每轮结束时保存一个数字。","שחקו שלושה תורים. שמרו ספרה אחת בסוף כל תור."],"concepts":["turns","save","choose","hold"],"tasks":[["Replace the code below the starter with this loop.","Замени код под стартовым этим циклом.","用这个循环替换起始代码下方的内容。","החליפו את הקוד שמתחת לקוד ההתחלה בלולאה הזאת."],["Before else, add yellow and green elif checks. Change the button names and saved digits using the table.","Перед else добавь проверки elif для жёлтой и зелёной. Измени имена кнопок и цифры по таблице.","在 else 前添加黄色和绿色按钮的 elif 判断。按表格修改按钮名称及保存的数字。","לפני else הוסיפו בדיקות elif לצהוב ולירוק. שנו את שמות הכפתורים והספרות לפי הטבלה."],["Run. Hold red until Saved appears, then let go. Use green for turn 2 and yellow for turn 3.","Запусти. Держи красную до Saved и отпусти. На ходе 2 держи зелёную, на ходе 3 — жёлтую.","运行。按住红色按钮直到出现 Saved，然后松开。第 2 轮用绿色，第 3 轮用黄色。","הריצו. החזיקו אדום עד שמופיע Saved ואז שחררו. בתור 2 השתמשו בירוק ובתור 3 בצהוב."]],"table":{"headers":[["Button","Кнопка","按钮","כפתור"],["Name","Имя","名称","שם"],["Save","Сохранить","保存","לשמור"]],"rows":[[["Red","Красная","红","אדום"],"rbutton","\"1\""],[["Yellow","Жёлтая","黄","צהוב"],"ybutton","\"2\""],[["Green","Зелёная","绿","ירוק"],"gbutton","\"3\""]]},"place":["The whole turn is indented under for. Keep answer = \"\" above it.","Весь ход имеет отступ внутри for. Оставь answer = \"\" перед ним.","整轮代码缩进在 for 下方。把 answer = \"\" 留在循环上方。","כל התור מוזח תחת for. השאירו answer = \"\" מעליו."],"snippet":"answer = \"\"\nfor i in range(3):\n    print(\"Press and hold one button.\")\n    time.sleep(3)\n    if rbutton.value() == 0:\n        answer = answer + \"1\"\n    # Add yellow and green elif checks here.\n    else:\n        answer = answer + \"?\"\n    print(\"Saved:\", answer)\n    print(\"Let go.\")\n    time.sleep(2)","check":["The saved text grows from 1 to 13 to 132. A ? means a turn was missed. Hold until Saved, then let go.","Текст растёт от 1 до 13 и 132. ? означает пропущенный ход. Держи до Saved, затем отпускай.","保存的文本从 1 变成 13，再变成 132。? 表示漏过了一轮。按住直到 Saved，然后松开。","הטקסט גדל מ־1 ל־13 ואז ל־132. ? מסמן תור שהוחמץ. החזיקו עד Saved ואז שחררו."],"hint":["Use one button at a time. The program reads it once, after the three-second wait.","Держи одну кнопку за раз. Программа считывает её один раз после паузы в три секунды.","每次只按住一个按钮。程序在三秒等待后读取一次。","החזיקו כפתור אחד בכל פעם. התוכנית קוראת אותו פעם אחת אחרי ההמתנה של שלוש שניות."]},{"title":["Show the light pattern","Покажи порядок огней","显示灯光顺序","הציגו את רצף האורות"],"learn":["Show three lights before asking for the button choices.","Покажи три огня перед ответом кнопками.","先显示三次灯光，再让玩家按按钮。","הציגו שלושה אורות לפני שמבקשים בחירות בכפתורים."],"concepts":["flash","turns"],"tasks":[["Keep the working button loop. Add this light block just above answer = \"\".","Оставь рабочий цикл кнопок. Добавь блок огней прямо перед answer = \"\".","保留已经工作的按钮循环。在 answer = \"\" 正上方加入这段灯光代码。","השאירו את לולאת הכפתורים שעובדת. הוסיפו את קטע האורות ממש מעל answer = \"\"."],["Temporarily add print(order) after the light block. Run and check that its digits match the lights.","Временно добавь print(order) после блока огней. Запусти и сверь цифры с огнями.","暂时在灯光代码后加入 print(order)。运行，检查数字是否与灯光相符。","הוסיפו זמנית print(order) אחרי קטע האורות. הריצו ובדקו שהספרות מתאימות לאורות."]],"place":["Add above answer = \"\". The button loop stays below.","Добавь перед answer = \"\". Цикл кнопок остаётся ниже.","加在 answer = \"\" 上方。按钮循环保留在下方。","הוסיפו מעל answer = \"\". לולאת הכפתורים נשארת מתחת."],"snippet":"leds = [rled, yled, gled]\norder = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(1)\n    leds[number].value(0)\n    time.sleep(1)","check":["Red is 1, yellow 2, green 3. There is a dark gap between flashes.","Красный — 1, жёлтый — 2, зелёный — 3. Между вспышками есть пауза без света.","红是 1，黄是 2，绿是 3。每次闪灯之间都有熄灯间隔。","אדום הוא 1, צהוב 2 וירוק 3. בין ההבהובים יש הפסקה חשוכה."],"hint":["Keep import random at the top. Each wait here is one second.","Оставь import random в начале. Каждая пауза здесь длится секунду.","把 import random 保留在顶部。这里每次等待都是一秒。","השאירו import random בראש הקוד. כל המתנה כאן נמשכת שנייה."]},{"title":["Check the saved answer","Проверь сохранённый ответ","检查保存的答案","בדקו את התשובה שנשמרה"],"learn":["Compare the saved button digits with the light digits.","Сравни цифры кнопок с цифрами огней.","比较保存的按键数字与灯光数字。","השוו את ספרות הכפתורים שנשמרו לספרות האורות."],"concepts":["compare","save"],"tasks":[["Remove the temporary print(order). Add this check after the button loop, at the left margin.","Удали временный print(order). Добавь проверку после цикла кнопок, без отступа.","删除临时的 print(order)。在按钮循环结束后，从最左边开始添加这个判断。","מחקו את print(order) הזמני. הוסיפו את הבדיקה אחרי לולאת הכפתורים, בשוליים."],["Run. Watch, then hold each matching button during its turn. Try a correct order and a wrong order.","Запусти. Посмотри, затем держи нужную кнопку на каждом ходе. Проверь верный и неверный порядок.","运行。观察灯光，然后在每一轮按住对应按钮。试一次正确顺序和一次错误顺序。","הריצו. צפו ואז החזיקו כל כפתור מתאים בתורו. נסו רצף נכון ורצף שגוי."]],"place":["Add at the bottom, with no spaces before if.","Добавь внизу. Перед if нет пробелов.","加在底部，if 前不留空格。","הוסיפו בתחתית, בלי רווחים לפני if."],"snippet":"if answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The lights were\", order)","check":["A matching saved answer wins. A wrong digit or ? gives Try again. Press Stop, then Run for a new round.","Совпавший ответ даёт победу. Неверная цифра или ? даёт Try again. Для нового раунда нажми Stop, затем Run.","保存的答案相符就获胜。错误数字或 ? 会显示 Try again。点击 Stop 再点 Run，开始新一轮。","תשובה שמורה מתאימה מנצחת. ספרה שגויה או ? נותנים Try again. לחצו Stop ואז Run לסיבוב חדש."],"hint":["order stores the lights. answer stores the buttons. Both must be in the same order.","order хранит огни. answer хранит кнопки. Их порядок должен совпасть.","order 保存灯光，answer 保存按钮。两者顺序必须一致。","order שומר את האורות. answer שומר את הכפתורים. הסדר בשניהם צריך להיות זהה."]}],"challenges":[{"title":["Give the player less time","Дай игроку меньше времени","缩短玩家的时间","תנו לשחקן פחות זמן"],"problem":["Can you still enter the pattern with two seconds for each choice?","Сможешь ли ввести порядок с двумя секундами на каждый выбор?","每次选择只有两秒时，你还能输入正确顺序吗？","האם תצליחו להזין את הרצף כשיש שתי שניות לכל בחירה?"],"tasks":[["In the button loop, change time.sleep(3) to time.sleep(2).","В цикле кнопок замени time.sleep(3) на time.sleep(2).","在按钮循环中，把 time.sleep(3) 改为 time.sleep(2)。","בלולאת הכפתורים שנו time.sleep(3) ל־time.sleep(2)."],["Keep the release pause at two seconds. Test one correct and one wrong order.","Оставь две секунды на отпускание. Проверь верный и неверный порядок.","松开按钮的暂停仍保持两秒。测试一次正确和一次错误顺序。","השאירו את הפסקת השחרור בשתי שניות. בדקו רצף נכון ורצף שגוי."]],"success":[["The game saves three choices and checks the same shown pattern.","Игра сохраняет три выбора и проверяет показанный порядок.","游戏保存三次选择，并与显示的灯光顺序比较。","המשחק שומר שלוש בחירות ובודק מול הרצף שהוצג."]],"concepts":["hold"]}],"rubric":[],"exit":[["Show how a red choice adds \"1\" to answer.","Покажи, как красная кнопка добавляет «1» в answer.","展示红色按钮怎样把 \"1\" 加到 answer 末尾。","הראו איך בחירה באדום מוסיפה \"1\" ל־answer."],["Explain why answer = \"\" belongs above the loop.","Объясни, почему answer = \"\" стоит перед циклом.","解释为什么 answer = \"\" 要放在循环上方。","הסבירו למה answer = \"\" נמצא מעל הלולאה."]],"diagram":"{\n  \"version\": 1,\n  \"author\": \"NTSOMNII \\u00b7 Tech for Change\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"wokwi-pi-pico\",\n      \"id\": \"pico\",\n      \"top\": 152,\n      \"left\": 112,\n      \"attrs\": {}\n    },\n    {\n      \"type\": \"wokwi-led\",\n      \"id\": \"led0\",\n      \"top\": 0,\n      \"left\": 0,\n      \"attrs\": {\n        \"color\": \"red\",\n        \"label\": \"1 RED\"\n      }\n    },\n    {\n      \"type\": \"wokwi-resistor\",\n      \"id\": \"r0\",\n      \"top\": 65,\n      \"left\": -7,\n      \"rotate\": 90,\n      \"attrs\": {\n        \"value\": \"330\"\n      }\n    },\n    {\n      \"type\": \"wokwi-led\",\n      \"id\": \"led1\",\n      \"top\": 0,\n      \"left\": 107,\n      \"attrs\": {\n        \"color\": \"yellow\",\n        \"label\": \"2 YELLOW\"\n      }\n    },\n    {\n      \"type\": \"wokwi-resistor\",\n      \"id\": \"r1\",\n      \"top\": 65,\n      \"left\": 100,\n      \"rotate\": 90,\n      \"attrs\": {\n        \"value\": \"330\"\n      }\n    },\n    {\n      \"type\": \"wokwi-led\",\n      \"id\": \"led2\",\n
