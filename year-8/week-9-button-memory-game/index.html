<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 8 Week 9 · Memory game: press the pattern</title><link rel="stylesheet" href="../../game-studio/style.css?v=20261122"><script>window.GAME_LESSON={"year": 8, "week": 9, "title": ["Memory game: press the pattern", "Игра памяти: повтори кнопками", "记忆游戏：按出顺序", "משחק זיכרון: לחצו את הרצף"], "platform": "Python · Wokwi Pico", "context": ["Turn your Week 8 game into a button game", "Преврати игру урока 8 в игру с кнопками", "把第 8 课游戏变成按钮游戏", "הפכו את המשחק משבוע 8 למשחק כפתורים"], "brief": ["Watch the lights. Press the matching buttons in the same order to win. Your Week 8 light code stays; the buttons replace typing.", "Следи за огнями. Нажми соответствующие кнопки в том же порядке для победы. Код огней урока 8 остаётся; кнопки заменяют текст.", "观察灯光，按相同顺序按对应按钮即可获胜。保留第 8 课灯光代码，用按钮替代键盘输入。", "צפו באורות. לחצו על הכפתורים המתאימים באותו סדר כדי לנצח. קוד האורות משבוע 8 נשאר; הכפתורים מחליפים הקלדה."], "objectives": [["Read a button using Pin.IN and Pin.PULL_UP.", "Читать кнопку с Pin.IN и Pin.PULL_UP.", "用 Pin.IN 和 Pin.PULL_UP 读取按钮。", "לקרוא כפתור בעזרת Pin.IN ו־Pin.PULL_UP."], ["Record three separate presses as the answer text.", "Записать три отдельных нажатия как текст ответа.", "把三次独立按下记录为答案文本。", "לרשום שלוש לחיצות נפרדות כטקסט התשובה."], ["Reuse Week 8’s random pattern and compare the two orders.", "Использовать случайный порядок урока 8 и сравнить оба порядка.", "复用第 8 课随机顺序，比较两个顺序。", "להשתמש ברצף האקראי משבוע 8 ולהשוות בין שני הסדרים."]], "launch": {"url": "https://wokwi.com/projects/481338971523815425", "label": ["Open the ready-wired Pico", "Открыть готовый Pico", "打开已接线的 Pico", "פתחו Pico מחווט"]}, "figure": "../../game-studio/diagrams/pico-buttons.png", "figureCaption": ["LEDs: GP15 red, GP13 yellow, GP14 green. Buttons: GP16 red, GP17 yellow, GP18 green. Each button joins its input to GND.", "LED: GP15 красный, GP13 жёлтый, GP14 зелёный. Кнопки: GP16 красная, GP17 жёлтая, GP18 зелёная. Кнопка соединяет вход с GND.", "LED：GP15 红、GP13 黄、GP14 绿。按钮：GP16 红、GP17 黄、GP18 绿。每个按钮连接对应输入与 GND。", "נוריות: GP15 אדום, GP13 צהוב, GP14 ירוק. כפתורים: GP16 אדום, GP17 צהוב, GP18 ירוק. כל כפתור מחבר את הקלט שלו ל־GND."], "setup": [["Open the starter. The three LEDs and three buttons are already wired.", "Открой заготовку. Три LED и три кнопки уже соединены.", "打开起始项目，三盏 LED 与三个按钮已接好。", "פתחו את פרויקט ההתחלה. שלוש הנוריות ושלושת הכפתורים כבר מחווטים."], ["Find main.py. The first program reads the red button. You do not need a physical Pico.", "Найди main.py. Первая программа читает красную кнопку. Настоящий Pico не нужен.", "找到 main.py。第一个程序读取红色按钮，不需要实体 Pico。", "מצאו main.py. התוכנית הראשונה קוראת את הכפתור האדום. אין צורך ב־Pico פיזי."], ["If building the wiring yourself, use button contact 1.l for GP16, GP17 or GP18 and contact 2.l for GND.", "При сборке используй контакт 1.l для GP16, GP17 или GP18, а 2.l — для GND.", "若自行接线，按钮触点 1.l 接 GP16、GP17 或 GP18，2.l 接 GND。", "אם מחווטים לבד, חברו מגע 1.l ל־GP16, GP17 או GP18 ומגע 2.l ל־GND."]], "cards": {"pin": {"title": "Pin.IN / Pin.PULL_UP", "meaning": ["Pin.IN makes a pin read an input. Pin.PULL_UP holds it at 1 until the button connects it to GND. Pressed is 0.", "Pin.IN читает вход. Pin.PULL_UP держит 1, пока кнопка не соединит вывод с GND. Нажата — 0.", "Pin.IN 将引脚设为输入。Pin.PULL_UP 让读数保持 1，直到按钮连接到 GND。按下时为 0。", "Pin.IN מגדיר קלט. Pin.PULL_UP שומר 1 עד שהכפתור מחבר ל־GND. לחוץ הוא 0."], "example": "rbutton = Pin(16, Pin.IN, Pin.PULL_UP)"}, "value": {"title": ".value()", "meaning": ["With empty brackets, value() reads the button. For an LED, value(1) turns it on and value(0) turns it off.", "Пустые скобки value() читают кнопку. Для LED value(1) включает, value(0) выключает.", "空括号 value() 读取按钮。LED 的 value(1) 开灯，value(0) 关灯。", "בסוגריים ריקים value() קורא כפתור. בנורית value(1) מדליק ו־value(0) מכבה."], "example": "print(rbutton.value())"}, "mapping": {"title": "buttons[number]", "meaning": ["The buttons list follows the LEDs: position 0 is red, 1 yellow, 2 green. The player digits are 1, 2 and 3, just as in Week 8.", "Список кнопок как у LED: 0 — красный, 1 — жёлтый, 2 — зелёный. Цифры игрока — 1, 2 и 3, как в уроке 8.", "按钮列表与 LED 相同：位置 0 红、1 黄、2 绿。玩家数字仍与第 8 课一样为 1、2、3。", "רשימת הכפתורים כמו הנוריות: מיקום 0 אדום, 1 צהוב, 2 ירוק. ספרות השחקן הן 1, 2, 3 כמו בשבוע 8."], "example": "buttons = [rbutton, ybutton, gbutton]\nbuttons[0].value()"}, "wait": {"title": "number = -1 / while number == -1", "meaning": ["-1 is our marker for no button yet. The loop keeps reading until a button changes number to 0, 1 or 2. This uses a condition with the while you met in Week 8.", "-1 — наш знак «кнопки пока нет». Цикл читает, пока нажатие не заменит number на 0, 1 или 2. Это условие для знакомого while.", "-1 是“尚未按下”的标记。循环不断读取，直到按钮让 number 变为 0、1 或 2。这里给第 8 课学过的 while 加上条件。", "-1 הוא הסימן שלנו שעדיין אין כפתור. הלולאה קוראת עד שלחיצה משנה number ל־0, 1 או 2. זה תנאי עבור while שכבר פגשתם בשבוע 8."], "example": "number = -1\nwhile number == -1:"}, "choice": {"title": "if / elif", "meaning": ["Check red first, then yellow, then green. A pressed button stores its list position in number. Press one button at a time.", "Проверь красный, затем жёлтый, затем зелёный. Нажатие сохраняет позицию в number. Нажимай по одной кнопке.", "依次检查红、黄、绿。按下按钮后，把它的列表位置保存到 number。每次只按一个按钮。", "בודקים אדום, אחר כך צהוב ואז ירוק. לחיצה שומרת את מיקום הרשימה ב־number. לחצו על כפתור אחד בכל פעם."], "example": "if rbutton.value() == 0:\n    number = 0\nelif ybutton.value() == 0:\n    number = 1"}, "digit": {"title": "str(number + 1)", "meaning": ["Add 1 to turn position 0 into player digit 1. str() makes text so it can join answer. This is the same rule used to record the lights in Week 8.", "Прибавь 1: позиция 0 станет цифрой 1. str() делает текст для answer. Это то же правило, что для огней в уроке 8.", "加 1，把位置 0 变成玩家数字 1。str() 转成文本，才能拼接到 answer。这与第 8 课记录灯光的规则相同。", "מוסיפים 1 כדי להפוך מיקום 0 לספרה 1. str() הופך לטקסט שאפשר לצרף ל־answer. זה אותו כלל מרישום האורות בשבוע 8."], "example": "answer = answer + str(number + 1)"}, "release": {"title": "Wait for release", "meaning": ["A held button still reads 0. This loop waits for 1 before the next press can count. The short pauses let the contact settle.", "Удерживаемая кнопка даёт 0. Цикл ждёт 1 перед следующим нажатием. Короткие паузы дают контакту успокоиться.", "按住时仍读到 0。此循环等到读数为 1，才允许下一次计数。短暂停顿让触点稳定。", "כפתור מוחזק עדיין קורא 0. הלולאה מחכה ל־1 לפני שסופרים לחיצה נוספת. ההמתנות הקצרות נותנות למגע להתייצב."], "example": "while buttons[number].value() == 0:\n    time.sleep(0.01)\ntime.sleep(0.03)"}, "three": {"title": "for press in range(3)", "meaning": ["Repeat the indented block three times. Each turn collects one complete press and release. Clear answer before this loop, not inside it.", "Повтори блок три раза. Каждый повтор собирает одно нажатие с отпусканием. Очищай answer до цикла, а не внутри.", "重复缩进代码三次，每次收集一次完整按下和松开。answer 要在循环前清空，不能放在里面。", "חוזרים על הבלוק שלוש פעמים. כל חזרה אוספת לחיצה ושחרור שלמים. מנקים answer לפני הלולאה, לא בתוכה."], "example": "answer = \"\"\nfor press in range(3):"}, "random": {"title": "Week 8: random.randint()", "meaning": ["Reuse your Week 8 loop. It chooses positions 0 to 2, flashes that LED and adds the matching player digit to order. A colour can repeat.", "Используй цикл урока 8: выбирается позиция 0–2, мигает LED и цифра добавляется в order. Цвет может повториться.", "复用第 8 课的循环：选择位置 0 到 2，闪对应灯，把玩家数字加到 order。颜色可以重复。", "השתמשו בלולאה משבוע 8. היא בוחרת מיקום 0 עד 2, מהבהבת בנורית ומוסיפה את הספרה המתאימה ל־order. צבע יכול לחזור."], "example": "order = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(speed)\n    leds[number].value(0)\n    time.sleep(speed)\n"}, "compare": {"title": "answer == order", "meaning": ["Compare the player’s three digits with the lights’ three digits. Every digit and its position must match. Buttons replace input(); the decision stays the same.", "Сравни три цифры игрока и огней. Цифры и места должны совпасть. Кнопки заменяют input(), решение прежнее.", "比较玩家与灯光的三个数字，每个数字和位置都要相同。按钮替代 input()，判断规则不变。", "משווים את שלוש ספרות השחקן לשלוש ספרות האורות. כל ספרה ומיקום צריכים להתאים. הכפתורים מחליפים input(), ההחלטה נשארת זהה."], "example": "if answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)"}, "rounds": {"title": "for round in range(3) / score", "meaning": ["Keep score = 0 before the rounds loop. Add 1 only inside the correct-answer branch. Put the final print after the loop, at the left margin.", "score = 0 ставится до цикла раундов. Добавляй 1 только при верном ответе. Итоговый print — после цикла без отступа.", "score = 0 放在回合循环前。只在答对分支中加 1。最终 print 放在循环后，从最左侧开始。", "שימו score = 0 לפני לולאת הסיבובים. הוסיפו 1 רק בענף התשובה הנכונה. ההדפסה הסופית אחרי הלולאה, בלי הזחה."], "example": "score = 0\nfor round in range(3):\n    print(\"Round\", round + 1)"}}, "stages": [{"title": ["Read one button", "Прочитай одну кнопку", "读取一个按钮", "קראו כפתור אחד"], "learn": ["Learn the difference between LED output and button input.", "Различи выход LED и вход кнопки.", "区分 LED 输出和按钮输入。", "הבחינו בין פלט לנורית וקלט מכפתור."], "tasks": [["Open the ready-wired starter. Press Run, then hold and release the red button.", "Открой готовую схему. Нажми Run, затем удержи и отпусти красную кнопку.", "打开已接线的起始项目。点 Run，按住并松开红色按钮。", "פתחו את פרויקט ההתחלה המחווט. לחצו Run ואז החזיקו ושחררו את הכפתור האדום."], ["Read the new rbutton line near the top of main.py. Find GP16 and GND on the wiring diagram.", "Прочитай новую строку rbutton в начале main.py. Найди GP16 и GND на схеме.", "阅读 main.py 顶部的新 rbutton 行，在图中找到 GP16 和 GND。", "קראו את שורת rbutton החדשה בראש main.py. מצאו GP16 ו־GND בתרשים."]], "concepts": ["pin", "value"], "check": ["The terminal shows 1 when released and 0 while pressed.", "В терминале 1 при отпускании и 0 при нажатии.", "终端在松开时显示 1，按下时显示 0。", "במסוף מופיע 1 כשמשחררים ו־0 כשלוחצים。"], "snippet": "rbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nprint(rbutton.value())", "place": ["These lines are already in the starter. Read them before changing anything.", "Строки уже есть в заготовке. Прочитай их перед изменением.", "这些代码已经在起始项目中，修改前先读懂。", "השורות כבר נמצאות בקוד ההתחלה. קראו לפני שמשנים."], "full": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\nwhile True:\n    print(rbutton.value())  # Released = 1. Pressed = 0.\n    time.sleep(0.2)\n", "figure": null, "caption": null, "hint": null, "table": null, "exampleOnly": true}, {"title": ["A press becomes a digit", "Нажатие становится цифрой", "把按下变成数字", "לחיצה הופכת לספרה"], "learn": ["Use the same 1, 2, 3 player digits as Week 8.", "Используй те же цифры 1, 2, 3, что в уроке 8.", "使用与第 8 课相同的玩家数字 1、2、3。", "השתמשו באותן ספרות שחקן 1, 2, 3 משבוע 8."], "tasks": [["Stop. Keep the imports, Pin lines, lists and speed. Replace the while True reading loop with this block.", "Останови. Оставь импорты, Pin, списки и speed. Замени читающий цикл while True этим блоком.", "停止。保留导入、Pin 设置、列表和 speed，用此代码块替换读取用的 while True 循环。", "עצרו. השאירו ייבוא, שורות Pin, רשימות ו־speed. החליפו את לולאת הקריאה while True בבלוק הזה."], ["Run and press one button. Red should print 1, yellow 2, green 3. Stop and Run for each new try.", "Запусти и нажми кнопку. Красная выводит 1, жёлтая 2, зелёная 3. Для новой попытки Stop и Run.", "运行并按一个按钮。红打印 1，黄打印 2，绿打印 3。每次新尝试前先 Stop 再 Run。", "הריצו ולחצו כפתור אחד. אדום צריך להדפיס 1, צהוב 2 וירוק 3. עצרו והריצו לכל ניסיון חדש."]], "concepts": ["mapping", "wait", "choice", "digit", "release"], "check": ["One complete press gives the correct digit. Holding it does not print a stream of digits.", "Одно нажатие даёт нужную цифру. Удержание не печатает поток цифр.", "一次完整按下得到正确数字，按住不会打印一串数字。", "לחיצה שלמה נותנת את הספרה הנכונה. החזקה אינה מדפיסה רצף ספרות."], "snippet": "number = -1                    # No button chosen yet.\nwhile number == -1:             # Keep checking until a press.\n    if rbutton.value() == 0:\n        number = 0              # Red is list position 0.\n    elif ybutton.value() == 0:\n        number = 1              # Yellow is position 1.\n    elif gbutton.value() == 0:\n        number = 2              # Green is position 2.\n    time.sleep(0.01)\n\nanswer = str(number + 1)         # Same digits as Week 8: 1, 2, 3.\nprint(answer)\nwhile buttons[number].value() == 0:\n    time.sleep(0.01)            # Wait until this button is released.\ntime.sleep(0.03)                # Let the contact settle.\n", "place": ["Replace only the reading loop below speed = 1.", "Замени только читающий цикл ниже speed = 1.", "只替换 speed = 1 下方的读取循环。", "החליפו רק את לולאת הקריאה מתחת ל־speed = 1."], "full": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\nnumber = -1                    # No button chosen yet.\nwhile number == -1:             # Keep checking until a press.\n    if rbutton.value() == 0:\n        number = 0              # Red is list position 0.\n    elif ybutton.value() == 0:\n        number = 1              # Yellow is position 1.\n    elif gbutton.value() == 0:\n        number = 2              # Green is position 2.\n    time.sleep(0.01)\n\nanswer = str(number + 1)         # Same digits as Week 8: 1, 2, 3.\nprint(answer)\nwhile buttons[number].value() == 0:\n    time.sleep(0.01)            # Wait until this button is released.\ntime.sleep(0.03)                # Let the contact settle.\n", "figure": null, "caption": null, "hint": null, "table": null}, {"title": ["Collect three presses", "Собери три нажатия", "收集三次按下", "אספו שלוש לחיצות"], "learn": ["Build the answer as text, one digit at a time.", "Собери ответ как текст по одной цифре.", "每次加一个数字，组成文本答案。", "בנו את התשובה כטקסט, ספרה אחת בכל פעם."], "tasks": [["Replace the code below speed = 1 with this three-press version. Keep the setup above it.", "Замени код ниже speed = 1 версией на три нажатия. Оставь настройки выше.", "把 speed = 1 下方代码换成三次按下版本，保留前面的设置。", "החליפו את הקוד שמתחת ל־speed = 1 בגרסת שלוש הלחיצות. השאירו את ההגדרות שמעליו."], ["Add print(answer) after the loop, with no spaces before it. Run: press red, green, yellow, releasing each time.", "Добавь print(answer) после цикла без отступа. Запусти: красная, зелёная, жёлтая с отпусканием.", "在循环后加 print(answer)，行首不加空格。运行，依次按红、绿、黄，每次都松开。", "הוסיפו print(answer) אחרי הלולאה בלי רווחים בהתחלה. הריצו: לחצו אדום, ירוק, צהוב ושחררו בכל פעם."]], "concepts": ["three", "digit", "release"], "check": ["It prints 132 after exactly three presses. Try red, red, yellow: it should print 112. A long hold still counts only once.", "После трёх нажатий выводится 132. Красная, красная, жёлтая даст 112. Удержание считается один раз.", "恰好三次按下后打印 132。红、红、黄应打印 112，长按仍只算一次。", "אחרי שלוש לחיצות בדיוק מודפס 132. אדום, אדום, צהוב צריך להדפיס 112. החזקה ארוכה עדיין נספרת פעם אחת."], "snippet": "answer = \"\"                         # Clear the player's answer.\nfor press in range(3):               # Collect exactly three presses.\n    number = -1\n    while number == -1:\n        if rbutton.value() == 0:\n            number = 0\n        elif ybutton.value() == 0:\n            number = 1\n        elif gbutton.value() == 0:\n            number = 2\n        time.sleep(0.01)\n    answer = answer + str(number + 1)\n    while buttons[number].value() == 0:\n        time.sleep(0.01)            # A hold must not add extra digits.\n    time.sleep(0.03)\n\nprint(answer)", "place": ["Below speed = 1. Do not put print(answer) inside the for loop.", "Ниже speed = 1. Не ставь print(answer) внутрь for.", "放在 speed = 1 下面，不要把 print(answer) 放进 for 循环。", "מתחת ל־speed = 1. אל תשימו print(answer) בתוך לולאת for."], "full": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\nanswer = \"\"                         # Clear the player's answer.\nfor press in range(3):               # Collect exactly three presses.\n    number = -1\n    while number == -1:\n        if rbutton.value() == 0:\n            number = 0\n        elif ybutton.value() == 0:\n            number = 1\n        elif gbutton.value() == 0:\n            number = 2\n        time.sleep(0.01)\n    answer = answer + str(number + 1)\n    while buttons[number].value() == 0:\n        time.sleep(0.01)            # A hold must not add extra digits.\n    time.sleep(0.03)\n\nprint(answer)", "figure": null, "caption": null, "hint": null, "table": null}, {"title": ["Join it to the lights", "Соедини с огнями", "与灯光游戏连接", "חברו לאורות"], "learn": ["Replace the typed guess with your three button presses.", "Замени ввод текста тремя нажатиями.", "用三次按钮按下替代键盘输入。", "החליפו ניחוש מוקלד בשלוש לחיצות כפתור."], "tasks": [["Use Complete code for this step to join the Week 8 flashes to your button code. There is no input() line now.", "Используй полный код шага, чтобы соединить огни урока 8 с кнопками. Строки input() больше нет.", "使用本步骤完整代码，把第 8 课闪灯与按钮代码连接。现在不再有 input() 行。", "השתמשו בקוד המלא לשלב כדי לחבר את ההבהובים משבוע 8 לקוד הכפתורים. כעת אין שורת input()."], ["Run. Watch three flashes. After Your turn!, press their buttons in the same order, releasing each time.", "Запусти. Посмотри три вспышки. После Your turn! нажми кнопки в том же порядке с отпусканием.", "运行，观察三次闪灯。出现 Your turn! 后按同样顺序按按钮，每次都松开。", "הריצו וצפו בשלושה הבהובים. אחרי Your turn! לחצו על הכפתורים באותו סדר ושחררו בכל פעם."]], "concepts": ["random", "compare"], "check": ["The right order prints You win! A wrong order prints Try again and shows the correct digits. Restart for another game.", "Верный порядок выводит You win! Ошибка — Try again и верные цифры. Перезапусти для новой игры.", "顺序正确显示 You win!，错误显示 Try again 和正确数字。重新启动开始新游戏。", "הסדר הנכון מדפיס You win!. סדר שגוי מדפיס Try again ומראה את הספרות הנכונות. הפעילו מחדש למשחק נוסף."], "snippet": "if answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)", "place": ["This decision goes after the three-press loop, at the left margin. The complete version includes the flashes and setup.", "Решение идёт после цикла нажатий без отступа. Полная версия содержит огни и настройки.", "判断放在三次按下循环之后，从最左侧开始。完整版本含闪灯与所有设置。", "ההחלטה הזאת באה אחרי לולאת שלוש הלחיצות בלי הזחה. הגרסה המלאה כוללת הבהובים והגדרות."], "full": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\norder = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(speed)\n    leds[number].value(0)\n    time.sleep(speed)\n\nprint(\"Your turn! Press three buttons, one at a time.\")\nanswer = \"\"                         # Clear the player's answer.\nfor press in range(3):               # Collect exactly three presses.\n    number = -1\n    while number == -1:\n        if rbutton.value() == 0:\n            number = 0\n        elif ybutton.value() == 0:\n            number = 1\n        elif gbutton.value() == 0:\n            number = 2\n        time.sleep(0.01)\n    answer = answer + str(number + 1)\n    while buttons[number].value() == 0:\n        time.sleep(0.01)            # A hold must not add extra digits.\n    time.sleep(0.03)\n\nif answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)\n", "figure": null, "caption": null, "hint": null, "table": null, "printTasks": [["Use the Complete game program at the end of this guide. Replace your whole program with it, then read the new lines in Learn.", "Возьми полную программу игры в конце руководства. Замени ею всю программу и разбери новые строки в разделе «Изучи».", "使用本指南末尾的完整游戏程序替换全部代码，再阅读“学习”中的新代码说明。", "השתמשו בתוכנית המשחק המלאה בסוף המדריך. החליפו בה את כל התוכנית ואז קראו את השורות החדשות בחלק הלמידה."], ["Run. Watch three flashes. After Your turn!, press their buttons in the same order, releasing each time.", "Запусти. Посмотри три вспышки. После Your turn! нажми кнопки в том же порядке с отпусканием.", "运行，观察三次闪灯。出现 Your turn! 后按同样顺序按按钮，每次都松开。", "הריצו וצפו בשלושה הבהובים. אחרי Your turn! לחצו על הכפתורים באותו סדר ושחררו בכל פעם."]]}], "challenges": [{"title": ["Three chances at the arcade", "Три попытки в аркаде", "街机三次机会", "שלוש הזדמנויות בארקדה"], "problem": ["A visitor should get three rounds, then see a final score out of 3. Each round needs a fresh light order and an empty answer.", "Посетитель получает три раунда и итог из 3. Каждый раунд — новый порядок и пустой ответ.", "每位游客得到三个回合，结束后显示满分 3 分的总分。每轮都要重新生成灯光顺序并清空答案。", "כל מבקר צריך לקבל שלושה סיבובים ואז לראות ניקוד מתוך 3. בכל סיבוב צריך סדר אורות חדש ותשובה ריקה."], "tasks": [["Put score = 0 before a new for round in range(3): loop. Put one complete game inside it.", "Поставь score = 0 перед новым for round in range(3):. Внутрь помести полную игру.", "在新的 for round in range(3): 循环前放 score = 0，把完整的一轮游戏放进去。", "שימו score = 0 לפני לולאת for round in range(3): חדשה. שימו בתוכה משחק שלם אחד."], ["Give one point only when answer == order. Print the final score once, after the rounds loop.", "Давай очко только при answer == order. Выведи итог один раз после цикла раундов.", "只有 answer == order 时加一分，在回合循环之后只显示一次最终分数。", "תנו נקודה רק כאשר answer == order. הדפיסו את הניקוד הסופי פעם אחת, אחרי לולאת הסיבובים."], ["Ask a partner to win two rounds and deliberately lose one. Then restart and check that score begins at 0.", "Пусть напарник выиграет два раунда и ошибётся в одном. Перезапусти и проверь начало с 0.", "让同伴赢两轮并故意输一轮，随后重新启动，检查分数是否从 0 开始。", "בקשו מבן זוג לנצח בשני סיבובים ולטעות באחד. הפעילו מחדש ובדקו שהניקוד מתחיל ב־0."]], "success": [["Exactly three rounds. Two wins give 2 out of 3. Neither order nor answer grows across rounds.", "Ровно три раунда. Две победы дают 2 из 3. order и answer не растут между раундами.", "恰好三个回合，两胜为 2/3，order 与 answer 不会跨回合越变越长。", "בדיוק שלושה סיבובים. שני ניצחונות נותנים 2 מתוך 3. order ו־answer אינם גדלים מסיבוב לסיבוב."]], "hint": ["Keep order = \"\" and answer = \"\" inside the rounds loop. Keep score = 0 outside it. The teacher has a worked example.", "order = \"\" и answer = \"\" внутри цикла раундов, score = 0 снаружи. У учителя есть пример.", "order = \"\" 与 answer = \"\" 放在回合循环内，score = 0 放在外面。教师页有参考示例。", "השאירו order = \"\" ו־answer = \"\" בתוך לולאת הסיבובים. score = 0 נשאר בחוץ. למורה יש דוגמה פתורה."], "concepts": ["rounds"]}], "solutions": [{"title": "One-round button game", "code": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\norder = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(speed)\n    leds[number].value(0)\n    time.sleep(speed)\n\nprint(\"Your turn! Press three buttons, one at a time.\")\nanswer = \"\"                         # Clear the player's answer.\nfor press in range(3):               # Collect exactly three presses.\n    number = -1\n    while number == -1:\n        if rbutton.value() == 0:\n            number = 0\n        elif ybutton.value() == 0:\n            number = 1\n        elif gbutton.value() == 0:\n            number = 2\n        time.sleep(0.01)\n    answer = answer + str(number + 1)\n    while buttons[number].value() == 0:\n        time.sleep(0.01)            # A hold must not add extra digits.\n    time.sleep(0.03)\n\nif answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)\n"}, {"title": "Three-round arcade game", "code": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\nscore = 0\nfor round in range(3):       # Every visitor gets three rounds.\n    print(\"Round\", round + 1)\n    order = \"\"\n    for i in range(3):\n        number = random.randint(0, 2)\n        order = order + str(number + 1)\n        leds[number].value(1)\n        time.sleep(speed)\n        leds[number].value(0)\n        time.sleep(speed)\n\n    print(\"Your turn!\")\n    answer = \"\"                         # Clear the player's answer.\n    for press in range(3):               # Collect exactly three presses.\n        number = -1\n        while number == -1:\n            if rbutton.value() == 0:\n                number = 0\n            elif ybutton.value() == 0:\n                number = 1\n            elif gbutton.value() == 0:\n                number = 2\n            time.sleep(0.01)\n        answer = answer + str(number + 1)\n        while buttons[number].value() == 0:\n            time.sleep(0.01)            # A hold must not add extra digits.\n        time.sleep(0.03)\n\n    if answer == order:\n        score = score + 1\n        print(\"Correct! Score:\", score)\n    else:\n        print(\"The order was\", order)\n\nprint(\"Final score:\", score, \"out of 3\")\n"}], "codeMain": "from machine import Pin\nimport time\nimport random\n\nrled = Pin(15, Pin.OUT)\nyled = Pin(13, Pin.OUT)\ngled = Pin(14, Pin.OUT)\nrbutton = Pin(16, Pin.IN, Pin.PULL_UP)\nybutton = Pin(17, Pin.IN, Pin.PULL_UP)\ngbutton = Pin(18, Pin.IN, Pin.PULL_UP)\n\nrled.value(0)\nyled.value(0)\ngled.value(0)\n\nleds = [rled, yled, gled]\nbuttons = [rbutton, ybutton, gbutton]\nspeed = 1\n\norder = \"\"\nfor i in range(3):\n    number = random.randint(0, 2)\n    order = order + str(number + 1)\n    leds[number].value(1)\n    time.sleep(speed)\n    leds[number].value(0)\n    time.sleep(speed)\n\nprint(\"Your turn! Press three buttons, one at a time.\")\nanswer = \"\"                         # Clear the player's answer.\nfor press in range(3):               # Collect exactly three presses.\n    number = -1\n    while number == -1:\n        if rbutton.value() == 0:\n            number = 0\n        elif ybutton.value() == 0:\n            number = 1\n        elif gbutton.value() == 0:\n            number = 2\n        time.sleep(0.01)\n    answer = answer + str(number + 1)\n    while buttons[number].value() == 0:\n        time.sleep(0.01)            # A hold must not add extra digits.\n    time.sleep(0.03)\n\nif answer == order:\n    print(\"You win!\")\nelse:\n    print(\"Try again. The order was\", order)\n", "rubric": [[["Working", "Работает", "能运行", "עובד"], ["Three button presses replace the typed answer and a matching order wins.", "Три нажатия заменяют текст; совпадение даёт победу.", "三次按下代替键盘答案，顺序相同即可获胜。", "שלוש לחיצות מחליפות את ההקלדה וסדר תואם מנצח."]], [["Secure", "Уверенно", "掌握", "מבוסס"], ["A repeated colour works. A held button counts once. A wrong order fails.", "Повтор цвета работает. Удержание считается раз. Ошибка не проходит.", "重复颜色可正常输入，长按只算一次，错误顺序不会通过。", "צבע חוזר עובד. החזקה נספרת פעם אחת. סדר שגוי נכשל."]], [["Independent", "Самостоятельно", "能独立完成", "עצמאי"], ["Explain how a button position becomes a player digit, then adapt the game to three rounds.", "Объясни превращение позиции в цифру и переделай игру на три раунда.", "解释按钮位置如何变成玩家数字，再把游戏改为三个回合。", "הסבירו איך מיקום כפתור הופך לספרת שחקן ואז התאימו את המשחק לשלושה סיבובים."]]], "exit": [["Show a repeated colour working without counting a hold twice.", "Покажи повтор цвета без двойного счёта удержания.", "展示重复颜色可以输入，而按住不会计两次。", "הראו צבע חוזר שעובד בלי לספור החזקה פעמיים."], ["Point to the line that turns button position 0 into player digit 1.", "Покажи строку превращения позиции 0 в цифру 1.", "指出把按钮位置 0 变成玩家数字 1 的那行。", "הצביעו על השורה שהופכת מיקום כפתור 0 לספרה 1."], ["Explain which line replaced input() from Week 8.", "Объясни, что заменило input() из урока 8.", "解释哪些代码替代了第 8 课的 input()。", "הסבירו מה החליף את input() משבוע 8."]], "teacher": {"sections": [{"title": "Class learning considerations", "items": ["Use the teacher-revised Week 8 sequence: LED lists, zero-based positions, random.randint, text concatenation, range loops and while True. Do not assume functions or callbacks.", "Conditional while and the -1 no-press marker are explicit new applications. Each checkpoint has a complete runnable recovery version. The core game is one round; Stop and Run starts another."]}, {"title": "Learning objective and inquiry", "items": ["Replace the typed answer with three discrete button presses. Inquiry: how can the game tell a press from a hold?"]}, {"title": "Suggested lesson sequence", "items": ["40 minutes: 4 wiring orientation, 5 input readings, 9 one press, 8 three presses, 10 join to lights, 2 demonstration and 2 exit. Students may continue from their last secure checkpoint.", "Period 2 remains the separate Smart Beehive brainstorm session.", "Resources: a school laptop and school Tinkercad account; the coding guide links to the chosen simulator. Optional later physical kit per pair: Pico, three push buttons, three LEDs, three 330-ohm resistors, breadboard, jumper wires and USB cable."]}, {"title": "Differentiation", "items": ["Everyone works towards the same working product. Use the complete checkpoint code or the supplied dimensions when needed. Ask for an explanation of one change before removing a scaffold.", "Early finishers choose the problem in Extra challenges. Judge the behaviour and their explanation, not the amount of code copied."]}, {"title": "Assessment for learning", "items": ["Check red/1, yellow/2 and green/3, three separate presses, repeated colours, a held button and a wrong order. Ask students to point out where order and answer are cleared.", "The ready-wired circuit uses GP16/17/18 with pull-ups. LED pins stay GP15/13/14. A release wait and settling pause prevent a held press becoming several answers."]}, {"title": "Challenge", "items": ["Give an arcade visitor exactly three rounds. Two correct rounds must give 2 out of 3; a new game resets the score. Keep any faster-round extension within the Week 8 speed limit."]}, {"title": "Next steps", "items": ["Week 10 uses this three-button Pico game as the case brief. Reteach position-to-digit conversion if it cannot be explained without prompting."]}]}, "diagram": "{\n  \"version\": 1,\n  \"author\": \"NTSOMNII \\u00b7 Tech for Change\",\n  \"editor\": \"wokwi\",\n  \"parts\": [\n    {\n      \"type\": \"wokwi-pi-pico\",\n      \"id\": \"pico\",\n      \"top\": 152,\n
